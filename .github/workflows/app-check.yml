name: Home Assistant app check

on:
  push:
    paths:
      - "app/**"
      - "repository.yaml"
      - ".github/workflows/app-check.yml"
  pull_request:
    paths:
      - "app/**"
      - "repository.yaml"
      - ".github/workflows/app-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - name: Check Home Assistant configuration and plans
        run: python app/ha-config/validate_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build the interface
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
      - name: Ensure generated interface is committed
        run: git diff --exit-code -- app/www

  build-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: ${{ matrix.platform }}
          push: false
