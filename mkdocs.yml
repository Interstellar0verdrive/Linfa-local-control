site_name: Linfa Local Control
site_description: Guida indipendente al controllo locale delle serre Robonica Linfa
site_url: https://interstellar0verdrive.github.io/Linfa-local-control/
repo_url: https://github.com/Interstellar0verdrive/Linfa-local-control
repo_name: Interstellar0verdrive/Linfa-local-control
edit_uri: edit/main/docs/

theme:
  name: material
  language: it
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro

nav:
  - Introduzione: index.md
  - Guida di preparazione:
      - Percorso: setup/index.md
      - Panoramica: setup/panoramica.md
      - Hardware: setup/hardware.md
      - Raspberry Pi: setup/raspberry.md
      - Collegamento UART: setup/uart.md
      - Preparazione della serra: setup/preparazione-serra.md
      - Modifiche alla serra: setup/modifiche-serra.md
      - Rete: setup/rete.md
      - Controller e MQTT: setup/controller-mqtt.md
      - Home Assistant: setup/home-assistant.md

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
