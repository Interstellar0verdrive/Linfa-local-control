        data:
          option: "{{ trigger.to_state.state }}"

  # =========================================================================
  # WI-FI SERRA - toggle ON/OFF da HA (input_boolean.serra_wifi)
  # =========================================================================
  # ON  -> "net on"  : la serra sale sul wifi di casa (ssh); rcc resta off = no spam cloud
  # OFF -> "net off" : interfacce giu + rmmod mt_wifi (torna allo stato di boot)
  # Usa gli script serra_net_on / serra_net_off definiti sopra.
  - id: serra_wifi_toggle
    alias: "Serra: Wi-Fi Toggle"
    description: "Accende/spegne la wifi della serra dal toggle HA (input_boolean.serra_wifi)."
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.serra_wifi
        to: "on"
        id: wifi_on
      - platform: state
        entity_id: input_boolean.serra_wifi
        to: "off"
        id: wifi_off
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: wifi_on
            sequence:
              - action: script.serra_net_on
          - conditions:
              - condition: trigger
                id: wifi_off
            sequence:
              - action: script.serra_net_off

  # =========================================================================
  # BANCO LUCI (Light Lab): applica l'INTERO mix in un comando atomico.
  # Qualsiasi slider cambi (debounce 1s), manda "lights mix" leggendo i valori
  # CORRENTI di tutti e 5 i canali -> la serra imposta tutto in una sola sessione
  # UART. mode:single = i trigger ravvicinati collassano; ogni esecuzione applica
  # lo stato completo, quindi niente race/sovrascritture e il pannello riflette
  # SEMPRE esattamente gli slider (fix inconsistenza preset del 2026-07-11).
  # =========================================================================
  # (2026-07-12) L'automazione di sync live degli slider (serra_luce_lab_sync)
  # e' stata RIMOSSA: il mix si applica solo esplicitamente via
  # script.serra_luce_applica_mix (CTA "Applica colore" / script preset).

  # =========================================================================
  # SCHEDULE LUCI (fotoperiodo) - editabile da HA UI (time-picker + toggle).
  # Le transizioni usano Alba/Tramonto (fade). Il toggle serra_schedule_luci
  # abilita/disabilita tutto. reconcile all'avvio di HA rimette lo stato giusto.
  # =========================================================================
  - id: serra_luci_sched_on
    alias: "Serra: Schedule Luci - Accensione (Alba)"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_luci_on
    condition:
      # la coltivazione e' il MASTER: senza coltivazione la serra dorme
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_schedule_luci
        state: "on"
    action:
      - action: script.serra_luce_alba

  - id: serra_luci_sched_off
    alias: "Serra: Schedule Luci - Spegnimento (Tramonto)"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_luci_off
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_schedule_luci
        state: "on"
    action:
      - action: script.serra_luce_tramonto

  # Reconcile: all'avvio di HA, quando riattivi lo schedule o quando la
  # coltivazione parte/finisce, rimette le luci nello stato atteso ISTANTANEO.
  # SENZA coltivazione attiva lo stato atteso e' sempre SPENTO (serra dormiente).
  - id: serra_luci_sched_reconcile
    alias: "Serra: Schedule Luci - Reconcile"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_boolean.serra_schedule_luci
        to: "on"
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
      # M5 (2026-07-14): reagisci al CONFINE fotoperiodo. binary_sensor.serra_luci_
      # dovrebbero_essere_on dipende da serra_luci_on/off: quando "le luci
      # dovrebbero essere on" cambia — dawn/dusk MA anche per un cambio di
      # serra_luci_off (flip 12/12 confermato a meta' giornata, o ciclo accorciato)
      # — riconcilia il pannello. Prima il reconcile NON scattava su questo:
      # al flip serale le luci restavano ACCESE in pieno buio di fioritura.
      - platform: state
        entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
    condition:
      - condition: state
        entity_id: input_boolean.serra_schedule_luci
        state: "on"
    action:
      - choose:
          # coltivazione attiva + luci attese ON -> preset della fase corrente
          - conditions:
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              - condition: state
                entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
                state: "on"
            sequence:
              - action: script.serra_luce_applica_fase
        # niente coltivazione, o fuori orario -> spente
        default:
          - action: script.serra_luci_lab_off

  # =========================================================================
  # RICIRCOLO ACQUA a ORARI FISSI: scatta agli orari 1/2/3 abilitati, se lo
  # schedule generale e' attivo. Usa la DURATA-schedule (serra_acqua_durata_s),
  # separata dalla "Durata" manuale del test. trigger.id = numero slot.
  - id: serra_acqua_orari
    alias: "Serra: Acqua - Ricircolo a orari"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_acqua_ora_1
        id: "1"
      - platform: time
        at: input_datetime.serra_acqua_ora_2
        id: "2"
      - platform: time
        at: input_datetime.serra_acqua_ora_3
        id: "3"
    condition:
      # la coltivazione e' il MASTER: senza coltivazione niente ricircolo
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_schedule_acqua
        state: "on"
      # lo slot che ha fatto scattare deve essere abilitato
      - condition: template
        value_template: >
          {{ is_state('input_boolean.serra_acqua_ora_' ~ trigger.id ~ '_on', 'on') }}
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: >-
            pump main on -s {{ states('input_number.serra_acqua_durata_s') | int(60) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.serra_acqua_ultimo
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_acqua_ultimo_ricircolo_s
        data:
          value: "{{ states('input_number.serra_acqua_durata_s') | int(60) }}"
      - action: script.serra_diario_scrivi
        data:
          msg: "Acqua · ricircolo automatico ({{ states('input_number.serra_acqua_durata_s') | int }}s)"
      # Rilettura livello 3 min dopo il ricircolo (pompa ferma, acqua
      # assestata): cosi' il livello si aggiorna subito dopo ogni movimento
      # d'acqua/rabbocco invece di aspettare la lettura schedulata (2/die).
      - delay:
          minutes: 3
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "water level"

  # =========================================================================
  # FAILSAFE POMPA PRINCIPALE (rete di sicurezza software, lato HA).
  # La pompa si ferma SOLO grazie all'auto-timer del firmware VoCore: se quel
  # tick si perde (glitch MCU/UART) resterebbe accesa a tempo indeterminato →
  # allagamento. HA non vede lo stato FISICO, solo il flag derivato running_now,
  # quindi NON ci affidiamo al flag: a OGNI avvio pompa inviamo un 'pump main
  # off' ESPLICITO a fine-finestra prevista (until_ts) + margine. Se la pompa
  # si e' gia' auto-spenta l'off e' un no-op innocuo; se il tick e' stato perso,
  # la spegne. Copre ricircolo schedulato E test manuale (qualsiasi avvio porta
  # running_now → on). mode:restart → un nuovo avvio riparte il timer sulla
  # nuova until_ts. (La seconda meta' del fix — dead-man/watchdog lato Pi — resta
  # per la Fase 4 sul controller; questa e' la cintura a rischio ~nullo.)
  # =========================================================================
  - id: serra_pump_main_failsafe
    alias: "Serra: Pompa principale - failsafe OFF di sicurezza"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.serra_pump_main_running_now
        to: "on"
      # B-b: anche sul cambio di 'seconds' -> cattura un SECONDO pump-on che si
      # sovrappone al primo (running_now resta 'on', quindi il trigger sopra non
      # scatterebbe) e RI-ARMA il belt (mode:restart) sulla NUOVA durata. Il
      # cambio seconds->0 dell'off e' filtrato dalla condizione seconds>0.
      - platform: state
        entity_id: sensor.serra_pump_main_seconds
    condition:
      # seconds > 0 = pompa avviata con durata reale. USIAMO 'seconds' (un
      # value_template sensor, si aggiorna INSIEME a running_now) e NON
      # l'attributo until_ts di serra_pump_main_state: quello arriva via
      # json_attributes e puo' aggiornarsi DOPO il trigger (race) -> la
      # condizione leggeva un until_ts stale (0) -> 0 > now = false -> il belt
      # non scattava MAI (bug scoperto col test end-to-end 2026-07-14; il
      # dead-man Pi copriva comunque).
      - condition: numeric_state
        entity_id: sensor.serra_pump_main_seconds
        above: 0
    action:
      # off a (durata + margine) dalla partenza: l'azione parte ~alla partenza
      # della pompa e 'seconds' (= durata richiesta) qui e' fresco.
      - delay: >-
          {{ (states('sensor.serra_pump_main_seconds') | int(0)) + 20 }}
      # B-b guardia: allo scadere, se la pompa risulta ancora legittimamente in
      # moto (until_ts nel FUTURO = un pump-on nuovo/piu' lungo e' partito e ha
      # la sua fine prevista) NON tagliarla -> fermiamo la sequenza. Qui lo stato
      # e' assestato (delay >= 21s dal trigger) quindi leggere until_ts NON ha la
      # race del trigger. Stessa logica della guardia del dead-man Pi.
      - condition: template
        value_template: "{{ (state_attr('sensor.serra_pump_main_state','until_ts') | float(0)) <= now().timestamp() + 1 }}"
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "pump main off"
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "state sync"
      # diario SOLO se era ancora accesa oltre il previsto (anomalia vera): nel
      # caso normale e' gia' off e non spammiamo.
      - if:
          - condition: state
            entity_id: sensor.serra_pump_main_running_now
            state: "on"
        then:
          - action: script.serra_diario_scrivi
            data:
              msg: "Sistema · FAILSAFE pompa principale: ancora accesa oltre il tempo previsto → forzato OFF"

  # AUDIT R1 (RT-02): il belt qui sopra vive in un delay IN RAM — un riavvio o
  # una ricarica di HA durante la finestra pompa lo cancella, e running_now e'
  # gia' 'on' quindi il trigger non riscatta. Questa gemella copre il buco:
  # allo start di HA e ogni minuto, se la pompa risulta in moto OLTRE la fine
  # prevista (until_ts + margine), forza l'off. La guardia sui 30s dall'ultimo
  # cambio di running_now evita di uccidere una pompa APPENA partita mentre
  # until_ts e' ancora stale (stessa race documentata nel belt). Nel
  # funzionamento normale non scatta mai.
  - id: serra_pump_main_failsafe_recovery
    alias: "Serra: Pompa principale - failsafe recovery (riavvii HA)"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: sensor.serra_pump_main_running_now
        state: "on"
      - condition: template
        value_template: >-
          {{ now().timestamp() - (states.sensor.serra_pump_main_running_now.last_changed | as_timestamp(0)) > 30 }}
      - condition: template
        value_template: >-
          {{ (state_attr('sensor.serra_pump_main_state','until_ts') | float(0)) + 20 < now().timestamp() }}
      # AUDIT R2 (RT2-05): cooldown 10' — a bridge morto col retained
      # running=true le condizioni restano vere e il time_pattern /1
      # produrrebbe 2 publish + 1 riga diario AL MINUTO (1440/giorno)
      # finche' la centralina non torna. Il dead-man sul Pi resta il
      # failsafe primario; questo e' il backstop, 6 tentativi/ora bastano.
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 600 }}
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "pump main off"
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "state sync"
      - action: script.turn_on
        target:
          entity_id: script.serra_diario_scrivi
        data:
          variables:
            msg: "Sistema · sicurezza: pompa accesa oltre il tempo previsto → spenta d'ufficio"

  # AUDIT R1 (RT-01): i ricircoli sono time-trigger puri — se HA era giu'
  # all'ora dello slot, quel ricircolo era perso in silenzio. Allo start di HA:
  # se oggi esiste uno slot ABILITATO gia' passato piu' recente dell'ultimo
  # ricircolo registrato (serra_acqua_ultimo), se ne recupera UNO. Il delay di
  # 2 min lascia assestare bridge/MQTT dopo il boot; la ri-verifica dopo il
  # delay evita il doppio ricircolo se nel frattempo e' partito lo slot vero.
  - id: serra_acqua_recovery
    alias: "Serra: Acqua - recovery ricircolo perso (riavvio HA)"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_schedule_acqua
        state: "on"
      # AUDIT R2 (RT2-06): si irriga solo a luci accese (regola del piano) —
      # un boot notturno NON recupera lo slot perso: se ne riparla al primo
      # slot vero della giornata. (Il recovery della Fase B era girato alle
      # 01:59, in piena fase di buio.)
      - condition: state
        entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
        state: "on"
      - condition: template
        value_template: >-
          {% set ns = namespace(latest=0) %}
          {% for i in [1,2,3] %}
            {% if is_state('input_boolean.serra_acqua_ora_' ~ i ~ '_on','on') %}
              {% set t = states('input_datetime.serra_acqua_ora_' ~ i) %}
              {% if t not in ['unknown','unavailable',''] %}
                {% set slot = today_at(t[0:5]).timestamp() %}
                {% if slot <= now().timestamp() and slot > ns.latest %}
                  {% set ns.latest = slot %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.latest > 0 and (states('input_datetime.serra_acqua_ultimo') | as_timestamp(0)) < ns.latest }}
    action:
      - delay:
          minutes: 2
      # ri-verifica post-delay: se lo slot regolare e' appena girato, stop.
      - condition: template
        value_template: >-
          {{ now().timestamp() - (states('input_datetime.serra_acqua_ultimo') | as_timestamp(0)) > 600 }}
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: >-
            pump main on -s {{ states('input_number.serra_acqua_durata_s') | int(60) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.serra_acqua_ultimo
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_acqua_ultimo_ricircolo_s
        data:
          value: "{{ states('input_number.serra_acqua_durata_s') | int(60) }}"
      - action: script.turn_on
        target:
          entity_id: script.serra_diario_scrivi
        data:
          variables:
            msg: "Acqua · ricircolo recuperato dopo un riavvio del sistema ({{ states('input_number.serra_acqua_durata_s') | int }}s)"
      - delay:
          minutes: 3
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "water level"

  # =========================================================================
  # DIARIO: logga ogni azione della serra (script avviati + cambi modalita').
  # Le automazioni acqua/ventole loggano gia' in proprio (azione dedicata).
  # =========================================================================
  - id: serra_diario_eventi
    alias: "Serra: Diario - Logger eventi"
    mode: queued
    max: 20
    trigger:
      - platform: state
        entity_id:
          - script.serra_luce_alba
          - script.serra_luce_tramonto
          - script.serra_luce_applica_mix
          - script.serra_luce_preset_verde
          - script.serra_luce_preset_bianco
          - script.serra_luci_lab_off
          - script.serra_pump_main_apply
          - script.serra_pump_main_off
          - script.serra_ring_off
          - script.serra_nutrient_0_apply
          - script.serra_nutrient_1_apply
          - script.serra_nutrient_2_apply
        to: "on"
        id: script
      - platform: state
        entity_id:
          - input_boolean.serra_schedule_luci
          - input_boolean.serra_schedule_acqua
          - input_boolean.serra_schedule_ventole
          - input_boolean.serra_schedule_nutrienti
        id: toggle
      # AUDIT R2 (R2-5): i comandi che il pannello Controllo manda davvero.
      # SOLO MANUALI (gate in condition): le mosse automatiche di ventole e
      # pompa loggano gia' in proprio, qui si coprono solo i gesti diretti
      # che prima erano invisibili (zero righe Ring in 907 righe reali).
      - platform: state
        entity_id:
          # (pump_main_on NON e' qui: scrive la sua riga da solo, con la
          # durata vera — il logger la renderizzava in race con l'helper.
          # ring_off e' nel gruppo 'script': la riga vale anche quando lo
          # spegne lo standby di fine coltura — AUDIT R5, M-R5-3)
          - script.serra_ring_apply
          - script.serra_ring_blink_apply
        to: "on"
        id: manuale
      - platform: state
        entity_id:
          - input_select.serra_fan_1_level
          - input_select.serra_fan_2_level
          - input_select.serra_fan_f_level
        id: manuale_sel
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unknown','unavailable']
             and (trigger.from_state is none or trigger.from_state.state not in ['unknown','unavailable']) }}
      # Gate dei trigger 'manuale*': passa solo l'anello iniziale di una
      # azione utente (stessa regola dell'origine qui sotto). Per manuale_sel
      # anche il guard from!=to delle automazioni gemelle: uno state trigger
      # senza to:/from: scatta pure sui soli attributi (AUDIT R3, M-R3-3).
      - condition: template
        value_template: >
          {{ trigger.id not in ['manuale', 'manuale_sel']
             or (trigger.to_state.context.parent_id is none
                 and trigger.to_state.context.user_id is not none) }}
      - condition: template
        value_template: >
          {{ trigger.id != 'manuale_sel'
             or trigger.from_state is none
             or trigger.from_state.state != trigger.to_state.state }}
      # AUDIT R3 (R3-1): applica_mix e' chiamato anche DENTRO applica_fase,
      # preset verde/bianco e spegni — che stanno gia' in questa lista o
      # scrivono la loro riga da soli. GOTCHA (verificato sul sistema): la
      # chiamata script->script INLINE (`action: script.x`) NON crea un
      # context figlio, riusa lo STESSO context del chiamante — quindi il
      # solo parent_id non basta a riconoscere la catena. Il mix interno di
      # un wrapper si riconosce perche' il suo context id COINCIDE con
      # quello dell'ultimo state-change del wrapper. Qui logga solo la
      # chiamata diretta (CTA "Applica colore" via lunga), altrimenti ogni
      # preset produrrebbe due righe gemelle nello stesso minuto.
      - condition: template
        value_template: >
          {% set c = trigger.to_state.context.id %}
          {% set wrapper = [states['script.serra_luce_applica_fase'],
                            states['script.serra_luce_preset_verde'],
                            states['script.serra_luce_preset_bianco'],
                            states['script.serra_luci_lab_off']] | select() | list %}
          {{ trigger.entity_id != 'script.serra_luce_applica_mix'
             or (trigger.to_state.context.parent_id is none
                 and (wrapper | selectattr('context.id', 'eq', c) | list | count) == 0) }}
    action:
      - action: script.serra_diario_scrivi
        data:
          msg: >-
            {# sintassi unica del diario: "Componente · dettaglio" #}
            {% if trigger.id == 'script' %}
              {% set m = {
                'script.serra_luce_alba': 'Luci · alba avviata (rampa ' ~ (states('input_number.serra_luce_fade_min') | int) ~ ' min, preset ' ~ states('input_select.serra_fase_luci') ~ ')',
                'script.serra_luce_tramonto': 'Luci · tramonto avviato (rampa ' ~ (states('input_number.serra_luce_fade_min') | int) ~ ' min)',
                'script.serra_luce_applica_mix': 'Luci · mix applicato (D ' ~ (states('input_number.serra_luce_ch_d')|int(0)) ~ ' · R ' ~ (states('input_number.serra_luce_ch_r')|int(0)) ~ ' · B ' ~ (states('input_number.serra_luce_ch_b')|int(0)) ~ ' · G ' ~ (states('input_number.serra_luce_ch_g')|int(0)) ~ ' · A ' ~ (states('input_number.serra_luce_ch_a')|int(0)) ~ ')',
                'script.serra_luce_preset_verde': 'Luci · verde (servizio)',
                'script.serra_luce_preset_bianco': 'Luci · bianco (foto)',
                'script.serra_luci_lab_off': 'Luci · spente',
                'script.serra_pump_main_apply': 'Acqua · pompa avviata (' ~ (states('input_number.serra_pump_main_duration') | int) ~ 's)',
                'script.serra_pump_main_off': 'Acqua · pompa STOP',
                'script.serra_ring_off': 'Anello · spento',
                'script.serra_nutrient_0_apply': 'Nutrienti · Blu (Bloom) erogato (' ~ states('input_number.serra_nutrient_duration') ~ 's x ' ~ (states('input_number.serra_nutrient_times') | int) ~ ')',
                'script.serra_nutrient_1_apply': 'Nutrienti · Verde (Micro) erogato (' ~ states('input_number.serra_nutrient_duration') ~ 's x ' ~ (states('input_number.serra_nutrient_times') | int) ~ ')',
                'script.serra_nutrient_2_apply': 'Nutrienti · Rossa (Grow) erogato (' ~ states('input_number.serra_nutrient_duration') ~ 's x ' ~ (states('input_number.serra_nutrient_times') | int) ~ ')'
              } %}
              {{ m.get(trigger.entity_id, 'Sistema · comando eseguito (' ~ trigger.entity_id.split('.')[-1] | replace('serra_', '') | replace('_', ' ') ~ ')') }}
            {% elif trigger.id == 'manuale' %}
              {# ring_apply/blink leggono i loro helper, gia' scritti
                 dall'app quando lo script parte. #}
              {% set m = {
                'script.serra_ring_apply': 'Anello · colore applicato (' ~ states('input_select.serra_ring_color') ~ ' · fade ' ~ (states('input_number.serra_ring_fade') | int(0)) ~ ' s)',
                'script.serra_ring_blink_apply': 'Anello · lampeggio (' ~ (states('input_number.serra_ring_blink_times') | int(0)) ~ 'x da ' ~ (states('input_number.serra_ring_blink_duration') | int(0)) ~ ' s)'
              } %}
              {{ m.get(trigger.entity_id, 'Sistema · comando eseguito (' ~ trigger.entity_id.split('.')[-1] | replace('serra_', '') | replace('_', ' ') ~ ')') }}
            {% elif trigger.id == 'manuale_sel' %}
              {% set nome = {'input_select.serra_fan_1_level': 'V1',
                             'input_select.serra_fan_2_level': 'V2',
                             'input_select.serra_fan_f_level': 'frontale'} %}
              {% set liv = {'off': 'ferma', 'low': 'bassa', 'medium': 'media', 'high': 'alta'} %}
              Ventole · {{ nome.get(trigger.entity_id, '?') }} a livello {{ liv.get(trigger.to_state.state, trigger.to_state.state) }}
            {% else %}
              {% set nome = {'input_boolean.serra_schedule_luci': 'Luci',
                             'input_boolean.serra_schedule_acqua': 'Acqua',
                             'input_boolean.serra_schedule_ventole': 'Ventole',
                             'input_boolean.serra_schedule_nutrienti': 'Nutrienti'} %}
              {{ nome.get(trigger.entity_id, '?') }} · Modalità {{ 'Pianificata' if trigger.to_state.state == 'on' else 'Libera' }}
            {% endif %}
          # Diario v2: chi ha innescato il cambio? Un context con user_id e'
          # una persona o l'app (token con utente); le automazioni girano
          # senza utente. MA (AUDIT R1, I-9) HA propaga lo user_id lungo tutta
          # la catena dei service call: un'automazione innescata da un tap, che
          # poi lancia uno script, produce cambi con user_id valorizzato. Qui
          # conta solo l'anello INIZIALE: parent_id none = azione diretta.
          origine: >-
            {{ 'manuale' if (trigger.to_state.context.parent_id is none
                             and trigger.to_state.context.user_id is not none) else 'auto' }}

  # =========================================================================
  # LUCI - ULTIMA AZIONE SEMANTICA (03/08): "accensione", "spegnimento" o
  # "cambio mix canali", giudicati sulle TRANSIZIONI dello stato riportato.
  # GOTCHA (prototipo): per la serra "tutti i canali a zero" E' spegnimento, e
  # off->on e' tecnicamente un cambio di mix da tutti-zero — percio' qui
  # decide PRIMA lo stato on/off (che il firmware deriva dai canali) e solo
  # a pannello fermo su on un cambio dei canali vale come "cambio mix".
  # =========================================================================
  # GOTCHA n.2 (verificato live 03/08): il firmware, applicando un mix,
  # PASSA per lo spento (~9 s di off e poi on col colore nuovo). Quindi:
  # un off->on con l'off piu' corto di 30 s e' un TUFFO TECNICO = "cambio
  # mix canali"; "spegnimento" vale solo se lo spento DURA (for: 30s, che
  # scarta i tuffi da solo); "accensione" e' l'off->on dopo un off vero.
  - id: serra_luci_ultima_azione
    alias: "Serra: Luci - Ultima azione"
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id: sensor.serra_lights_state
        to: "on"
        id: acceso
      - platform: state
        entity_id: sensor.serra_lights_state
        to: "off"
        for: "00:00:30"
        id: spento
      # GOTCHA n.3 (verificato live 03/08): il cambio mix puo' anche essere
      # SEAMLESS — canali aggiornati senza passare per off (solo attributi,
      # lo stato resta 'on'). Il trigger su attribute: channels scatta solo
      # quando i canali cambiano davvero (AUDIT R6, C-R6-1).
      - platform: state
        entity_id: sensor.serra_lights_state
        attribute: channels
        id: attr
    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown','unavailable'] }}
    action:
      - variables:
          evento: >-
            {%- if trigger.id == 'spento' -%}
              spegnimento
            {%- elif trigger.id == 'attr' -%}
              {%- set ch_prima = trigger.from_state.attributes.channels | default({}) -%}
              {%- set ch_dopo = trigger.to_state.attributes.channels | default({}) -%}
              {%- if trigger.from_state.state == 'on' and trigger.to_state.state == 'on' and ch_prima != ch_dopo -%}cambio mix canali{%- endif -%}
            {%- elif trigger.from_state.state == 'off' -%}
              {%- set off_da = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() -%}
              {{ 'cambio mix canali' if off_da < 30 else 'accensione' }}
            {%- endif -%}
      - condition: template
        value_template: "{{ evento | trim | length > 0 }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_luci_ultima_azione
        data:
          value: "{{ evento | trim }} @{{ now().isoformat(timespec='seconds') }}"

  # =========================================================================
  # ALERT DISCORDANZA ATTESA/REALTA' (piano avvisi 03/08, definito nel prototipo):
  # se un componente IN AUTOMATICO non segue il programma da oltre 10 minuti
  # -> riga di diario in evidenza + push (gated dal master) + latch per il
  # banner in Stato. Al rientro: latch giu' + riga di diario, niente push.
  # Nutrienti: coperti dal sistema errori esistente (le dosi auto passano
  # dagli script pompe, un fallimento alza gia' "comando fallito").
  # LED Ring: escluso di proposito (non puo' danneggiare le piante).
  # I template con is_state() NON scattano su unknown/unavailable: una
  # centralina muta non genera falsi allarmi (e c'e' il gate bridge online).
  # =========================================================================
  - id: serra_alert_discordanza_luci
    alias: "Serra: Alert - Luci fuori programma"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {%- set atteso = states('binary_sensor.serra_luci_dovrebbero_essere_on') -%}
          {{ atteso in ['on','off']
             and is_state('sensor.serra_lights_state', 'off' if atteso == 'on' else 'on') }}
        for: "00:10:00"
        id: fuori
      - platform: template
        value_template: >-
          {%- set atteso = states('binary_sensor.serra_luci_dovrebbero_essere_on') -%}
          {{ atteso in ['on','off']
             and is_state('sensor.serra_lights_state', 'on' if atteso == 'on' else 'off') }}
        for: "00:02:00"
        id: rientro
      # AUDIT R6 (R6-1): rivalutazione periodica del rientro
      - platform: time_pattern
        minutes: "/10"
        id: ritenta
      - platform: homeassistant
        event: start
        id: ritenta
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: fuori
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              - condition: state
                entity_id: input_boolean.serra_schedule_luci
                state: "on"
              - condition: state
                entity_id: sensor.serra_bridge_online
                state: "online"
              - condition: state
                entity_id: input_boolean.serra_discordanza_luci
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.serra_discordanza_luci
              - action: script.serra_diario_scrivi
                data:
                  msg: >-
                    Luci · FUORI PROGRAMMA: il pannello è {{ 'acceso' if is_state('sensor.serra_lights_state','on') else 'spento' }} ma il programma prevede {{ 'acceso' if is_state('binary_sensor.serra_luci_dovrebbero_essere_on','on') else 'spento' }} da oltre 10 minuti
                  tipo: evidenza
              - if:
                  - condition: state
                    entity_id: input_boolean.serra_notifiche_push
                    state: "on"
                then:
                  - service: script.turn_on
                    target:
                      entity_id: script.serra_push_facoltativa
                    data:
                      variables:
                        title: "⚠️ Serra: luci fuori programma"
                        message: >-
                          Il pannello luci è {{ 'acceso' if is_state('sensor.serra_lights_state','on') else 'spento' }} ma il programma prevede {{ 'acceso' if is_state('binary_sensor.serra_luci_dovrebbero_essere_on','on') else 'spento' }} da oltre 10 minuti. Un comando potrebbe non essere arrivato alla centralina.
                        mobile_url: "{{ states('input_text.serra_notifica_url') }}"
          - conditions:
              # AUDIT R5 (R5-1): il rientro VERO richiede le stesse premesse
              # del fuori — senza, il latch si spegneva raccontando un rientro
              # anche in Libero o a coltura chiusa (li' il latch lo pulisce
              # in silenzio serra_alert_latch_pulizia / lo standby).
              - condition: trigger
                id:
                  - rientro
                  - ritenta
              - condition: state
                entity_id: input_boolean.serra_discordanza_luci
                state: "on"
              # sul canale 'ritenta' l'allineamento va verificato qui
              - condition: template
                value_template: >-
                  {%- set atteso = states('binary_sensor.serra_luci_dovrebbero_essere_on') -%}
                  {{ atteso in ['on','off']
                     and is_state('sensor.serra_lights_state', 'on' if atteso == 'on' else 'off') }}
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              - condition: state
                entity_id: input_boolean.serra_schedule_luci
                state: "on"
              - condition: state
                entity_id: sensor.serra_bridge_online
                state: "online"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.serra_discordanza_luci
              - action: script.serra_diario_scrivi
                data:
                  msg: "Luci · rientrate nel programma"
                  tipo: evidenza

  - id: serra_alert_discordanza_ventole
    alias: "Serra: Alert - Ventole fuori programma"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set ns = namespace(x=false) %}
          {% for f in ['1','2','f'] %}
            {% set sel = states('input_select.serra_fan_' ~ f ~ '_level') %}
            {% set reale = states('sensor.serra_fan_' ~ f ~ '_level') %}
            {% if sel not in ['unknown','unavailable'] and reale not in ['unknown','unavailable'] and sel != reale %}
              {% set ns.x = true %}
            {% endif %}
          {% endfor %}
          {{ ns.x }}
        for: "00:10:00"
        id: fuori
      - platform: template
        value_template: >-
          {% set ns = namespace(x=false, n=0) %}
          {% for f in ['1','2','f'] %}
            {% set sel = states('input_select.serra_fan_' ~ f ~ '_level') %}
            {% set reale = states('sensor.serra_fan_' ~ f ~ '_level') %}
            {% if sel not in ['unknown','unavailable'] and reale not in ['unknown','unavailable'] %}
              {% set ns.n = ns.n + 1 %}
              {% if sel != reale %}{% set ns.x = true %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.n > 0 and not ns.x }}
        for: "00:02:00"
        id: rientro
      # AUDIT R6 (R6-1): rivalutazione periodica del rientro
      - platform: time_pattern
        minutes: "/10"
        id: ritenta
      - platform: homeassistant
        event: start
        id: ritenta
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: fuori
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              # NIENTE gate sulla modalita' (regola prototipo 04/08): questo
              # check misura "il comando e' arrivato?", un pericolo vale
              # in Pianificato come in Libero.
              - condition: state
                entity_id: sensor.serra_bridge_online
                state: "online"
              - condition: state
                entity_id: input_boolean.serra_discordanza_ventole
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.serra_discordanza_ventole
              - action: script.serra_diario_scrivi
                data:
                  msg: "Ventole · FUORI PROGRAMMA: i livelli comandati non risultano applicati da oltre 10 minuti"
                  tipo: evidenza
              - if:
                  - condition: state
                    entity_id: input_boolean.serra_notifiche_push
                    state: "on"
                then:
                  - service: script.turn_on
                    target:
                      entity_id: script.serra_push_facoltativa
                    data:
                      variables:
                        title: "⚠️ Serra: ventole fuori programma"
                        message: "I livelli comandati alle ventole non risultano applicati da oltre 10 minuti. Un comando potrebbe non essere arrivato alla centralina."
                        mobile_url: "{{ states('input_text.serra_notifica_url') }}"
          - conditions:
              # AUDIT R5 (R5-1): stesse premesse del fuori, come per le luci.
              - condition: trigger
                id:
                  - rientro
                  - ritenta
              - condition: state
                entity_id: input_boolean.serra_discordanza_ventole
                state: "on"
              # sul canale 'ritenta' l'allineamento va verificato qui
              - condition: template
                value_template: >-
                  {% set ns = namespace(x=false, n=0) %}
                  {% for f in ['1','2','f'] %}
                    {% set sel = states('input_select.serra_fan_' ~ f ~ '_level') %}
                    {% set reale = states('sensor.serra_fan_' ~ f ~ '_level') %}
                    {% if sel not in ['unknown','unavailable'] and reale not in ['unknown','unavailable'] %}
                      {% set ns.n = ns.n + 1 %}
                      {% if sel != reale %}{% set ns.x = true %}{% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.n > 0 and not ns.x }}
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              - condition: state
                entity_id: sensor.serra_bridge_online
                state: "online"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.serra_discordanza_ventole
              - action: script.serra_diario_scrivi
                data:
                  msg: "Ventole · rientrate nel programma"
                  tipo: evidenza

  # Acqua: "fuori programma" = esiste uno slot abilitato passato da oltre 10
  # minuti piu' recente dell'ultimo ricircolo registrato. Il template usa
  # now() -> HA lo rivaluta al minuto. Il rientro avviene quando un ricircolo
  # (schedulato, recuperato o manuale) viene marcato.
  - id: serra_alert_discordanza_acqua
    alias: "Serra: Alert - Ricircolo non partito"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set ns = namespace(latest=0) %}
          {% for i in [1,2,3] %}
            {% if is_state('input_boolean.serra_acqua_ora_' ~ i ~ '_on','on') %}
              {% set t = states('input_datetime.serra_acqua_ora_' ~ i) %}
              {% if t not in ['unknown','unavailable',''] %}
                {% set slot = today_at(t[0:5]).timestamp() %}
                {% if slot + 600 <= now().timestamp() and slot > ns.latest %}
                  {% set ns.latest = slot %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.latest > 0 and (states('input_datetime.serra_acqua_ultimo') | as_timestamp(0)) < ns.latest }}
        id: fuori
      - platform: template
        value_template: >-
          {% set ns = namespace(latest=0) %}
          {% for i in [1,2,3] %}
            {% if is_state('input_boolean.serra_acqua_ora_' ~ i ~ '_on','on') %}
              {% set t = states('input_datetime.serra_acqua_ora_' ~ i) %}
              {% if t not in ['unknown','unavailable',''] %}
                {% set slot = today_at(t[0:5]).timestamp() %}
                {% if slot + 600 <= now().timestamp() and slot > ns.latest %}
                  {% set ns.latest = slot %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.latest > 0 and (states('input_datetime.serra_acqua_ultimo') | as_timestamp(0)) >= ns.latest }}
        for: "00:02:00"
        id: rientro
      # AUDIT R6 (R6-1): rivalutazione periodica del rientro
      - platform: time_pattern
        minutes: "/10"
        id: ritenta
      - platform: homeassistant
        event: start
        id: ritenta
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: fuori
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              - condition: state
                entity_id: input_boolean.serra_schedule_acqua
                state: "on"
              - condition: state
                entity_id: sensor.serra_bridge_online
                state: "online"
              - condition: state
                entity_id: input_boolean.serra_discordanza_acqua
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.serra_discordanza_acqua
              - action: script.serra_diario_scrivi
                data:
                  msg: "Acqua · RICIRCOLO NON PARTITO: l'ultimo registrato è precedente all'orario in programma da oltre 10 minuti"
                  tipo: evidenza
              - if:
                  - condition: state
                    entity_id: input_boolean.serra_notifiche_push
                    state: "on"
                then:
                  - service: script.turn_on
                    target:
                      entity_id: script.serra_push_facoltativa
                    data:
                      variables:
                        title: "⚠️ Serra: ricircolo non partito"
                        message: "Un ricircolo previsto non risulta partito: l'ultimo registrato è precedente all'orario in programma da oltre 10 minuti."
                        mobile_url: "{{ states('input_text.serra_notifica_url') }}"
          - conditions:
              # AUDIT R5 (R5-1): rientro solo con le premesse vive; e il
              # template sopra ora chiede uno slot PASSATO e SERVITO — a
              # mezzanotte ns.latest torna 0 e NON e' un rientro (il latch
              # resta su finche' un ricircolo vero non viene marcato).
              - condition: trigger
                id:
                  - rientro
                  - ritenta
              - condition: state
                entity_id: input_boolean.serra_discordanza_acqua
                state: "on"
              # sul canale 'ritenta' l'allineamento va verificato qui
              - condition: template
                value_template: >-
                  {% set ns = namespace(latest=0) %}
                  {% for i in [1,2,3] %}
                    {% if is_state('input_boolean.serra_acqua_ora_' ~ i ~ '_on','on') %}
                      {% set t = states('input_datetime.serra_acqua_ora_' ~ i) %}
                      {% if t not in ['unknown','unavailable',''] %}
                        {% set slot = today_at(t[0:5]).timestamp() %}
                        {% if slot + 600 <= now().timestamp() and slot > ns.latest %}
                          {% set ns.latest = slot %}
                        {% endif %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.latest > 0 and (states('input_datetime.serra_acqua_ultimo') | as_timestamp(0)) >= ns.latest }}
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "on"
              - condition: state
                entity_id: input_boolean.serra_schedule_acqua
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.serra_discordanza_acqua
              - action: script.serra_diario_scrivi
                data:
                  msg: "Acqua · ricircoli rientrati nel programma"
                  tipo: evidenza

  # Pulizia SILENZIOSA dei latch discordanza (AUDIT R5, R5-1): se si passa
  # a Libero il "fuori programma" non ha piu' senso — il latch si abbassa
  # SENZA riga di rientro (il programma e' ignorato, non rispettato).
  # A fine coltura ci pensa il ramo standby qui sotto.
  - id: serra_alert_latch_pulizia
    alias: "Serra: Alert - pulizia latch su passaggio a Libero"
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id: input_boolean.serra_schedule_luci
        to: "off"
        id: luci
      - platform: state
        entity_id: input_boolean.serra_schedule_acqua
        to: "off"
        id: acqua
      # (niente trigger ventole: dal 04/08 quel check vale in ogni
      # modalita', il suo latch non si pulisce col passaggio a Libero)
    action:
      # VINCOLO: i trigger.id qui sopra DEVONO coincidere col suffisso degli
      # helper serra_discordanza_* — rinominarne uno romperebbe la pulizia
      # in silenzio (warning nei log e latch mai abbassato).
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.serra_discordanza_{{ trigger.id }}"

  # =========================================================================
  # CICLO DI VITA COLTIVAZIONE: all'avvio logga la semina (le luci le rimette
  # il reconcile, la fase serra_fase_auto); alla fine spegne ventole e logga.
  # STANDBY TOTALE a fine coltura (03/08, contratto del prototipo): senza una
  # coltivazione in corso NIENTE resta acceso — luci, anello e pompa compresi,
  # anche se erano in Manuale ("non c'e' motivo per avere le luci accese").
  # =========================================================================
  - id: serra_coltivazione_ciclo
    alias: "Serra: Coltivazione - Avvio/Fine"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
        from: "off"
        to: "on"
        id: avvio
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
        from: "on"
        to: "off"
        id: fine
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: avvio
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: "Coltivazione · AVVIATA (semina {{ states('input_datetime.serra_data_semina') }})"
                  # Qui NIENTE check parent_id (a differenza del logger eventi):
                  # 'attiva' la toccano solo azioni utente, dirette o via script
                  # (semina oggi / cancella) — user_id propagato = manuale e'
                  # il verdetto giusto per QUESTO segnale.
                  origine: >-
                    {{ 'manuale' if trigger.to_state.context.user_id is not none else 'auto' }}
        default:
          - action: input_select.select_option
            target:
              entity_id: input_select.serra_all_fans_level
            data:
              option: "off"
          # AUDIT R1 (RT-07): a fine coltura si pulisce anche il latch booster
          # (altrimenti: ring VIOLA perenne sulla serra spenta e latch che
          # inquina la coltivazione successiva) e si azzera il giorno-dato.
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.serra_booster_da_dare
          - action: input_number.set_value
            target:
              entity_id: input_number.serra_booster_dato_giorno
            data:
              value: -1
          # AUDIT R2 (MC2-03): a fine ciclo si spengono anche le 4 conferme
          # milestone — lasciate accese, alla semina successiva le date del
          # ciclo VECCHIO risultavano "confermate" (ancora pre-semina: il
          # motore ricadeva in silenzio sul default, picker bugiardo). Lo
          # spegnimento fa anche tornare le date sul previsto via
          # serra_ancore_default_sync (trigger conferma->off).
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.serra_conferma_vegetativa
                - input_boolean.serra_conferma_fioritura
                - input_boolean.serra_conferma_flush
                - input_boolean.serra_conferma_essiccazione
          # STANDBY: tutto spento, sempre — anche cio' che era in Libero.
          - action: script.serra_luci_lab_off
          - action: script.serra_ring_off
          - action: script.serra_pump_main_off
          # e i latch discordanza si abbassano in silenzio (AUDIT R5, R5-1)
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.serra_discordanza_luci
                - input_boolean.serra_discordanza_acqua
                - input_boolean.serra_discordanza_ventole
          - action: script.serra_diario_scrivi
            data:
              msg: "Coltivazione · TERMINATA"
              # Come per AVVIATA: user_id puro, senza check parent_id (vedi la').
              origine: >-
                {{ 'manuale' if trigger.to_state.context.user_id is not none else 'auto' }}

  # =========================================================================
  # APPLICA PIANO: al cambio di FASE del tracker (anche via milestone del
  # Calendario), a mezzanotte, all'avvio coltivazione, allo spostamento
  # dell'alba o a una modifica del piano, allinea:
  #   - la FASE LUCI (input_select; "raccolto" legacy usa il mix flush,
  #     "conclusa" usa essiccazione)
  #   - lo SCHEDULE ACQUA della fase: orari = alba + ore[] del piano (il "giorno
  #     della pianta"), durata e slot attivi scritti negli input esistenti ->
  #     restano leve d'esercizio: un ritocco a mano vale fino al prossimo apply
  #   - le SOGLIE VENTOLE della fase (sezione "ambiente" del piano): umidita'
  #     e temperatura scritte nei due input_number -> stesse leve d'esercizio
  #   - il MIX LUCI, se le luci sono attese accese ora (idempotente: se gli
  #     slider non cambiano la sync non pubblica nulla)
  # AUDIT R2/R3: dal cluster F1 quest'automazione GIRA SOLO A COLTIVAZIONE
  # ATTIVA (condition sotto) — a serra spenta la fase e' 'conclusa' e il
  # fallback avrebbe riscritto le impostazioni di vegetativa. Il vecchio
  # comportamento "gira anche da spenta" e' stato superato dalla decisione
  # Requisito #4 (conclusa = spenta, 27/07).
  - id: serra_fase_auto
    alias: "Serra: Fase luci automatica"
    # AUDIT R1 (RT-06): era single — un trigger legittimo arrivato durante il
    # cuscinetto dei 3 min veniva SCARTATO, e le run di settling all'avvio
    # giravano senza cuscinetto. Con restart la run in attesa viene sostituita
    # dalla piu' recente (le scritture sono idempotenti): vince sempre lo stato
    # finale assestato.
    mode: restart
    trigger:
      - platform: time
        at: "00:10:00"
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
        to: "on"
      - platform: state
        entity_id: sensor.serra_fase
      - platform: state
        entity_id: input_datetime.serra_luci_on
      - platform: state
        entity_id: sensor.serra_piano
      # A OGNI avvio di HA ri-allinea tutto dal piano (orari acqua, soglie,
      # fase luci): copre i valori resettati/incoerenti dopo un riavvio, visto
      # che gli helper senza initial ripristinano ma il piano potrebbe essere
      # cambiato mentre HA era spento. Con cuscinetto (v. delay nell'azione).
      - platform: homeassistant
        event: start
        id: start
    condition:
      # AUDIT R2 (cluster F1): a coltivazione spenta la fase e' 'conclusa'
      # (nuova semantica) e fase_giusta ricadrebbe sul fallback 'vegetativa'
      # riscrivendo orari/soglie su una serra chiusa — qui non si entra proprio.
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      # serve una fase valida: tracker disponibile (data semina impostata),
      # fase riconosciuta E piano leggibile. Se serra_piano.yaml è corrotto
      # (errore di sintassi) gli attributi spariscono e la fase diventa
      # 'sconosciuta' -> senza questo guard il fallback riscriverebbe
      # silenziosamente le impostazioni di VEGETATIVA a metà fioritura.
      # ('conclusa' in lista come cintura: non dovrebbe mai arrivarci.)
      - condition: template
        value_template: "{{ states('sensor.serra_fase') not in ['unknown', 'unavailable', '', 'sconosciuta', 'conclusa'] }}"
      # AUDIT R2 (residuo R1): la guardia copre TUTTE le sezioni che questa
      # automazione scrive — anche acqua e ambiente. Prima controllava solo
      # fasi+luci: un piano valido ma senza 'acqua'/'ambiente' faceva scrivere
      # in silenzio ore [3,15], durata 60, soglie 60/28 inventate (la stessa
      # logica "indovinare invece di fallire" che MC-11 ha tolto dalla mappa).
      - condition: template
        value_template: >-
          {{ state_attr('sensor.serra_piano','fasi') is not none and state_attr('sensor.serra_piano','luci') is not none
             and state_attr('sensor.serra_piano','acqua') is not none and state_attr('sensor.serra_piano','ambiente') is not none }}
    action:
      # Cuscinetto di sicurezza SOLO all'avvio di HA (trigger id 'start'):
      # aspetta 3 min che template sensor (piano/fase) e MQTT si assestino
      # prima di ri-scrivere gli orari/soglie dal piano. Le altre trigger
      # (00:10, cambi fase/alba/piano/coltivazione) NON hanno delay.
      - if: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - delay: { minutes: 3 }
      # AUDIT R2 (RT2-02, il pezzo mancante di RT-06): le condition di
      # automazione sono valutate AL TRIGGER, cioe' 3 minuti prima di questa
      # riga sul ramo start — e fase_giusta ha il fallback 'vegetativa'. Se
      # nei 3 minuti il piano diventa unknown (refuso appena salvato, command
      # line lento), senza questo re-check si riscriverebbero luci/orari/soglie
      # di VEGETATIVA a meta' fioritura. Sui trigger senza delay e' un no-op.
      - condition: template
        value_template: "{{ states('sensor.serra_fase') not in ['unknown', 'unavailable', '', 'sconosciuta', 'conclusa'] }}"
      - condition: template
        value_template: >-
          {{ state_attr('sensor.serra_piano','fasi') is not none and state_attr('sensor.serra_piano','luci') is not none
             and state_attr('sensor.serra_piano','acqua') is not none and state_attr('sensor.serra_piano','ambiente') is not none }}
      - variables:
          fase_tracker: "{{ states('sensor.serra_fase') }}"
          fase_giusta: >-
            {{ fase_tracker if fase_tracker in ['germinazione', 'vegetativa', 'fioritura', 'flush', 'essiccazione']
               else 'flush' if fase_tracker == 'raccolto'
               else 'essiccazione' if fase_tracker == 'conclusa'
               else 'vegetativa' }}
          fase_label: "{{ fase_giusta | capitalize }}"
          fase_cambiata: "{{ states('input_select.serra_fase_luci') != fase_label }}"
          acqua_cfg: "{{ (state_attr('sensor.serra_piano','acqua') or {}).get(fase_giusta, {}) }}"
          amb_cfg: "{{ (state_attr('sensor.serra_piano','ambiente') or {}).get(fase_giusta, {}) }}"
          ore: "{{ acqua_cfg.get('ore', [3, 15]) }}"
          durata: "{{ acqua_cfg.get('durata', 60) }}"
          alba_s: "{{ state_attr('input_datetime.serra_luci_on','timestamp') | int(21600) }}"
          t1: "{{ '%02d:%02d:00' | format((((alba_s + (ore[0] | default(3)) * 3600) % 86400) // 3600), (((alba_s + (ore[0] | default(3)) * 3600) % 3600) // 60)) }}"
          t2: "{{ '%02d:%02d:00' | format((((alba_s + (ore[1] | default(13)) * 3600) % 86400) // 3600), (((alba_s + (ore[1] | default(13)) * 3600) % 3600) // 60)) if ore | length > 1 else '00:00:00' }}"
          t3: "{{ '%02d:%02d:00' | format((((alba_s + (ore[2] | default(20)) * 3600) % 86400) // 3600), (((alba_s + (ore[2] | default(20)) * 3600) % 3600) // 60)) if ore | length > 2 else '00:00:00' }}"
      # fase luci (etichetta capitalizzata; i lookup usano la chiave minuscola)
      - action: input_select.select_option
        target:
          entity_id: input_select.serra_fase_luci
        data:
          option: "{{ fase_label }}"
      # schedule acqua dal piano (ore [] = fase senza ricircoli, es. essiccazione)
      - action: input_number.set_value
        target: {entity_id: input_number.serra_acqua_durata_s}
        data: {value: "{{ [durata | int(60), 5] | max }}"}
      - choose:
          - conditions: "{{ ore | length > 0 }}"
            sequence:
              - action: input_datetime.set_datetime
                target: {entity_id: input_datetime.serra_acqua_ora_1}
                data: {time: "{{ t1 }}"}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.serra_acqua_ora_1_on}
        default:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.serra_acqua_ora_1_on}
      - choose:
          - conditions: "{{ ore | length > 1 }}"
            sequence:
              - action: input_datetime.set_datetime
                target: {entity_id: input_datetime.serra_acqua_ora_2}
                data: {time: "{{ t2 }}"}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.serra_acqua_ora_2_on}
        default:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.serra_acqua_ora_2_on}
      - choose:
          - conditions: "{{ ore | length > 2 }}"
            sequence:
              - action: input_datetime.set_datetime
                target: {entity_id: input_datetime.serra_acqua_ora_3}
                data: {time: "{{ t3 }}"}
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.serra_acqua_ora_3_on}
        default:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.serra_acqua_ora_3_on}
      # soglie ventole dal piano (sezione ambiente)
      - action: input_number.set_value
        target: {entity_id: input_number.serra_vent_soglia_umidita}
        data: {value: "{{ amb_cfg.get('soglia_umidita', 60) | int(60) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_vent_soglia_temp}
        data: {value: "{{ amb_cfg.get('soglia_temp', 28) | float(28) }}"}
      # mix luci: riallinea se le luci sono attese accese (sync = no-op se
      # uguale). SOLO a coltivazione attiva: da spenta niente comandi fisici.
      - if:
          - condition: state
            entity_id: input_boolean.serra_coltivazione_attiva
            state: "on"
          - condition: state
            entity_id: input_boolean.serra_schedule_luci
            state: "on"
          - condition: state
            entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
            state: "on"
        then:
          - action: script.serra_luce_applica_fase
            data:
              fase: "{{ fase_giusta }}"
      # diario solo al cambio fase vero E a coltivazione attiva (i movimenti
      # del cursore a serra spenta non vanno nel diario permanente)
      - if:
          - condition: state
            entity_id: input_boolean.serra_coltivazione_attiva
            state: "on"
          - condition: template
            value_template: "{{ fase_cambiata }}"
        then:
          - action: script.serra_diario_scrivi
            data:
              msg: "Coltivazione · fase {{ fase_giusta }} (g{{ states('sensor.serra_giorno_ciclo') }}): luci {{ (state_attr('sensor.serra_piano','luci') or {}).get(fase_giusta, []) | join('/') }} · ricircolo {{ ore | length }}×{{ durata | int }}s"

  # =========================================================================
  # VENTOLE AUTOMATICHE a soglia di umidita' (isteresi 5%):
  #   umidita >= soglia (2 min)      -> ventole al livello auto
  #   umidita <= soglia - 5 (10 min) -> ventole off
  # Agisce impostando input_select.serra_all_fans_level -> la sync automation
  # esistente pubblica il comando (riuso, e niente publish se il livello non
  # cambia = nessun kick-start ripetuto). Reconcile quando si torna in Automatico.
  # =========================================================================
  # Ventole a soglia: si accendono se umidita' > soglia O temperatura > soglia
  # (solo raffreddamento/deumidificazione: estraggono aria). Si spengono solo
  # quando ENTRAMBE rientrano (umidita' <= soglia-5 E temp <= soglia-1, con i
  # rispettivi "for" anti-sfarfallio). Override manuale: in Automatico un cambio
  # a mano dei selettori "tiene" finche' la prossima valutazione a soglia non lo
  # sovrascrive; per un override duraturo spegnere Automatico (modello standard).
  - id: serra_ventole_auto
    alias: "Serra: Ventole - Automatico a soglia"
    mode: single
    trigger:
      # NB: i trigger a soglia leggono i sensori LOGICI CALIBRATI (serra_clima_*),
      # gli stessi su cui decide l'azione: se triggerassero sui grezzi
      # (sensore_temperatura_serra_*) con la taratura umidita' -4% ci sarebbe uno
      # sfasamento (trigger scatta a 60% grezzo = 56% calibrato, azione non
      # accende fino a 64% grezzo) recuperato solo dal tick /15min.
      - platform: numeric_state
        entity_id: sensor.serra_clima_umidita
        above: input_number.serra_vent_soglia_umidita
        for: "00:02:00"
        id: "sopra_umid"
      - platform: numeric_state
        entity_id: sensor.serra_clima_temperatura
        above: input_number.serra_vent_soglia_temp
        for: "00:02:00"
        id: "sopra_temp"
      - platform: template
        value_template: >
          {{ states('sensor.serra_clima_umidita') | float(100)
             <= states('input_number.serra_vent_soglia_umidita') | float(60) - 5 }}
        for: "00:10:00"
        id: "sotto_umid"
      - platform: template
        value_template: >
          {{ states('sensor.serra_clima_temperatura') | float(100)
             <= states('input_number.serra_vent_soglia_temp') | float(28) - 1 }}
        for: "00:10:00"
        id: "sotto_temp"
      - platform: state
        entity_id: input_boolean.serra_schedule_ventole
        to: "on"
        id: "reconcile"
      # RIVALUTA anche quando cambia il contesto senza attraversamenti:
      # avvio coltivazione (il clima può essere GIÀ fuori soglia), cambio
      # soglie (fase_auto al cambio fase), e un tick ogni 15 minuti come
      # rete di sicurezza (ri-valuta la logica clima). Il RE-ASSERT fisico a
      # livello INVARIATO (per il desync-senza-riavvio: select già "medium" ma
      # ventole ferme → select_option no-op → la sync non parte) lo fa SOLO sui
      # reconcile veri coltivazione/schedule-on (B-a: NON sul tick né sui cambi
      # soglia, per non fare il kick a 100% ogni 15 min). Il diario solo al cambio.
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
        to: "on"
        id: "reconcile"
      - platform: state
        entity_id:
          - input_number.serra_vent_soglia_umidita
          - input_number.serra_vent_soglia_temp
        id: "soglia"
      - platform: time_pattern
        minutes: "/15"
        id: "tick"
    condition:
      # la coltivazione e' il MASTER: senza coltivazione niente controllo clima
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_schedule_ventole
        state: "on"
    action:
      - variables:
          # Sensori LOGICI (blocco "★ SENSORI CLIMA ★" nella sezione template):
          # arrivano GIA' tarati; unavailable se il fisico non risponde.
          clima_ok: >-
            {{ is_number(states('sensor.serra_clima_temperatura'))
               and is_number(states('sensor.serra_clima_umidita')) }}
          t_serra: "{{ states('sensor.serra_clima_temperatura') | float(0) }}"
          u_serra: "{{ states('sensor.serra_clima_umidita') | float(0) }}"
          soglia_t: "{{ states('input_number.serra_vent_soglia_temp') | float(28) }}"
          soglia_u: "{{ states('input_number.serra_vent_soglia_umidita') | float(60) }}"
          # Stanza = riferimento logico configurato dall'utente. Se non e'
          # disponibile -> -999 = niente confronto con la stanza.
          t_stanza: >-
            {% set m = states('sensor.serra_clima_rif_temperatura') %}
            {{ m | float if is_number(m) else -999 }}
          # Le ventole scambiano aria con la stanza (la serra ha 4 fori,
          # non e' isolata — osservazione del prototipo): raffreddano SOLO se
          # dentro fa piu' caldo che fuori (regola del delta). Sotto 1 grado
          # girano a vuoto: rumore e basta (tipico di notte a luci spente).
          raffreddabile: "{{ t_stanza == -999 or (t_serra - t_stanza) >= 1.0 }}"
          # Stesso principio per l'UMIDITA', ma il confronto giusto e' sul
          # PUNTO DI RUGIADA (contenuto assoluto d'acqua), non UR vs UR:
          # aria di casa piu' fresca, portata in una serra piu' calda, si
          # scalda e la sua UR crolla -> d'inverno ventilare puo' aiutare
          # anche con UR di casa alta. Magnus: a=17.62, b=243.12.
          u_stanza: >-
            {% set u = states('sensor.serra_clima_rif_umidita') %}
            {{ u | float if is_number(u) else -999 }}
          dew_serra: >-
            {% set a = log(([u_serra, 1] | max) / 100) + 17.62 * t_serra / (243.12 + t_serra) %}
            {{ 243.12 * a / (17.62 - a) }}
          dew_stanza: >-
            {% if t_stanza == -999 or u_stanza == -999 %}-99{% else %}
            {% set a = log(([u_stanza, 1] | max) / 100) + 17.62 * t_stanza / (243.12 + t_stanza) %}
            {{ 243.12 * a / (17.62 - a) }}{% endif %}
          deumidificabile: "{{ dew_stanza | float(-99) == -99 or (dew_serra | float(0) - dew_stanza | float(0)) >= 0.5 }}"
          # ISTERESI esplicita nell'azione: se le ventole sono GIA' in moto (auto
          # level != off) usa il FONDO banda (soglia-5% / soglia-1°C) per decidere
          # se RESTARE accese; se sono ferme usa la soglia DURA per accenderle.
          # Cosi' il tick /15 e i trigger sotto_umid/sotto_temp CONCORDANO: prima
          # il tick rivalutava con la soglia dura e spegneva a soglia (non al
          # fondo banda), vanificando l'isteresi.
          ventole_on: "{{ states('input_select.serra_all_fans_level') not in ['off', 'unknown', 'unavailable'] }}"
          soglia_u_eff: "{{ (soglia_u - 5) if ventole_on else soglia_u }}"
          soglia_t_eff: "{{ (soglia_t - 1) if ventole_on else soglia_t }}"
          fuori_soglia: "{{ (u_serra > soglia_u_eff and deumidificabile) or (t_serra > soglia_t_eff and raffreddabile) }}"
          # RIPOSO PERIODICO (requisito del prototipo: micro-ventole cinesi, mai
          # farle girare ininterrottamente): 15 min ogni 2 ore, minuti 45-59
          # delle ore dispari — allineato al tick /15. Batte tutto.
          riposo: "{{ now().hour % 2 == 1 and now().minute >= 45 }}"
          # FILTRO ODORI: nelle fasi odorose, se il clima non chiede ventole,
          # ciclo 30 min si' / 30 min no a low con TUTTE le ventole (F1/F2
          # spingono nel canale verso la frontale col filtro carboni).
          # Il ciclo e' agganciato all'orologio (minuti 0-29 = on).
          fase_odorosa: >-
            {{ states('sensor.serra_fase') in ['fioritura', 'flush', 'essiccazione']
               and is_state('input_boolean.serra_filtro_odori', 'on') }}
          odore_on: "{{ fase_odorosa and now().minute < 30 }}"
          # CASCATA (ordine = priorita'): riposo > failsafe sensore morto >
          # clima fuori soglia recuperabile > ciclo filtro odori > spente.
          target: >-
            {{ 'off' if riposo
               else ('low' if not clima_ok
               else (states('input_select.serra_vent_livello_auto') if fuori_soglia
               else ('low' if odore_on else 'off'))) }}
          # calcolato PRIMA del select_option: e' il cuore del fix post-reboot
          invariato: "{{ states('input_select.serra_all_fans_level') == target }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.serra_all_fans_level
        data:
          option: "{{ target }}"
      # RE-ASSERT fisico su desync SENZA riavvio serra (comando UART/MQTT
      # droppato): se il livello e' gia' quello giusto ('invariato'), il
      # select_option sopra e' un no-op -> la sync non pubblica -> le ventole
      # restano ferme mentre il select dice il valore giusto, senza recupero
      # fino al reconcile. B-a (2026-07-14): ripubblichiamo il comando fisico SOLO
      # sui reconcile VERI (coltivazione-on / schedule-ventole-on, trigger.id==
      # 'reconcile'), NON sul tick /15 ne' sui cambi soglia (id 'soglia'): sul Pi
      # 'fans set all -i low/medium' fa un WAKE a 100% -> farlo ogni 15 min =
      # kick ripetuto delle micro-ventole (+ appiattisce eventuali override
      # per-ventola). Il desync-senza-riavvio si recupera al prossimo
      # attraversamento soglia o reconcile. Bypassa il select (nessun cambio
      # stato/cascata) e non scrive diario.
      - if:
          - condition: template
            value_template: "{{ invariato and target != 'off' and trigger.id == 'reconcile' }}"
        then:
          - action: mqtt.publish
            data:
              topic: "serra/cmd/ha"
              payload: "fans set all -i {{ target }}"
      - choose:
          # riposo periodico: loggato (raro: solo durante run lunghi)
          - conditions:
              - condition: template
                value_template: "{{ not invariato and riposo }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: "Ventole · riposo periodico (15 min)"
          # sensore clima morto -> failsafe: diario dedicato (una volta)
          - conditions:
              - condition: template
                value_template: "{{ not invariato and not clima_ok }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: "Ventole · low (SICUREZZA: sensore clima non disponibile)"
          # livello cambiato -> il comando fisico lo manda la sync (come
          # sempre); qui SOLO la riga di diario, una volta per cambio.
          # (il re-assert a livello INVARIATO lo fa lo step mqtt.publish
          #  qui sopra, sui giri periodici tick/reconcile)
          - conditions:
              - condition: template
                value_template: "{{ not invariato and target != 'off' and fuori_soglia }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: >-
                    Ventole · {{ target }}
                    ({%- set per_u = u_serra > soglia_u and deumidificabile -%}
                    {%- set per_t = t_serra > soglia_t and raffreddabile -%}
                    {%- if per_u and per_t %}umidità {{ u_serra | round(0) | int }}% + temperatura {{ t_serra | round(1) }}°C
                    {%- elif per_t %}temperatura {{ t_serra | round(1) }}°C
                    {%- else %}umidità {{ u_serra | round(0) | int }}%{% endif %})
          # off per rientro clima: NON loggare nelle fasi odorose (il ciclo
          # 30/30 del filtro accende/spegne di continuo: sarebbe spam) ne'
          # le transizioni del ciclo odori stesso.
          - conditions:
              - condition: template
                value_template: "{{ not invariato and target == 'off' and not fase_odorosa }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: >-
                    Ventole · off (umidità {{ u_serra | round(0) | int }}% · {{ t_serra | round(1) }}°C
                    {%- if t_serra > soglia_t and not raffreddabile %} · caldo ma ≈ casa: raffreddare non serve{% endif %}
                    {%- if u_serra > soglia_u and not deumidificabile %} · casa più umida: ventilare non aiuta{% endif %})

  # =========================================================================
  # NOTIFICHE V2 (2026-07-26) — DIGEST AZIONI PENDENTI.
  # Fonte unica: sensor.serra_azioni_pendenti (manuali di oggi + in ritardo,
  # done-aware via attr fatti del diario). Due invii al giorno agli orari dei
  # helper input_datetime.serra_digest_{mattina,sera} (modificabili da UI);
  # il serale parte solo se c'e' ANCORA qualcosa di pendente (condizione >0).
  # Canale mobile facoltativo tramite script.serra_push_facoltativa,
  # fire-and-forget con script.turn_on. Mirror persistent
  # (id fisso serra_digest, sovrascritto) auto-dismesso quando i pendenti
  # tornano a zero. I checkpoint del giorno viaggiano in coda al messaggio
  # ("Da osservare"), mai come pendenti.
  # Le vecchie serra_notifica_azioni_oggi (09:00, solo giorno==oggi, non
  # done-aware) e serra_notifica_booster_pendente (20:00, testo statico)
  # sono state PENSIONATE da questo digest (backup .bk-20260726-1250).
  # =========================================================================
  - id: serra_digest_azioni
    alias: "Serra: Digest azioni pendenti (mattina/sera)"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_digest_mattina
        id: mattina
      - platform: time
        at: input_datetime.serra_digest_sera
        id: sera
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      # AUDIT R1 (RT-12): il master serra_notifiche_push NON sta piu' qui —
      # zittiva anche il mirror in campanella. Ora gate SOLO il push (if
      # nell'azione): notifiche spente = niente telefono, ma la campanella e
      # il drawer continuano a raccontare la verita'.
      # AUDIT R1 (RT-05): condizione sull'ATTRIBUTO, non sullo stato — lo
      # stato dei sensori auto-referenziali e' indietro di un ciclo e passa
      # per 0 nei transitori di avvio/reload.
      # AUDIT R1 (NT-04): in OR anche i CHECKPOINT DI OGGI — un giorno con solo
      # osservazioni (g32 prime infiorescenze, g86 tricomi...) e zero azioni
      # arretrate non produceva NESSUNA notifica: piu' eri puntuale, piu' li
      # perdevi. Il corpo del messaggio gestisce gia' il caso "solo checkpoint"
      # (lista pendenti vuota → resta la riga "Da osservare: ...").
      - condition: template
        value_template: >-
          {{ ((state_attr('sensor.serra_azioni_pendenti','pendenti') or []) | count > 0)
             or ((state_attr('sensor.serra_eventi_effettivi','eventi') or [])
                 | selectattr('tipo','eq','checkpoint')
                 | selectattr('giorno','eq', states('sensor.serra_giorno_ciclo') | int(0))
                 | list | count > 0)
             or is_state('input_boolean.serra_schedule_luci','off')
             or is_state('input_boolean.serra_schedule_acqua','off')
             or is_state('input_boolean.serra_schedule_ventole','off')
             or is_state('input_boolean.serra_schedule_nutrienti','off') }}
    action:
      - variables:
          digest_titolo: "🌱 Serra — azioni da fare"
          # NB: righe costruite in lista + join('\n') — MAI affidarsi agli
          # a-capo del sorgente: il block scalar >- li ripiega in spazi.
          # AUDIT R1 (NT-12): cap a 8 righe-azione (le PIU' vecchie prima,
          # come la card) + coda "…e altre N": senza cap il worst case reale
          # era un muro di 15 righe illeggibile proprio nel giorno peggiore.
          digest_msg: >-
            {% set p = state_attr('sensor.serra_azioni_pendenti','pendenti') or [] %}
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set checks = ev | selectattr('tipo','eq','checkpoint') | selectattr('giorno','eq',d) | list %}
            {% set ns = namespace(l=[]) %}
            {% for e in p[:8] %}
              {% set q = 'Oggi' if e.ritardo == 0 else ('Da 1 giorno' if e.ritardo == 1 else 'Da ' ~ e.ritardo ~ ' giorni') %}
              {% set ns.l = ns.l + ['• ' ~ q ~ ' — ' ~ e.titolo] %}
            {% endfor %}
            {% set extra = (p | count) - 8 %}
            {% if extra > 0 %}
              {% set ns.l = ns.l + ['…e ' ~ ('un’altra azione' if extra == 1 else 'altre ' ~ extra ~ ' azioni') ~ ' in ritardo'] %}
            {% endif %}
            {% if checks | count > 0 %}
              {% set ns.l = ns.l + ['Da osservare: ' ~ (checks | map(attribute='titolo') | join(' · '))] %}
            {% endif %}
            {# Modalita' Manuale dimenticata (03/08): promemoria per luci/
               acqua/ventole. Ring e Nutrienti esclusi di proposito. #}
            {% set man = [] %}
            {% if is_state('input_boolean.serra_schedule_luci','off') %}{% set man = man + ['Luci'] %}{% endif %}
            {% if is_state('input_boolean.serra_schedule_acqua','off') %}{% set man = man + ['Acqua'] %}{% endif %}
            {% if is_state('input_boolean.serra_schedule_ventole','off') %}{% set man = man + ['Ventole'] %}{% endif %}
            {% if is_state('input_boolean.serra_schedule_nutrienti','off') %}{% set man = man + ['Nutrienti'] %}{% endif %}
            {% if man | count > 0 %}
              {% set ns.l = ns.l + ['⚠️ Modalità Libera attiva su: ' ~ (man | join(', ')) ~ ' — il programma è sospeso.'] %}
            {% endif %}
            {{ ns.l | join('\n') }}
      # AUDIT R1 (RT-12): il push e' l'unica parte gated dal master — il
      # mirror in campanella si crea SEMPRE (e' il canale per chi ha spento
      # le notifiche sul telefono).
      - if:
          - condition: state
            entity_id: input_boolean.serra_notifiche_push
            state: "on"
          # gate per-slot (Fase 4): ogni digest ha il suo interruttore.
          # trigger.id assente = lancio manuale/test -> passa comunque.
          - condition: template
            value_template: >-
              {{ trigger.id is not defined
                 or (trigger.id == 'mattina' and is_state('input_boolean.serra_digest_mattina_attivo','on'))
                 or (trigger.id == 'sera' and is_state('input_boolean.serra_digest_sera_attivo','on')) }}
        then:
          - service: script.turn_on
            target:
              entity_id: script.serra_push_facoltativa
            data:
              variables:
                message: "{{ digest_msg }}"
                title: "{{ digest_titolo }}"
                # destinazione del tap: modificabile da UI (helper Serra Notifica URL)
                mobile_url: "{{ states('input_text.serra_notifica_url') }}"
      - service: persistent_notification.create
        data:
          notification_id: serra_digest
          title: "{{ digest_titolo }}"
          message: "{{ digest_msg }}"

  # AUDIT R1 (NT-07): il mirror in campanella era creato SOLO agli orari del
  # digest → fino a ~15h di contenuto stantio (azione fatta alle 10, la
  # campanella la chiedeva fino alle 18). Ora si AGGIORNA a ogni cambio del
  # testo pendenti (stesso id: sovrascrive). Il for: 10s scarta i transitori
  # di reload; il contenuto qui e' volutamente compatto (righe della card):
  # per suggerimenti e checkpoint resta il digest agli orari.
  - id: serra_digest_mirror_refresh
    alias: "Serra: Digest - mirror campanella live"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.serra_azioni_pendenti_testo
        for: "00:00:10"
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: template
        value_template: "{{ (state_attr('sensor.serra_azioni_pendenti','pendenti') or []) | count > 0 }}"
      - condition: template
        value_template: "{{ states('sensor.serra_azioni_pendenti_testo') not in ['unknown','unavailable',''] }}"
    action:
      # AUDIT R2 (NT2-08): STESSA costruzione del digest (bullet, cap 8,
      # checkpoint in coda) — prima si sovrascriveva il mirror col testo
      # della card (cap 4, niente bullet ne' checkpoint): 10s dopo un cambio
      # il messaggio in campanella si DEGRADAVA. REGOLA: se si tocca
      # digest_msg in serra_digest_azioni, tenere in sync anche questo.
      - variables:
          refresh_msg: >-
            {% set p = state_attr('sensor.serra_azioni_pendenti','pendenti') or [] %}
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set checks = ev | selectattr('tipo','eq','checkpoint') | selectattr('giorno','eq',d) | list %}
            {% set ns = namespace(l=[]) %}
            {% for e in p[:8] %}
              {% set q = 'Oggi' if e.ritardo == 0 else ('Da 1 giorno' if e.ritardo == 1 else 'Da ' ~ e.ritardo ~ ' giorni') %}
              {% set ns.l = ns.l + ['• ' ~ q ~ ' — ' ~ e.titolo] %}
            {% endfor %}
            {% set extra = (p | count) - 8 %}
            {% if extra > 0 %}
              {% set ns.l = ns.l + ['…e ' ~ ('un’altra azione' if extra == 1 else 'altre ' ~ extra ~ ' azioni') ~ ' in ritardo'] %}
            {% endif %}
            {% if checks | count > 0 %}
              {% set ns.l = ns.l + ['Da osservare: ' ~ (checks | map(attribute='titolo') | join(' · '))] %}
            {% endif %}
            {# Modalita' Manuale dimenticata (03/08): promemoria per luci/
               acqua/ventole. Ring e Nutrienti esclusi di proposito. #}
            {% set man = [] %}
            {% if is_state('input_boolean.serra_schedule_luci','off') %}{% set man = man + ['Luci'] %}{% endif %}
            {% if is_state('input_boolean.serra_schedule_acqua','off') %}{% set man = man + ['Acqua'] %}{% endif %}
            {% if is_state('input_boolean.serra_schedule_ventole','off') %}{% set man = man + ['Ventole'] %}{% endif %}
            {% if is_state('input_boolean.serra_schedule_nutrienti','off') %}{% set man = man + ['Nutrienti'] %}{% endif %}
            {% if man | count > 0 %}
              {% set ns.l = ns.l + ['⚠️ Modalità Libera attiva su: ' ~ (man | join(', ')) ~ ' — il programma è sospeso.'] %}
            {% endif %}
            {{ ns.l | join('\n') }}
      - service: persistent_notification.create
        data:
          notification_id: serra_digest
          title: "🌱 Serra — azioni da fare"
          message: "{{ refresh_msg }}"

  # Mirror persistent del digest: si dismette da solo quando non c'e' piu'
  # nulla di pendente (tutte le azioni FATTE dal pannello, o fine coltura).
  - id: serra_digest_autodismiss
    alias: "Serra: Digest - dismiss a pendenti zero"
    mode: single
    trigger:
      # AUDIT R1 (NT-02, evidenza live): a ogni reload lo stato passa per
      # N -> unavailable -> 0 -> N in ~200ms e senza `for:` il dismiss
      # scattava sul transitorio. I 30s ignorano il blip; la condizione
      # scarta anche il caso "sensore rotto" (fail-closed).
      - platform: numeric_state
        entity_id: sensor.serra_azioni_pendenti
        below: 1
        for: "00:00:30"
      # AUDIT R2 (NT2-09): il numeric_state scatta solo sull'ATTRAVERSAMENTO
      # della soglia — un mirror creato con pendenti GIA' a zero (digest di
      # soli checkpoint, NT-04) non veniva mai dismesso e il checkpoint di
      # ieri restava in campanella. Al cambio giorno si ripulisce (se oggi
      # ha checkpoint, il digest del mattino lo ricrea comunque).
      # AUDIT R3/R4 (RT3-03, riapplicato: il primo fix era andato perso in
      # uno script abortito): not_from + for — senza, il trigger scattava sul
      # transitorio 17→unavailable→17 dei reload (2 trace il 27/07 12:36).
      - platform: state
        entity_id: sensor.serra_giorno_ciclo
        not_from:
          - "unavailable"
          - "unknown"
        for: "00:00:30"
    condition:
      - condition: template
        value_template: "{{ states('sensor.serra_azioni_pendenti') not in ['unknown','unavailable'] }}"
      - condition: template
        value_template: "{{ ((state_attr('sensor.serra_azioni_pendenti','pendenti')) or []) | count == 0 }}"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: serra_digest

  # Aggiunta nutrienti AUTOMATICA (dosatori a pompa): nei giorni con un evento
  # "aggiunta" (top-up SENZA cambio acqua), se serra_dosatori_auto è ON, eroga
  # l'incremento del piano con le pompe. Il CAMBIO acqua invece dosa già alla
  # conferma (serra_acqua_cambio_fatto). Time-trigger 1×/giorno = idempotente.
  # AUDIT R1 (RT-03): orario in helper (input_datetime.serra_dose_ora, come il
  # digest); condizione IDEMPOTENTE e FAIL-CLOSED sul done-state (se l'evento
  # e' gia' FATTO — o la mappa fatti non e' leggibile — NON si eroga: per il
  # dosaggio meglio saltare che raddoppiare); a erogazione avvenuta si scrive
  # "Piano · FATTO: <titolo>" nel diario (riga ESATTA, senza suffissi: il
  # done-state matcha per titolo) → pendenti/digest smettono di chiederla.
  - id: serra_nutrient_aggiunta_auto
    alias: "Serra: Nutrienti - aggiunta automatica (dosatori)"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_dose_ora
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_dosatori_auto
        state: "on"
      # In Libero i dosaggi pianificati sono sospesi (04/08)
      - condition: state
        entity_id: input_boolean.serra_schedule_nutrienti
        state: "on"
      # AUDIT R2 (RT2-03): centralina giu' = NIENTE erogazione e NIENTE FATTO
      # — l'azione resta pendente nel digest (verita'), si riprova domani o a
      # mano. Prima si scriveva FATTO su un comando MQTT mai consegnato.
      - condition: state
        entity_id: sensor.serra_bridge_online
        state: "online"
      - condition: template
        value_template: >-
          {% set fatti = state_attr('sensor.serra_diario','fatti') %}
          {% if fatti is not mapping %}
            {{ false }}
          {% else %}
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set eo = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set pe = state_attr('sensor.serra_piano','eventi') or [] %}
            {% set titoli = eo | selectattr('giorno','eq',d) | map(attribute='titolo') | list %}
            {% set ns = namespace(found=false) %}
            {% for p in pe %}
              {% if p.titolo in titoli and p.get('dose', {}).get('modo') == 'aggiunta'
                    and (p.get('dose', {}).get('grow',0) + p.get('dose', {}).get('micro',0) + p.get('dose', {}).get('bloom',0)) > 0
                    and fatti.get(p.titolo | replace('’',"'") | replace('‘',"'") | replace('“','"') | replace('”','"') | trim) != 'FATTO' %}
                {% set ns.found = true %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
          {% endif %}
    action:
      - variables:
          dose: >-
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set eo = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set pe = state_attr('sensor.serra_piano','eventi') or [] %}
            {% set titoli = eo | selectattr('giorno','eq',d) | map(attribute='titolo') | list %}
            {% set ns = namespace(dose={}) %}
            {% for p in pe %}
              {% if not ns.dose and p.titolo in titoli and p.get('dose', {}).get('modo') == 'aggiunta' %}
                {% set ns.dose = p.dose %}
              {% endif %}
            {% endfor %}
            {{ ns.dose }}
          titolo_evento: >-
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set eo = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set pe = state_attr('sensor.serra_piano','eventi') or [] %}
            {% set titoli = eo | selectattr('giorno','eq',d) | map(attribute='titolo') | list %}
            {% set ns = namespace(t='') %}
            {% for p in pe %}
              {% if not ns.t and p.titolo in titoli and p.get('dose', {}).get('modo') == 'aggiunta' %}
                {% set ns.t = p.titolo %}
              {% endif %}
            {% endfor %}
            {{ ns.t }}
      - action: script.serra_nutrient_aggiunta_applica
        data:
          grow: "{{ dose.get('grow', 0) }}"
          micro: "{{ dose.get('micro', 0) }}"
          bloom: "{{ dose.get('bloom', 0) }}"
      # AUDIT R2 (RT2-03): FATTO solo se ALMENO una pompa richiesta e' tarata
      # (cal > 0) — se sono tutte "a siringa" non e' finito nulla in vasca e
      # l'azione deve RESTARE pendente (lo script ha gia' scritto le righe
      # "A SIRINGA" nel diario). Mappa pompe: grow→2(R), micro→1(G), bloom→0(B).
      - if:
          - condition: template
            value_template: >-
              {{ (dose.get('grow',0)  | float(0) > 0 and states('input_number.serra_cal_pompa_2_ml_s') | float(0) > 0)
                 or (dose.get('micro',0) | float(0) > 0 and states('input_number.serra_cal_pompa_1_ml_s') | float(0) > 0)
                 or (dose.get('bloom',0) | float(0) > 0 and states('input_number.serra_cal_pompa_0_ml_s') | float(0) > 0) }}
        then:
          # riga FATTO esatta (fire-and-forget, regola del progetto)
          - action: script.turn_on
            target:
              entity_id: script.serra_diario_scrivi
            data:
              variables:
                msg: "Piano · FATTO: {{ titolo_evento }}"

  # (PENSIONATA 2026-07-26, notifiche v2: il promemoria booster delle 20:00
  #  e' assorbito dal digest serale di serra_digest_azioni, che nomina il
  #  booster pendente con titolo e ritardo. Il latch serra_booster_da_dare e
  #  il ring viola restano invariati. Backup: .bk-20260726-1250.)

  # RECONCILE FISICO ORARIO: dopo un reboot della SOLA serra i micro
  # ripartono SPENTI mentre gli stati MQTT in HA restano quelli vecchi
  # (nessun readback spontaneo). Ogni ora, a coltivazione attiva, si
  # RI-AFFERMA lo stato atteso: ventole (comandi grezzi sui 3 livelli),
  # luci (mix dagli slider, solo se attese accese — publish diretto, NON lo
  # script applica_mix, per non riempire il diario ogni ora) e ring (manager).
  # Idempotente: riaffermare uno stato già vero non produce effetti visibili
  # (mix uguale = nessun cambio; ring stesso colore; fan kick momentaneo ok).
  # UNICO proprietario del re-assert: riafferma sul fisico lo stato logico
  # di ventole, luci (solo se attese on: i mix manuali notturni non vengono
  # spenti) e ring (apply gated su ring_auto). Scatta SOLO quando la serra
  # si e' RIAVVIATA davvero (sensor.serra_boot cambia: catena serra-uptime
  # sul Pi -> serra/state/boot, anti-jitter 30s) — niente re-assert periodici:
  # ri-asserire il mix luci fa SFARFALLARE il pannello (2026-07-13, per
  # questo NIENTE time_pattern qui). Latenza max di rilevazione: 15 min.
  - id: serra_reconcile_fisico
    alias: "Serra: Reconcile fisico (al riavvio serra)"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.serra_boot
        not_from:
          - unknown
          - unavailable
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
    action:
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · riavvio serra rilevato · ripristino luci/ventole/ring"
      - if:
          - condition: state
            entity_id: input_boolean.serra_schedule_ventole
            state: "on"
        then:
          - repeat:
              for_each:
                - { fan: "1", sel: "input_select.serra_fan_1_level" }
                - { fan: "2", sel: "input_select.serra_fan_2_level" }
                - { fan: "F", sel: "input_select.serra_fan_f_level" }
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item.sel) != 'off' }}"
                  then:
                    - action: mqtt.publish
                      data:
                        topic: "serra/cmd/ha"
                        payload: "fans set {{ repeat.item.fan }} -i {{ states(repeat.item.sel) }}"
      # LUCI: se dovrebbero essere ACCESE riafferma il mix; se SPENTE
      # (notte) ri-pubblica lo SPENTO — così dopo un reboot notturno lo
      # stato MQTT (e il display HA) non resta "acceso" congelato dal giorno
      # (bug 2026-07-13/14: reboot notturno lasciava le luci "accese" in HA).
      - if:
          - condition: state
            entity_id: input_boolean.serra_schedule_luci
            state: "on"
        then:
          - if:
              - condition: state
                entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
                state: "on"
            then:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: >-
                    lights mix
                    -a {{ states('input_number.serra_luce_ch_a') | int(0) }}
                    -g {{ states('input_number.serra_luce_ch_g') | int(0) }}
                    -b {{ states('input_number.serra_luce_ch_b') | int(0) }}
                    -r {{ states('input_number.serra_luce_ch_r') | int(0) }}
                    -d {{ states('input_number.serra_luce_ch_d') | int(0) }}
            else:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: "lights mix -a 0 -g 0 -b 0 -r 0 -d 0"
      - if:
          - condition: state
            entity_id: input_boolean.serra_ring_auto
            state: "on"
        then:
          - action: script.serra_ring_manager_apply

  # PROMEMORIA CONFERME DI FASE (modello milestone): flush ed essiccazione
  # partono solo a conferma; quando il PREVISTO è superato senza conferma,
  # notifica PERSISTENTE ogni mattina (resta in campanella finché non la
  # chiudi o confermi — la conferma la dismisses da sola).
  - id: serra_promemoria_ancore
    alias: "Serra: Promemoria conferme di fase"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_promemoria_ora
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      # AUDIT R2 (RT2-08/NT2-10, decisione prototipo 27/07): NIENTE gate sul
      # master push — questo promemoria scrive SOLO in campanella (nessun
      # push) e la regola RT-12 e' "il master zittisce solo il telefono, la
      # campanella dice sempre la verita'". Se un giorno avra' un push, va
      # gated SOLO quel ramo (pattern del digest).
    action:
      - if:
          - condition: template
            value_template: >-
              {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
              {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
              {{ m is not none and m.flush_g == 0 and m.flush_prev < 9999 and d > m.flush_prev }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: serra_promemoria_flush
              title: "🌊 Serra: flush previsto superato"
              message: >-
                {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
                Il flush era previsto per g{{ m.flush_prev }} (oggi g{{ states('sensor.serra_giorno_ciclo') }}).
                Controlla i tricomi: quando è il momento, imposta la data nella milestone "Inizio flush" del Calendario —
                finché non la imposti si resta in fioritura.
      - if:
          - condition: template
            value_template: >-
              {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
              {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
              {{ m is not none and m.ess_g == 0 and m.ess_prev < 9999 and d > m.ess_prev }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: serra_promemoria_taglio
              title: "✂️ Serra: raccolto previsto superato"
              message: >-
                {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
                Il taglio era previsto per g{{ m.ess_prev }} (oggi g{{ states('sensor.serra_giorno_ciclo') }}).
                Microscopio sui tricomi (lattiginosi + qualche ambrato = pronta): quando tagli,
                imposta la data nella milestone "taglio" del Calendario.

  # SYNC DEFAULT ÀNCORE: finché la CONFERMA di una milestone è OFF, la sua data
  # viene tenuta sul default/previsto corrente (dal piano e dalle milestone a
  # monte, via mappa) — così il date-picker si apre sempre su una data sensata
  # e la sentinella 2099 non si vede mai. Scrivere lo stesso valore = no-op.
  - id: serra_ancore_default_sync
    alias: "Serra: Milestone - sync date di default"
    mode: queued
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: sensor.serra_fasi_effettive
        attribute: mappa
      # AUDIT R1/Fase B: la mappa contiene solo giorni RELATIVI al piano, che
      # non cambiano spostando la semina — senza questo trigger le date di
      # default restavano calcolate sulla semina vecchia fino al riavvio.
      - platform: state
        entity_id: input_datetime.serra_data_semina
      # AUDIT R2 (MC2-04): per le FOTO pre-flip il default della fioritura e'
      # "OGGI" — ma senza un trigger giornaliero congelava al giorno del
      # cambio varieta': aprire il picker settimane dopo proponeva un flip
      # RETRODATATO (timeline nel passato + scavalcamenti + booster ri-armato
      # a un tap). Per le auto la riscrittura e' un no-op (stesso valore).
      - platform: time
        at: "00:05:00"
      - platform: state
        entity_id:
          - input_boolean.serra_conferma_vegetativa
          - input_boolean.serra_conferma_fioritura
          - input_boolean.serra_conferma_flush
          - input_boolean.serra_conferma_essiccazione
        to: "off"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ state_attr('sensor.serra_fasi_effettive','mappa') is not none }}"
      - condition: template
        value_template: "{{ (state_attr('input_datetime.serra_data_semina','timestamp') | float(0)) > 0 }}"
    action:
      - if:
          - condition: state
            entity_id: input_boolean.serra_conferma_vegetativa
            state: "off"
        then:
          - action: input_datetime.set_datetime
            target: {entity_id: input_datetime.serra_inizio_vegetativa}
            data:
              date: "{{ (as_local(as_datetime(state_attr('input_datetime.serra_data_semina','timestamp') | float(0))).date() + timedelta(days=(state_attr('sensor.serra_fasi_effettive','mappa').veg_g - 1))).strftime('%Y-%m-%d') }}"
      # AUDIT R1 (MC-16): per le FOTO pre-flip (fior_g/flush_prev/ess_prev a
      # 9999) i picker NON venivano piu' sincronizzati e restavano congelati
      # sui default AUTOFIORENTI (date senza senso, e un tap li confermava).
      # Ora la proposta neutra e': fioritura = OGGI (il flip si decide adesso),
      # flush/essiccazione = oggi + durate foto a cascata.
      - if:
          - condition: state
            entity_id: input_boolean.serra_conferma_fioritura
            state: "off"
        then:
          - action: input_datetime.set_datetime
            target: {entity_id: input_datetime.serra_inizio_fioritura}
            data:
              date: >-
                {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
                {% set semina = as_local(as_datetime(state_attr('input_datetime.serra_data_semina','timestamp') | float(0))).date() %}
                {{ (semina + timedelta(days=(m.fior_g - 1))).strftime('%Y-%m-%d') if m.fior_g < 9999
                   else now().date().strftime('%Y-%m-%d') }}
      - if:
          - condition: state
            entity_id: input_boolean.serra_conferma_flush
            state: "off"
        then:
          - action: input_datetime.set_datetime
            target: {entity_id: input_datetime.serra_inizio_flush}
            data:
              date: >-
                {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
                {% set semina = as_local(as_datetime(state_attr('input_datetime.serra_data_semina','timestamp') | float(0))).date() %}
                {{ (semina + timedelta(days=(m.flush_prev - 1))).strftime('%Y-%m-%d') if m.flush_prev < 9999
                   else (now().date() + timedelta(days=m.dur_fior)).strftime('%Y-%m-%d') }}
      - if:
          - condition: state
            entity_id: input_boolean.serra_conferma_essiccazione
            state: "off"
        then:
          - action: input_datetime.set_datetime
            target: {entity_id: input_datetime.serra_inizio_essiccazione}
            data:
              date: >-
                {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
                {% set semina = as_local(as_datetime(state_attr('input_datetime.serra_data_semina','timestamp') | float(0))).date() %}
                {{ (semina + timedelta(days=(m.ess_prev - 1))).strftime('%Y-%m-%d') if m.ess_prev < 9999
                   else (now().date() + timedelta(days=(m.dur_fior + m.dur_flush))).strftime('%Y-%m-%d') }}

  # AUTOCONFERMA: se l'UTENTE cambia la data di una milestone (il context ha uno
  # user_id: i riallineamenti del sync non ce l'hanno), la conferma si accende
  # da sola — cambiare la data È la conferma. L'interruttore resta come
  # indicatore e come "annulla" (off -> il sync riporta la data al previsto).
  - id: serra_ancora_autoconferma
    alias: "Serra: Milestone - autoconferma su modifica manuale"
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - input_datetime.serra_inizio_vegetativa
          - input_datetime.serra_inizio_fioritura
          - input_datetime.serra_inizio_flush
          - input_datetime.serra_inizio_essiccazione
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id is not none }}"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: >-
            {{ {'input_datetime.serra_inizio_vegetativa': 'input_boolean.serra_conferma_vegetativa',
                'input_datetime.serra_inizio_fioritura': 'input_boolean.serra_conferma_fioritura',
                'input_datetime.serra_inizio_flush': 'input_boolean.serra_conferma_flush',
                'input_datetime.serra_inizio_essiccazione': 'input_boolean.serra_conferma_essiccazione'}[trigger.entity_id] }}

  # DIARIO ÀNCORE: conferma accesa/spenta e spostamenti di data (a conferma
  # accesa) nel diario permanente; per flush/taglio chiude il promemoria.
  # I riallineamenti del sync (conferma spenta) NON vanno a diario.
  - id: serra_ancora_diario
    alias: "Serra: Milestone cambiata - diario"
    mode: queued
    trigger:
      - platform: state
        id: conferma
        entity_id:
          - input_boolean.serra_conferma_vegetativa
          - input_boolean.serra_conferma_fioritura
          - input_boolean.serra_conferma_flush
          - input_boolean.serra_conferma_essiccazione
      - platform: state
        id: data
        entity_id:
          - input_datetime.serra_inizio_vegetativa
          - input_datetime.serra_inizio_fioritura
          - input_datetime.serra_inizio_flush
          - input_datetime.serra_inizio_essiccazione
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      # AUDIT R1 (RT-11): la conferma accesa dall'AUTOCONFERMA (context con
      # parent) e' figlia di un cambio-data gia' loggato dal trigger 'data' —
      # loggarla di nuovo duplicava la riga. Le accensioni manuali da UI
      # (parent nullo) e TUTTI gli spegnimenti restano loggati.
      - condition: template
        value_template: >-
          {{ not (trigger.id == 'conferma'
                  and trigger.to_state.state == 'on'
                  and trigger.to_state.context.parent_id is not none) }}
    action:
      - variables:
          nome: >-
            {{ {'input_boolean.serra_conferma_vegetativa': 'vegetativa',
                'input_boolean.serra_conferma_fioritura': 'fioritura',
                'input_boolean.serra_conferma_flush': 'flush',
                'input_boolean.serra_conferma_essiccazione': 'essiccazione (taglio)',
                'input_datetime.serra_inizio_vegetativa': 'vegetativa',
                'input_datetime.serra_inizio_fioritura': 'fioritura',
                'input_datetime.serra_inizio_flush': 'flush',
                'input_datetime.serra_inizio_essiccazione': 'essiccazione (taglio)'}[trigger.entity_id] }}
          date_ent: >-
            {{ {'vegetativa': 'input_datetime.serra_inizio_vegetativa',
                'fioritura': 'input_datetime.serra_inizio_fioritura',
                'flush': 'input_datetime.serra_inizio_flush',
                'essiccazione (taglio)': 'input_datetime.serra_inizio_essiccazione'}[nome] }}
          bool_ent: >-
            {{ {'vegetativa': 'input_boolean.serra_conferma_vegetativa',
                'fioritura': 'input_boolean.serra_conferma_fioritura',
                'flush': 'input_boolean.serra_conferma_flush',
                'essiccazione (taglio)': 'input_boolean.serra_conferma_essiccazione'}[nome] }}
          semina_ts: "{{ state_attr('input_datetime.serra_data_semina','timestamp') | float(0) }}"
          new_ts: "{{ state_attr(date_ent, 'timestamp') | float(0) }}"
          anchor_g: "{{ ((as_local(as_datetime(new_ts)).date() - as_local(as_datetime(semina_ts)).date()).days + 1) if (new_ts | float(0)) > 0 and (semina_ts | float(0)) > 0 else 0 }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'conferma' and trigger.to_state.state == 'on' }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: "Coltivazione · milestone {{ nome }} CONFERMATA: g{{ anchor_g }} ({{ (new_ts | float(0)) | timestamp_custom('%d/%m') }})"
                  origine: manuale
              - if:
                  - condition: template
                    value_template: "{{ nome == 'flush' }}"
                then:
                  - action: persistent_notification.dismiss
                    data: {notification_id: serra_promemoria_flush}
              - if:
                  - condition: template
                    value_template: "{{ nome == 'essiccazione (taglio)' }}"
                then:
                  - action: persistent_notification.dismiss
                    data: {notification_id: serra_promemoria_taglio}
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'conferma' and trigger.to_state.state == 'off' }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: "Coltivazione · milestone {{ nome }} annullata (si torna al previsto)"
                  origine: manuale
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'data' and is_state(bool_ent, 'on') }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: "Coltivazione · milestone {{ nome }} spostata: g{{ anchor_g }} ({{ (new_ts | float(0)) | timestamp_custom('%d/%m') }})"
                  origine: manuale

  # SCAVALCAMENTI (modello milestone): se una milestone viene RETRODATATA, eventi che
  # erano nel futuro possono finire nel passato senza essere mai stati "oggi"
  # (il digest non li ha mai notificati). Qui: notifica PERSISTENTE + diario
  # permanente + latch booster se tra loro c'è un booster. Le conferme via CTA
  # (milestone = oggi) non scavalcano mai nulla: questa scatta solo sui retro-date.
  - id: serra_ancora_scavalcamenti
    alias: "Serra: Milestone retrodatata - eventi scavalcati"
    mode: queued
    # AUDIT R1 (RT-11): tolti i trigger sui BOOLEANI di conferma — il flusso
    # reale e' sempre "cambio data → autoconferma accende il booleano", quindi
    # il doppio trigger produceva 2-3 esecuzioni (e righe di diario duplicate)
    # per una sola azione. Basta il trigger sulla data (+ delay di
    # assestamento gia' presente). Una conferma accesa A MANO senza cambiare
    # la data non puo' scavalcare nulla: la data e' gia' sincronizzata al piano.
    trigger:
      - platform: state
        entity_id:
          - input_datetime.serra_inizio_vegetativa
          - input_datetime.serra_inizio_fioritura
          - input_datetime.serra_inizio_flush
          - input_datetime.serra_inizio_essiccazione
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
    action:
      - delay: "00:00:02"
      - variables:
          nome: >-
            {{ {'input_boolean.serra_conferma_vegetativa': 'vegetativa',
                'input_boolean.serra_conferma_fioritura': 'fioritura',
                'input_boolean.serra_conferma_flush': 'flush',
                'input_boolean.serra_conferma_essiccazione': 'essiccazione',
                'input_datetime.serra_inizio_vegetativa': 'vegetativa',
                'input_datetime.serra_inizio_fioritura': 'fioritura',
                'input_datetime.serra_inizio_flush': 'flush',
                'input_datetime.serra_inizio_essiccazione': 'essiccazione'}[trigger.entity_id] }}
          date_ent: >-
            {{ {'vegetativa': 'input_datetime.serra_inizio_vegetativa',
                'fioritura': 'input_datetime.serra_inizio_fioritura',
                'flush': 'input_datetime.serra_inizio_flush',
                'essiccazione': 'input_datetime.serra_inizio_essiccazione'}[nome] }}
          bool_ent: >-
            {{ {'vegetativa': 'input_boolean.serra_conferma_vegetativa',
                'fioritura': 'input_boolean.serra_conferma_fioritura',
                'flush': 'input_boolean.serra_conferma_flush',
                'essiccazione': 'input_boolean.serra_conferma_essiccazione'}[nome] }}
      # la data conta solo a conferma accesa (i riallineamenti del sync non contano)
      - condition: template
        value_template: "{{ is_state(bool_ent, 'on') }}"
      - variables:
          d: "{{ states('sensor.serra_giorno_ciclo') | int(0) }}"
          semina_ts: "{{ state_attr('input_datetime.serra_data_semina','timestamp') | float(0) }}"
          anchor_ts: "{{ state_attr(date_ent, 'timestamp') | float(0) }}"
          anchor_g: >-
            {{ ((as_local(as_datetime(anchor_ts)).date() - as_local(as_datetime(semina_ts)).date()).days + 1)
               if ((anchor_ts | float(0)) > 0 and (anchor_ts | float(0)) < 4000000000 and (semina_ts | float(0)) > 0) else 0 }}
          scavalcati: >-
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {{ ev | selectattr('tipo','defined')
                  | selectattr('tipo','in',['azione','booster','checkpoint','raccolto'])
                  | selectattr('giorno','ge', anchor_g | int)
                  | selectattr('giorno','lt', d | int) | list }}
      - if:
          - condition: template
            value_template: "{{ (anchor_g | int) > 0 and (scavalcati | count) > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: serra_eventi_scavalcati
              title: "⚠️ Serra: eventi scavalcati dallo spostamento"
              message: >-
                Retrodatando la milestone, questi eventi sono finiti nel passato senza mai
                essere stati "oggi": {{ scavalcati | map(attribute='titolo') | join(' · ') }}.
                Falli ora, oppure chiudi questa notifica se li consideri superati.
          - action: script.serra_diario_scrivi
            data:
              msg: "Coltivazione · milestone retrodatata, eventi scavalcati: {{ scavalcati | map(attribute='titolo') | join(' / ') }}"
              origine: manuale
          # M7 (2026-07-14): ri-arma il latch SOLO se tra gli scavalcati c'e' un
          # booster NON ancora dato (giorno > serra_booster_dato_giorno). Prima
          # ri-armava anche booster gia' somministrati: es. confermando la milestone
          # in ritardo (finestra [anchor_g, oggi) ampia), l'F9 a g37 gia' dato
          # veniva ri-acceso (ring viola + promemoria serale spuri).
          - if:
              - condition: template
                value_template: >-
                  {{ scavalcati | selectattr('tipo','eq','booster')
                     | selectattr('giorno','gt', states('input_number.serra_booster_dato_giorno') | int(-1))
                     | list | count > 0 }}
            then:
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.serra_booster_da_dare}

  # AUDIT R1 (MC-13): anche lo spostamento della SEMINA scavalca eventi (il
  # giorno-di-ciclo salta in avanti quando la semina viene retrodatata), ma
  # serra_ancora_scavalcamenti guarda solo le 4 milestone. Stessa notifica,
  # stessa riga di diario, stesso ri-armo del booster (specchio di M7).
  - id: serra_semina_scavalcamenti
    alias: "Serra: Semina spostata - eventi scavalcati"
    mode: queued
    trigger:
      - platform: state
        entity_id: input_datetime.serra_data_semina
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown','unavailable','']
             and trigger.to_state.state not in ['unknown','unavailable',''] }}
    action:
      - delay: "00:00:02"
      - variables:
          shift: >-
            {{ (as_datetime(trigger.from_state.state).date() - as_datetime(trigger.to_state.state).date()).days }}
          d: "{{ states('sensor.serra_giorno_ciclo') | int(0) }}"
          old_d: "{{ (d | int) - (shift | int) }}"
          scavalcati: >-
            {% if (shift | int) <= 0 %}
              {{ [] }}
            {% else %}
              {{ (state_attr('sensor.serra_eventi_effettivi','eventi') or [])
                 | selectattr('tipo','defined')
                 | selectattr('tipo','in',['azione','booster','checkpoint','raccolto'])
                 | selectattr('giorno','gt', old_d | int)
                 | selectattr('giorno','lt', d | int) | list }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ (scavalcati | count) > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: serra_eventi_scavalcati
              title: "⚠️ Serra: eventi scavalcati dallo spostamento della semina"
              message: >-
                Spostando la data di semina, questi eventi sono finiti nel passato senza mai
                essere stati "oggi": {{ scavalcati | map(attribute='titolo') | join(' · ') }}.
                Falli ora, oppure chiudi questa notifica se li consideri superati.
          - action: script.turn_on
            target:
              entity_id: script.serra_diario_scrivi
            data:
              variables:
                msg: "Coltivazione · semina spostata, eventi scavalcati: {{ scavalcati | map(attribute='titolo') | join(' / ') }}"
                origine: manuale
          - if:
              - condition: template
                value_template: >-
                  {{ scavalcati | selectattr('tipo','eq','booster')
                     | selectattr('giorno','gt', states('input_number.serra_booster_dato_giorno') | int(-1))
                     | list | count > 0 }}
            then:
              - action: input_boolean.turn_on
                target: {entity_id: input_boolean.serra_booster_da_dare}

  # AUDIT R1 (MC-14): milestone CONFERMATA con data PRIMA della semina —
  # il motore la ignora (usa il default del piano) ma il picker resta in
  # disaccordo permanente senza che nulla lo dica. Qui almeno lo si dice.
  - id: serra_ancora_incoerente
    alias: "Serra: Milestone prima della semina - avviso"
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - input_datetime.serra_inizio_vegetativa
          - input_datetime.serra_inizio_fioritura
          - input_datetime.serra_inizio_flush
          - input_datetime.serra_inizio_essiccazione
      # AUDIT R2 (MC2-03): la stessa incoerenza si crea spostando la SEMINA
      # sotto un'ancora confermata — senza questo trigger nessuno avvisava.
      - platform: state
        entity_id: input_datetime.serra_data_semina
      # AUDIT R4 (R4H-05): anche lo SPEGNERE una conferma deve ri-valutare —
      # e' proprio la via d'uscita suggerita dal messaggio dell'avviso.
      - platform: state
        entity_id:
          - input_boolean.serra_conferma_vegetativa
          - input_boolean.serra_conferma_fioritura
          - input_boolean.serra_conferma_flush
          - input_boolean.serra_conferma_essiccazione
        to: "off"
    # AUDIT R4 (R4H-05): niente gate coltivazione a livello automazione — il
    # DISMISS deve funzionare anche a serra spenta; il gate sta nel ramo create.
    action:
      # AUDIT R2 (MC2-03/MC2-10): scansione di TUTTE le ancore confermate
      # invece della sola triggerata — cosi' l'avviso copre anche il caso
      # "semina spostata sotto un'ancora confermata" (nuovo trigger sotto).
      # Soglia <= 1: a g1 il clamp veg_g>=2 sposta comunque il motore di un
      # giorno rispetto al picker, in silenzio — meglio dirlo.
      - variables:
          ancore_rotte: >-
            {% set semina_ts = state_attr('input_datetime.serra_data_semina','timestamp') | float(0) %}
            {% set ns = namespace(bad=[]) %}
            {% for f in ['vegetativa','fioritura','flush','essiccazione'] %}
              {% set ts = state_attr('input_datetime.serra_inizio_' ~ f, 'timestamp') | float(0) %}
              {% if semina_ts > 0 and ts > 0 and ts < 4000000000
                    and is_state('input_boolean.serra_conferma_' ~ f, 'on')
                    and (as_local(as_datetime(ts)).date() - as_local(as_datetime(semina_ts)).date()).days + 1 <= 1 %}
                {% set ns.bad = ns.bad + [f] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad }}
      # AUDIT R3 (MC3-03): era l'unica notifica del package senza dismiss —
      # corretta la data, l'avviso restava per sempre. Ora: rotte>0 crea,
      # rotte==0 dismette (if/else al posto della condition secca).
      - if:
          - condition: template
            value_template: "{{ ancore_rotte | count > 0 and is_state('input_boolean.serra_coltivazione_attiva','on') }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: serra_ancora_incoerente
              title: "⚠️ Serra: milestone prima della semina"
              message: >-
                Milestone confermate con data alla semina o precedente:
                {{ ancore_rotte | join(', ') }}. Queste date vengono riportate
                al previsto del piano. Correggere le date, oppure spegnere le
                conferme per tornare al previsto.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: serra_ancora_incoerente

  # Piano illeggibile (errore di sintassi in serra_piano.yaml): il parser
  # fallisce e il sensore va unavailable. fase_auto è protetta dal guard,
  # ma senza questo avviso non te ne accorgeresti.
  - id: serra_notifica_piano_illeggibile
    alias: "Serra: Notifica piano illeggibile"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.serra_piano
        # M4: un raise del parser (refuso nel piano) porta il command_line sensor
        # a 'unknown', NON 'unavailable' -> prima l'avviso era muto. Copriamo entrambi.
        to: ["unavailable", "unknown"]
        for: "00:10:00"
    action:
      - service: persistent_notification.create
        data:
          notification_id: serra_piano_illeggibile
          title: "⚠️ Serra: piano di coltivazione illeggibile"
          message: "Il piano di coltivazione non è leggibile — probabile errore di sintassi dopo una modifica. I passaggi di fase automatici sono in pausa e le impostazioni restano com'erano finché il piano non torna valido."

  # Allarme acqua: si spegne da solo entrando in essiccazione (vasca vuota
  # di proposito) e si riaccende all'avvio di una nuova coltivazione.
  - id: serra_acqua_alert_auto
    alias: "Serra: Allarme acqua - auto on/off per fase"
    mode: single
    trigger:
      # AUDIT R5 (R5-02): not_from anche qui — in essiccazione ogni reload
      # faceva unavailable→essiccazione e rifaceva turn_off + riga diario
      # (e rispegneva in silenzio un allarme riacceso a mano).
      - platform: state
        entity_id: sensor.serra_fase
        to: "essiccazione"
        not_from:
          - "unavailable"
          - "unknown"
          - "sconosciuta"
          - "essiccazione"
        id: "spegni"
      # AUDIT R3 (MC3-08) + R4 (R4H-04): chiusura ANTICIPATA — e not_from,
      # perche' a serra spenta ogni reload fa unavailable→sconosciuta→conclusa
      # e rifaceva turn_off + riga diario a ogni giro.
      - platform: state
        entity_id: sensor.serra_fase
        to: "conclusa"
        not_from:
          - "unavailable"
          - "unknown"
          - "sconosciuta"
          - "conclusa"
        id: "spegni"
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
        to: "on"
        id: "accendi"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: "spegni"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.serra_notifica_acqua
              - action: script.serra_diario_scrivi
                data:
                  msg: "Acqua · allarme acqua bassa disattivato ({{ 'coltivazione conclusa' if is_state('sensor.serra_fase','conclusa') else 'essiccazione' }}: vasca vuota)"
          - conditions:
              - condition: trigger
                id: "accendi"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.serra_notifica_acqua
              - action: script.serra_diario_scrivi
                data:
                  msg: "Acqua · allarme acqua bassa attivato (coltivazione avviata)"

  # =========================================================================
  # CENTRALINA (Pi/bridge) OFFLINE — rete di sicurezza per il BLACKOUT.
  # Il Pi e' il cuore: bridge, timer, reconcile, foto, acqua. Se muore (Pi
  # spento, wifi non riconnessa dopo reboot, crash), HA continua a mostrare
  # gli ultimi valori RETAINED (stato-fantasma) e sembra tutto ok. Senza
  # questo allarme un blackout in cui il Pi non riparte = grow che muore in
  # silenzio. sensor.serra_bridge_online = offline via Last-Will MQTT del
  # bridge. delay_on lungo: un riavvio normale del Pi rientra in <5 min.
  # =========================================================================
  - id: serra_bridge_offline_alert
    alias: "Serra: Centralina offline - allarme"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.serra_bridge_online
        to: "offline"
        for: "00:07:00"
    action:
      - service: persistent_notification.create
        data:
          notification_id: serra_bridge_offline
          title: "⚠️ Serra: CENTRALINA OFFLINE"
          message: >-
            Il Raspberry della serra non risponde da oltre 7 minuti: luci,
            acqua, ventole, foto e ripristini NON funzionano e l'app mostra
            solo valori vecchi.
            {% if is_state('input_boolean.serra_coltivazione_attiva','on') %}
            ⚠️ COLTIVAZIONE IN CORSO: intervenire presto (controllare che il
            Raspberry sia alimentato, acceso e connesso al Wi-Fi).
            {% else %}Nessuna coltivazione in corso.{% endif %}
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · centralina OFFLINE — nessun controllo attivo"

  - id: serra_bridge_online_ok
    alias: "Serra: Centralina online - rientro"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.serra_bridge_online
        to: "online"
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state == 'offline' }}"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: serra_bridge_offline
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · centralina di nuovo ONLINE"

  # Sensore clima serra non disponibile (batteria scarica?): le ventole
  # sono gia' in failsafe (low fisso, vedi ventole_auto); qui la notifica.
  # NB prototipo ha gia' il monitoraggio batterie di casa: questa e' la
  # versione "HA standard" per chi usa solo questo package.
  - id: serra_sensore_clima_ko
    alias: "Serra: Sensore clima - non disponibile"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.serra_clima_temperatura
          - sensor.serra_clima_umidita
        to: "unavailable"
        for: "00:10:00"
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          notification_id: serra_sensore_clima
          title: "🌡️ Serra: sensore clima non disponibile"
          message: >-
            Il sensore di temperatura/umidità della serra non risponde da 10
            minuti: probabile batteria scarica. Le ventole restano in SICUREZZA
            al minimo finché non torna.
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · sensore clima NON disponibile (ventole in sicurezza: low)"

  - id: serra_sensore_clima_ok
    alias: "Serra: Sensore clima - rientro"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.serra_clima_temperatura
          - sensor.serra_clima_umidita
        from: "unavailable"
    condition:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.serra_clima_temperatura'))
             and is_number(states('sensor.serra_clima_umidita')) }}
      # AUDIT R1 (RT-09, verificato: 4 righe fantasma in un giorno): a ogni
      # riavvio i template sensor passano per 'unavailable' per pochi secondi
      # e il "rientro" veniva loggato senza nessun guasto. Un rientro VERO
      # presuppone un KO da almeno ~10 min (stessa soglia dell'alert).
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and (now() - trigger.from_state.last_changed).total_seconds() > 590 }}
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: serra_sensore_clima
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · sensore clima di nuovo disponibile"

  - id: serra_notifica_errore
    alias: "Serra: Notifica errore pendente"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.serra_errore_pendente
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          notification_id: serra_errore_pendente
          title: "🔴 Serra: comando fallito"
          message: >-
            Componente: {{ states('input_text.serra_errore_componente') or 'sconosciuto' }}.
            {% set d = states('input_text.serra_errore_dettaglio') %}
            {{ 'Comando: `' ~ d ~ '`. ' if d else '' }}
            Il ring è rosso: si spegne da solo se lo stesso componente poi riesce, o col reset nella pagina LED Ring.

  # Compagna della precedente (igiene notifiche v2): la persistent dell'errore
  # non veniva MAI dismessa. Qualunque via spenga il latch (reset manuale,
  # autoclear al comando riuscito, toggle a mano) → via anche la notifica.
  - id: serra_notifica_errore_dismiss
    alias: "Serra: Notifica errore - dismiss al rientro"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.serra_errore_pendente
        to: "off"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: serra_errore_pendente


# =============================================================================
# TEMPLATE SENSORS & TRIGGERS
# =============================================================================

template:

  # ==========================================================================
  # ★ SENSORI CLIMA ★ — UNICO punto dove impostare i sensori fisici.
  # Vedi il banner in testa al file. I valori "serra" escono GIA' TARATI
  # (misurato + input_number.serra_taratura_*). `availability` fa diventare
  # il sensore logico `unavailable` se il fisico non risponde: le automazioni
  # lo usano per il failsafe (ventole a low + notifica).
  # ==========================================================================
  - sensor:
      - name: "Serra Clima Temperatura"
        unique_id: serra_clima_temperatura
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {% set sorgente = states('input_text.serra_sorgente_temp_interna') %}
          {{ sorgente.startswith('sensor.') and is_number(states(sorgente)) }}
        state: >-
          {% set sorgente = states('input_text.serra_sorgente_temp_interna') %}
          {{ states(sorgente) | float(0)
             + (states('input_number.serra_taratura_temp') | float(0)
                if is_state('input_boolean.serra_taratura_clima_attiva', 'on')
                else 0) }}

      - name: "Serra Clima Umidità"
        unique_id: serra_clima_umidita
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: >-
          {% set sorgente = states('input_text.serra_sorgente_umid_interna') %}
          {{ sorgente.startswith('sensor.') and is_number(states(sorgente)) }}
        state: >-
          {% set sorgente = states('input_text.serra_sorgente_umid_interna') %}
          {{ states(sorgente) | float(0)
             + (states('input_number.serra_taratura_umidita') | float(0)
                if is_state('input_boolean.serra_taratura_clima_attiva', 'on')
                else 0) }}

      # VPD (Vapor Pressure Deficit) — la "sete" dell'aria vista dalla pianta,
      # da temp+umidita' CALIBRATE. FASE 1 = SOLO MONITORAGGIO: nessuna
      # automazione lo usa ancora, la logica ventole resta invariata.
      # state = VPD ARIA (kPa) = SVP(T)*(1-UR/100), SVP=0.6108*e^(17.27T/(T+237.3)).
      # attr vpd_foglia = stima con foglia a -2°C (piu' vicina alle chart standard).
      # I target per fase sono INDICATIVI (da ritarare sui dati reali in Fase 2).
      # availability: se manca UNO dei due sensori -> unavailable (fail-safe:
      # niente numero fuorviante, le soglie temp/umidita' restano la rete).
      - name: "Serra VPD"
        unique_id: serra_vpd
        unit_of_measurement: "kPa"
        state_class: measurement
        icon: mdi:water-opacity
        availability: >-
          {{ is_number(states('sensor.serra_clima_temperatura'))
             and is_number(states('sensor.serra_clima_umidita')) }}
        state: >-
          {% set t = states('sensor.serra_clima_temperatura') | float %}{% set rh = states('sensor.serra_clima_umidita') | float %}{{ (0.6108 * (e ** (17.27 * t / (t + 237.3))) * (1 - rh / 100)) | round(2) }}
        attributes:
          vpd_foglia: >-
            {% set t = states('sensor.serra_clima_temperatura') | float %}{% set rh = states('sensor.serra_clima_umidita') | float %}{% set svp = 0.6108 * (e ** (17.27 * t / (t + 237.3))) %}{% set svpl = 0.6108 * (e ** (17.27 * (t - 2) / ((t - 2) + 237.3))) %}{{ (svpl - svp * rh / 100) | round(2) }}
          fase: "{{ states('sensor.serra_fase') }}"
          target: >-
            {{ {'germinazione':'0.4–0.8','vegetativa':'0.8–1.2','fioritura':'1.2–1.6','flush':'1.2–1.6','essiccazione':'n/d (asciugatura)'}.get(states('sensor.serra_fase'), '—') }}
          stato: >-
            {% set t = states('sensor.serra_clima_temperatura') | float %}{% set rh = states('sensor.serra_clima_umidita') | float %}{% set v = 0.6108 * (e ** (17.27 * t / (t + 237.3))) * (1 - rh / 100) %}{% set f = states('sensor.serra_fase') %}{% set lo = {'germinazione':0.4,'vegetativa':0.8,'fioritura':1.2,'flush':1.2}.get(f, 0) %}{% set hi = {'germinazione':0.8,'vegetativa':1.2,'fioritura':1.6,'flush':1.6}.get(f, 0) %}{% if lo == 0 %}—{% elif v < lo %}troppo basso (umido){% elif v > hi %}troppo alto (secco){% else %}ideale{% endif %}

      # Stato TEMP/UMIDITA' vs RANGE ideale della fase (dal piano: temp_min/
      # umid_min = pavimento, soglia_* = tetto). state = ideale/troppo alto/
      # troppo basso/— (fase senza range). Alimenta le card "sei nel range?"
      # (verde dentro / rosso fuori) in Ventole e Panoramica. NB: le ventole
      # agiscono solo sul TETTO; il pavimento e' solo indicatore (non attuabile).
      - name: "Serra Temp Stato"
        unique_id: serra_temp_stato
        icon: mdi:thermometer
        state: >
          {% set a = (state_attr('sensor.serra_piano','ambiente') or {}).get(states('sensor.serra_fase')) or {} %}
          {% set lo = a.get('temp_min') %}{% set hi = a.get('soglia_temp') %}{% set t = states('sensor.serra_clima_temperatura') | float(none) %}
          {% if lo is none or hi is none or t is none %}—{% elif t > hi %}troppo alto{% elif t < lo %}troppo basso{% else %}ideale{% endif %}
        attributes:
          range: "{% set a = (state_attr('sensor.serra_piano','ambiente') or {}).get(states('sensor.serra_fase')) or {} %}{% set lo = a.get('temp_min') %}{% set hi = a.get('soglia_temp') %}{{ (lo ~ '-' ~ hi) if (lo is not none and hi is not none) else '—' }}"

      - name: "Serra Umidità Stato"
        unique_id: serra_umid_stato
        icon: mdi:water-percent
        state: >
          {% set a = (state_attr('sensor.serra_piano','ambiente') or {}).get(states('sensor.serra_fase')) or {} %}
          {% set lo = a.get('umid_min') %}{% set hi = a.get('soglia_umidita') %}{% set u = states('sensor.serra_clima_umidita') | float(none) %}
          {% if lo is none or hi is none or u is none %}—{% elif u > hi %}troppo alto{% elif u < lo %}troppo basso{% else %}ideale{% endif %}
        attributes:
          range: "{% set a = (state_attr('sensor.serra_piano','ambiente') or {}).get(states('sensor.serra_fase')) or {} %}{% set lo = a.get('umid_min') %}{% set hi = a.get('soglia_umidita') %}{{ (lo ~ '-' ~ hi) if (lo is not none and hi is not none) else '—' }}"

      - name: "Serra Clima Rif Temperatura"
        unique_id: serra_clima_rif_temperatura
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {% set sorgente = states('input_text.serra_sorgente_temp_stanza') %}
          {{ sorgente.startswith('sensor.') and is_number(states(sorgente)) }}
        state: >-
          {% set sorgente = states('input_text.serra_sorgente_temp_stanza') %}
          {{ states(sorgente) | float(0) }}

      - name: "Serra Clima Rif Umidità"
        unique_id: serra_clima_rif_umidita
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: >-
          {% set sorgente = states('input_text.serra_sorgente_umid_stanza') %}
          {{ sorgente.startswith('sensor.') and is_number(states(sorgente)) }}
        state: >-
          {% set sorgente = states('input_text.serra_sorgente_umid_stanza') %}
          {{ states(sorgente) | float(0) }}

  # ==========================================================================
  # DOSE NUTRIENTI dal piano (sezione "nutrienti" di serra_piano.yaml =
  # feeding chart TriPart). Risolve fase corrente + giorno DI FASE nel
  # periodo giusto (fino_giorno) ed espone ml/L e ml per la vasca REALE
  # (sensor.serra_acqua_litri). Unavailable fuori coltivazione o in fasi
  # senza dosaggio definito.
  # ==========================================================================
  - sensor:
      - name: "Serra Dose Nutrienti"
        unique_id: serra_dose_nutrienti
        icon: mdi:flask-outline
        availability: >-
          {{ (state_attr('sensor.serra_piano','nutrienti') or {}).get(states('sensor.serra_fase')) is not none }}
        state: >-
          {% set fase = states('sensor.serra_fase') %}
          {% set nutr = (state_attr('sensor.serra_piano','nutrienti') or {}).get(fase) or [] %}
          {% set m = state_attr('sensor.serra_fasi_effettive','mappa') or {} %}
          {% set g = states('sensor.serra_giorno_ciclo') | int(0) %}
          {% set start = {'germinazione': 1, 'vegetativa': m.get('veg_g'), 'fioritura': m.get('fior_g'), 'flush': m.get('flush_g'), 'essiccazione': m.get('ess_g')}.get(fase, 1) %}
          {% set gf = g - (start | int(1)) + 1 %}
          {% set ns = namespace(sel=none) %}
          {% for per in nutr %}
            {% if ns.sel is none and (per.get('fino_giorno') is none or gf <= per.get('fino_giorno') | int(0)) %}
              {% set ns.sel = per %}
            {% endif %}
          {% endfor %}
          {% if ns.sel is none %}
            solo acqua
          {% elif (ns.sel.get('grow',0) + ns.sel.get('micro',0) + ns.sel.get('bloom',0)) == 0 %}
            solo acqua
          {% else %}
            R {{ ns.sel.get('grow') }} · G {{ ns.sel.get('micro') }} · B {{ ns.sel.get('bloom') }} ml/L
          {% endif %}
        attributes:
          dose: >-
            {% set fase = states('sensor.serra_fase') %}
            {% set nutr = (state_attr('sensor.serra_piano','nutrienti') or {}).get(fase) or [] %}
            {% set m = state_attr('sensor.serra_fasi_effettive','mappa') or {} %}
            {% set g = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set start = {'germinazione': 1, 'vegetativa': m.get('veg_g'), 'fioritura': m.get('fior_g'), 'flush': m.get('flush_g'), 'essiccazione': m.get('ess_g')}.get(fase, 1) %}
            {% set gf = g - (start | int(1)) + 1 %}
            {% set litri = states('sensor.serra_acqua_litri') | float(0) %}
            {% if litri <= 0 %}{% set litri = states('input_number.serra_vasca_litri') | float(4.5) %}{% endif %}{# #19: se il livello e' stale/ignoto usa la CAPACITA' (helper), non 0 #}
            {% set ns = namespace(sel=none) %}
            {% for per in nutr %}
              {% if ns.sel is none and (per.get('fino_giorno') is none or gf <= per.get('fino_giorno') | int(0)) %}
                {% set ns.sel = per %}
              {% endif %}
            {% endfor %}
            {% if ns.sel is none %}
              {{ {} }}
            {% else %}
              {{ {'giorno_fase': gf,
                  'grow_ml_l': ns.sel.get('grow', 0), 'micro_ml_l': ns.sel.get('micro', 0), 'bloom_ml_l': ns.sel.get('bloom', 0),
                  'ec': ns.sel.get('ec', ''),
                  'vasca_litri': litri | round(1),
                  'grow_ml_vasca': (ns.sel.get('grow', 0) * litri) | round(1),
                  'micro_ml_vasca': (ns.sel.get('micro', 0) * litri) | round(1),
                  'bloom_ml_vasca': (ns.sel.get('bloom', 0) * litri) | round(1)} }}
            {% endif %}


  # ----------------------------
  # ACQUA: litri + alert acqua bassa
  # ----------------------------
  - sensor:
      # Litri = % livello * capacita' vasca. La capacita' NON e' piu' hard-coded:
      # arriva dall'helper input_number.serra_vasca_litri (fallback 4.5). Cambiare
      # la vasca = cambiare SOLO l'helper (vale anche per serra_acqua_stato e la dose).
      - name: "Serra Acqua Litri"
        unique_id: serra_acqua_litri
        unit_of_measurement: "L"
        state_class: measurement
        icon: mdi:water
        state: >
          {% set s = states('sensor.serra_livello_acqua') %}
          {% if s in ['unknown','unavailable','none',''] %}
            {{ none }}
          {% else %}
            {{ (s | float / 100 * (states('input_number.serra_vasca_litri') | float(4.5))) | round(2) }}
          {% endif %}

      # Testo "parlante" usato come sottotitolo nella card notifica acqua bassa
      # (popup home). Es: "Livello attuale: 12% (~0.5 L)".
      - name: "Serra Acqua Stato"
        unique_id: serra_acqua_stato
        icon: mdi:information-outline
        state: >
          {% set s = states('sensor.serra_livello_acqua') %}
          {% if s in ['unknown','unavailable','none',''] %}
            Livello non disponibile
          {% else %}
            {% set pct = s | float | round | int %}
            {% set l = (s | float / 100 * (states('input_number.serra_vasca_litri') | float(4.5))) | round(1) %}
            Livello attuale: {{ pct }}% (~{{ l }} L)
          {% endif %}

      # ----------------------------
      # GROW-TRACKER (giorni di fase definiti nel piano distribuito)
      # Fasi per giorno-di-ciclo: 1-7 germinazione, 8-28 vegetativa,
      # 29-70 fioritura, 71-92 flush (solo acqua), 93+ raccolto.
      # ----------------------------
      # NB (aggiornato AUDIT R3): giorno-ciclo/mappa/eventi restano calcolati
      # anche a serra spenta (si vede il piano), MA sensor.serra_fase dal
      # cluster F1 dice 'conclusa' quando la coltivazione e' off — e a cascata
      # dose_nutrienti va unavailable e i target clima cadono sulle bande di
      # 'conclusa'. Il gating delle azioni fisiche resta nelle automazioni.
      - name: "Serra Giorno Ciclo"
        unique_id: serra_giorno_ciclo
        icon: mdi:calendar-today
        state: >
          {% set t0 = state_attr('input_datetime.serra_data_semina','timestamp') | float(0) %}
          {# giorno-di-ciclo DST-safe: differenza tra DATE LOCALI (NON (now-t0)//86400,
             che oltre lo spring-forward di marzo sfaserebbe il tracker di -1 giorno) #}
          {% if t0 > 0 %}{{ (now().date() - as_local(as_datetime(t0)).date()).days + 1 }}{% else %}{{ none }}{% endif %}

      - name: "Serra Fase"
        unique_id: serra_fase
        icon: mdi:sprout
        state: >
          {# MODELLO ÀNCORE: i confini vengono da sensor.serra_fasi_effettive.
             Flush ed essiccazione partono SOLO se confermate (flush_g/ess_g > 0):
             oltre il previsto si resta nella fase precedente (+ promemoria).
             Vale per auto e foto (la mappa gestisce entrambe). #}
          {# AUDIT R1 (MC-05): flush/essiccazione richiedono ANCHE fior_g reale
             — su una foto senza flip confermato (fior_g 9999) una conferma di
             flush/ess orfana non deve far saltare la fase avanti mentre gli
             eventi restano pre-flip (i due sensori divergevano). #}
          {# F1 (decisione prototipo, audit R1 #7): l'essiccazione va A OLTRANZA
             — il piano STIMA, lo snap test DECIDE. Finche' la coltivazione e'
             attiva la fase resta "essiccazione" anche oltre la durata prevista
             (il pannello appende giorni tratteggiati in coda). #}
          {# AUDIT R2 (cluster F1, decisione prototipo 27/07): "conclusa" =
             coltivazione spenta, PUNTO. La vecchia forma (spenta AND durata
             esaurita AND taglio confermato) rendeva 'conclusa' irraggiungibile
             nel caso normale (snap test prima della durata "di sicurezza", o
             taglio mai confermato): foto giornaliera eterna, CTA irraggiungi-
             bile, milestone sbloccate. Nota: vale anche PRE-avvio (coltura mai
             partita) — i testi UI dicono "coltivazione non attiva". #}
          {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
          {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
          {% if m is none or d < 1 %}sconosciuta
          {% elif is_state('input_boolean.serra_coltivazione_attiva','off') %}conclusa
          {% elif m.ess_g > 0 and m.fior_g < 9999 and d >= m.ess_g %}essiccazione
          {% elif m.flush_g > 0 and m.fior_g < 9999 and d >= m.flush_g %}flush
          {% elif d >= m.fior_g %}fioritura
          {% elif d >= m.veg_g %}vegetativa
          {% else %}germinazione
          {% endif %}
        attributes:
          # Target ambientali per fase — BANDE AGRONOMICHE dalla tabella
          # Notion (decisione prototipo v0.8.7): SOLO DISPLAY, e VOLUTAMENTE
          # diverse dalle soglie di CONTROLLO ventole della sezione
          # `ambiente` del piano (quelle dicono quando intervenire, queste
          # qual e' il range ideale). AUDIT R1 (MC-12): rimossa la chiave
          # morta 'raccolto' (fase inesistente), aggiunta 'conclusa'.
          target_temp_giorno: >
            {% set f = states('sensor.serra_fase') %}
            {{ {'germinazione':'20-25','vegetativa':'22-28','fioritura':'20-26','flush':'20-26','essiccazione':'18-22','conclusa':'18-22'}.get(f,'-') }}
          target_temp_notte: >
            {% set f = states('sensor.serra_fase') %}
            {{ {'germinazione':'15-20','vegetativa':'17-23','fioritura':'15-21','flush':'15-21','essiccazione':'18-22','conclusa':'18-22'}.get(f,'-') }}
          target_umidita: >
            {% set f = states('sensor.serra_fase') %}
            {{ {'germinazione':'65-70','vegetativa':'55-65','fioritura':'40-50','flush':'40-50','essiccazione':'55-62','conclusa':'55-62'}.get(f,'-') }}

      # ----------------------------
      # FASI EFFETTIVE (modello milestone): risolve i CONFINI REALI delle fasi
      # combinando piano (default) e milestone-data (osservazione/conferma).
      # attr "mappa" (dict, none se piano illeggibile o semina non impostata):
      #   veg_g / fior_g = inizio veg / fioritura in giorni di ciclo
      #     (fioritura: milestone se impostata, altrimenti default piano per le
      #      auto, 9999 per le foto senza flip)
      #   flush_g, ess_g   = milestone CONFERMATA (0 = non confermata: la fase
      #                      NON parte — flush ed essiccazione solo a conferma)
      #   flush_prev, ess_prev, concl_g = confini previsti (default a cascata)
      #   flush_start, ess_start = confermato-oppure-previsto (per barre/eventi)
      #   base_fior/flush_plan/ess_plan = confini PIANIFICATI base (per gli offset)
      # ----------------------------
      - name: "Serra Fasi Effettive"
        unique_id: serra_fasi_effettive
        icon: mdi:map-marker-path
        state: >
          {% set ns = namespace(n=0) %}
          {% for e in ['vegetativa','fioritura','flush','essiccazione'] %}
            {% if is_state('input_boolean.serra_conferma_' ~ e, 'on') %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          mappa: >
            {% set semina_ts = state_attr('input_datetime.serra_data_semina','timestamp') | float(0) %}
            {% set fasi_p = state_attr('sensor.serra_piano','fasi') %}
            {% if fasi_p is none or semina_ts <= 0 %}
              {{ none }}
            {% else %}
              {# AUDIT R1 (MC-11): NIENTE fallback cablati (int(8)/int(29)/...
                 erano copie OBSOLETE del piano: 107 vs 114 reale) — se un
                 confine manca la mappa esce none, come per il piano
                 illeggibile: fallire visibilmente, mai indovinare. #}
              {% set foto = is_state('input_select.serra_varieta','Fotoperiodica') %}
              {% set p_veg = fasi_p | selectattr('nome','eq','vegetativa') | map(attribute='giorno') | list | first | int(0) %}
              {% set p_fi = fasi_p | selectattr('nome','eq','fioritura') | map(attribute='giorno') | list | first | int(0) %}
              {% set p_fl = fasi_p | selectattr('nome','eq','flush') | map(attribute='giorno') | list | first | int(0) %}
              {% set p_es = fasi_p | selectattr('nome','eq','essiccazione') | map(attribute='giorno') | list | first | int(0) %}
              {% set p_co = fasi_p | selectattr('nome','eq','conclusa') | map(attribute='giorno') | list | first | int(0) %}
              {% set fp = (state_attr('sensor.serra_piano','fotoperiodica') or {}).get('fasi', []) %}
              {% set f_fl = fp | selectattr('nome','eq','flush') | map(attribute='dopo_fioritura') | list | first | int(0) %}
              {% set f_es = fp | selectattr('nome','eq','essiccazione') | map(attribute='dopo_fioritura') | list | first | int(0) %}
              {% set f_co = fp | selectattr('nome','eq','conclusa') | map(attribute='dopo_fioritura') | list | first | int(0) %}
              {% set mappa_ok = p_veg > 0 and p_fi > p_veg and p_fl > p_fi and p_es > p_fl and p_co > p_es
                                and (not foto or (f_fl > 0 and f_es > f_fl and f_co > f_es)) %}
              {% if foto %}
                {% set dur_fior = f_fl %}{% set dur_flush = f_es - f_fl %}{% set dur_ess = f_co - f_es %}
                {% set fior_plan = 0 %}
              {% else %}
                {% set dur_fior = p_fl - p_fi %}{% set dur_flush = p_es - p_fl %}{% set dur_ess = p_co - p_es %}
                {% set fior_plan = p_fi %}
              {% endif %}
              {% set dur_veg = p_fi - p_veg %}
              {% set veg_ts = state_attr('input_datetime.serra_inizio_vegetativa','timestamp') | float(0) %}
              {% set fior_ts = state_attr('input_datetime.serra_inizio_fioritura','timestamp') | float(0) %}
              {% set flush_ts = state_attr('input_datetime.serra_inizio_flush','timestamp') | float(0) %}
              {% set ess_ts = state_attr('input_datetime.serra_inizio_essiccazione','timestamp') | float(0) %}
              {# la data conta SOLO con la conferma accesa (la data è sempre
                 valorizzata: da spenta viene tenuta sul default dal sync).
                 gc(ts, base): giorno-di-ciclo DST-safe = differenza tra DATE
                 LOCALI + 1. NON (ts-base)//86400: oltre il cambio d'ora una
                 giornata locale non dura 86400s (spring-forward 23h) → la
                 divisione intera sfaserebbe di ±1 giorno oltre il confine DST. #}
              {% macro gc(ts, base) %}{{ (as_local(as_datetime(ts)).date() - as_local(as_datetime(base)).date()).days + 1 }}{% endmacro %}
              {% set veg_a = (gc(veg_ts, semina_ts) | int) if (veg_ts > 0 and veg_ts < 4000000000 and is_state('input_boolean.serra_conferma_vegetativa','on')) else 0 %}
              {% set fior_a = (gc(fior_ts, semina_ts) | int) if (fior_ts > 0 and fior_ts < 4000000000 and is_state('input_boolean.serra_conferma_fioritura','on')) else 0 %}
              {% set flush_a = (gc(flush_ts, semina_ts) | int) if (flush_ts > 0 and flush_ts < 4000000000 and is_state('input_boolean.serra_conferma_flush','on')) else 0 %}
              {% set ess_a = (gc(ess_ts, semina_ts) | int) if (ess_ts > 0 and ess_ts < 4000000000 and is_state('input_boolean.serra_conferma_essiccazione','on')) else 0 %}
              {# AUDIT R1 (MC-06): CLAMP dell'ordine veg < fior < flush < ess.
                 Milestone confermate "fuori ordine" (retrodatate oltre la fase
                 precedente) facevano SPARIRE una fase in blocco (es. flush
                 prima della fioritura → fioritura saltata, luci/nutrienti da
                 flush). Qui si riporta ogni confine ad almeno +1 dal
                 precedente: la data del picker resta quella dell'utente, ma
                 il motore non produce mai una sequenza rotta. #}
              {% set veg_g = veg_a if veg_a > 0 else p_veg %}
              {% set veg_g = veg_g if veg_g >= 2 else 2 %}
              {% set fior_g = fior_a if fior_a > 0 else ((veg_g + dur_veg) if fior_plan > 0 else 9999) %}
              {# AUDIT R4 (RT3-02/MC3-05, riapplicato): clamp SOLO tra
                 confermate — un flip osservato a g5 non va spostato a g9
                 dalla vegetativa PREVISTA. #}
              {% set fior_g = fior_g if (fior_g >= 9999 or veg_a == 0 or fior_a == 0 or fior_g > veg_a) else veg_a + 1 %}
              {# AUDIT R2 (MC2-01): il clamp scatta SOLO tra ancore CONFERMATE
                 — un'osservazione non va mai spostata in avanti da una
                 PREVISIONE. Prima: taglio d'emergenza a g60 con flush mai
                 confermato veniva clampato a flush_prev+1 (es. g72) lasciando
                 luci e ricircoli di fioritura sul raccolto appeso per giorni
                 ("essiccazione: BUIO tassativo"). Se una conferma precede la
                 fase prevista, e' la fase prevista a comprimersi/saltare:
                 serra_fase da' comunque priorita' alla fase piu' avanzata. #}
              {% set flush_a = flush_a if (flush_a == 0 or fior_a == 0 or flush_a > fior_a) else fior_a + 1 %}
              {% set flush_prev = (fior_g + dur_fior) if fior_g < 9999 else 9999 %}
              {% set flush_start = flush_a if flush_a > 0 else flush_prev %}
              {# AUDIT R4 (R4H-09): con flush non confermato il taglio si
                 confronta con la FIORITURA confermata (mai con una prevista). #}
              {% set ess_a = ess_a if (ess_a == 0 or (flush_a > 0 and ess_a > flush_a) or (flush_a == 0 and (fior_a == 0 or ess_a > fior_a))) else ((flush_a + 1) if flush_a > 0 else fior_a + 1) %}
              {% set ess_prev = (flush_start + dur_flush) if flush_start < 9999 else 9999 %}
              {% set ess_start = ess_a if ess_a > 0 else ess_prev %}
              {% set concl = (ess_start + dur_ess) if ess_start < 9999 else 9999 %}
              {{ {'foto': foto, 'veg_g': veg_g, 'veg_plan': p_veg, 'veg_conf': veg_a > 0, 'base_fior': p_fi,
                  'fior_plan': fior_plan, 'flush_plan': p_fl, 'ess_plan': p_es,
                  'fior_g': fior_g, 'fior_conf': fior_a > 0,
                  'flush_g': flush_a, 'flush_prev': flush_prev, 'flush_start': flush_start,
                  'ess_g': ess_a, 'ess_prev': ess_prev, 'ess_start': ess_start,
                  'concl_g': concl,
                  'dur_fior': dur_fior, 'dur_flush': dur_flush, 'dur_ess': dur_ess} if mappa_ok else none }}
            {% endif %}

      # ----------------------------
      # EVENTI EFFETTIVI: la lista eventi "risolta" per la varietà corrente,
      # in giorni di ciclo, RIANCORATA per fase (modello milestone): ogni evento
      # conta dall'inizio EFFETTIVO (o previsto) della propria fase, con
      # offset = giorno pianificato - inizio pianificato della fase.
      # Con milestone ai default = identico al piano (retrocompatibile).
      # Foto senza flip: solo gli eventi pre-fioritura.
      # TUTTI i consumer (milestone, booster, raccolto, timeline) leggono da qui.
      # ----------------------------
      - name: "Serra Eventi Effettivi"
        unique_id: serra_eventi_effettivi
        icon: mdi:calendar-check
        state: "{{ (this.attributes.get('eventi', []) if this is defined else []) | count }}"
        attributes:
          eventi: >
            {% set base = state_attr('sensor.serra_piano','eventi') or [] %}
            {% set m = state_attr('sensor.serra_fasi_effettive','mappa') %}
            {% if m is none %}
              {{ base }}
            {% else %}
              {% set ns = namespace(out=[]) %}
              {% if m.foto %}
                {% for e in base %}
                  {% set moot = e.get('ancora','') != '' and is_state('input_boolean.serra_conferma_' ~ e.get('ancora',''), 'on') %}
                  {% if (e.giorno | int) < m.base_fior and not moot %}
                    {% set dp = e.giorno | int %}
                    {% set gg = dp if dp < m.veg_plan else (m.veg_g + dp - m.veg_plan) %}
                    {% set ns.out = ns.out + [{'giorno': gg, 'titolo': e.titolo, 'tipo': e.get('tipo',''), 'suggerimento': e.get('suggerimento','')}] %}
                  {% endif %}
                {% endfor %}
                {% if m.fior_g < 9999 %}
                  {% for e in (state_attr('sensor.serra_piano','fotoperiodica') or {}).get('eventi', []) %}
                    {% set moot = e.get('ancora','') != '' and is_state('input_boolean.serra_conferma_' ~ e.get('ancora',''), 'on') %}
                    {% if not moot %}
                    {% set off = e.dopo_fioritura | int(0) %}
                    {% set gg = (m.fior_g + off) if off < m.dur_fior
                                else (m.flush_start + off - m.dur_fior) if off < (m.dur_fior + m.dur_flush)
                                else (m.ess_start + off - m.dur_fior - m.dur_flush) %}
                    {# AUDIT R3 (MC3-04): come il ramo auto — pre-taglio moot #}
                    {% if not (m.ess_g > 0 and off < (m.dur_fior + m.dur_flush) and gg >= m.ess_g) %}
                    {% set ns.out = ns.out + [{'giorno': gg, 'titolo': e.titolo, 'tipo': e.get('tipo',''), 'suggerimento': e.get('suggerimento','')}] %}
                    {% endif %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% else %}
                {% for e in base %}
                  {% set moot = e.get('ancora','') != '' and is_state('input_boolean.serra_conferma_' ~ e.get('ancora',''), 'on') %}
                  {% if not moot %}
                  {% set dp = e.giorno | int %}
                  {% set gg = dp if dp < m.veg_plan
                              else (m.veg_g + dp - m.veg_plan) if dp < m.fior_plan
                              else (m.fior_g + dp - m.fior_plan) if dp < m.flush_plan
                              else (m.flush_start + dp - m.flush_plan) if dp < m.ess_plan
                              else (m.ess_start + dp - m.ess_plan) %}
                  {# AUDIT R3 (MC3-04): a taglio CONFERMATO (ess_g>0) gli
                     eventi delle fasi PRECEDENTI che cadrebbero oltre il
                     taglio sono moot — la pianta e' appesa: niente booster
                     di fioritura o "inizio flush" annunciati durante il buio.
                     Gli eventi del segmento essiccazione (dp >= ess_plan)
                     restano. #}
                  {% if not (m.ess_g > 0 and dp < m.ess_plan and gg >= m.ess_g) %}
                  {% set ns.out = ns.out + [{'giorno': gg, 'titolo': e.titolo, 'tipo': e.get('tipo',''), 'suggerimento': e.get('suggerimento','')}] %}
                  {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.out | sort(attribute='giorno') | list }}
            {% endif %}

      - name: "Serra Prossima Milestone"
        unique_id: serra_prossima_milestone
        icon: mdi:flag-checkered
        state: >
          {# F1: a eventi esauriti, se si sta ancora essiccando NON e'
             "completata" — lo snap test decide. Completata solo a fase
             conclusa (chiusura esplicita). #}
          {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
          {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
          {% set nxt = ev | selectattr('giorno','gt',d) | list | first %}
          {% if is_state('sensor.serra_fase','conclusa') %}Coltivazione non attiva
          {% elif nxt %}{{ nxt.titolo }} · g{{ nxt.giorno }} (tra {{ nxt.giorno - d }} gg)
          {% elif is_state('input_select.serra_varieta','Fotoperiodica')
                and is_state('input_boolean.serra_conferma_fioritura','off') %}In attesa inizio fioritura
          {% elif is_state('sensor.serra_fase','essiccazione') %}Essiccazione in corso · lo snap test decide il taglio
          {# AUDIT R2 (MC2-05): eventi esauriti ma fase ancora fioritura/flush
             = milestone flush/taglio mai confermate — dirlo, non "completata"
             (che contraddiceva il promemoria "previsto superato"). #}
          {% else %}Oltre il piano · confermare flush/taglio o concludere{% endif %}
        attributes:
          giorno_previsto: >
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set nxt = ev | selectattr('giorno','gt',d) | list | first %}
            {{ nxt.giorno if nxt else '-' }}
          giorni_mancanti: >
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set nxt = ev | selectattr('giorno','gt',d) | list | first %}
            {{ (nxt.giorno - d) if nxt else '-' }}

      - name: "Serra Prossimo Booster"
        unique_id: serra_prossimo_booster
        icon: mdi:flask
        state: >
          {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
          {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
          {% set nxt = ev | selectattr('tipo','defined') | selectattr('tipo','eq','booster')
                          | selectattr('giorno','ge',d) | list | first %}
          {# NB: "first" su lista vuota = undefined (non none) -> check di verita' #}
          {% if not nxt %}
            {%- if is_state('input_select.serra_varieta','Fotoperiodica')
                 and is_state('input_boolean.serra_conferma_fioritura','off') -%}
            In attesa inizio fioritura
            {%- else -%}Nessuno (fase flush/raccolto){%- endif %}
          {% elif nxt.giorno == d %}{{ nxt.titolo }} · OGGI (g{{ d }})
          {% else %}{{ nxt.titolo }} · g{{ nxt.giorno }} (tra {{ nxt.giorno - d }} gg)
          {% endif %}

      - name: "Serra Giorni Al Raccolto"
        unique_id: serra_giorni_al_raccolto
        unit_of_measurement: "giorni"
        icon: mdi:content-cut
        state: >
          {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
          {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
          {% set r = ev | selectattr('tipo','defined') | selectattr('tipo','eq','raccolto') | list | first %}
          {% if r %}{{ [ (r.giorno - d), 0 ] | max }}{% else %}{{ none }}{% endif %}

      # Ultimo ricircolo in sola LETTURA per la dashboard (l'input_datetime
      # sottostante e' scrivibile e mostrerebbe un date-picker editabile).
      # device_class timestamp -> la UI mostra "X ore fa".
      - name: "Serra Acqua Ultimo Ricircolo"
        unique_id: serra_acqua_ultimo_ricircolo_ro
        device_class: timestamp
        icon: mdi:history
        state: >
          {% set t = state_attr('input_datetime.serra_acqua_ultimo','timestamp') %}
          {{ (t | int(0)) | as_datetime if t else none }}

      # Stato pompe nutrienti in forma leggibile (lista "Stato attuale" della
      # view Nutrienti: informativa, non una CTA).
      - name: "Serra Nutrient 0 Stato"
        unique_id: serra_nutrient_0_stato
        icon: mdi:water-pump
        state: "{{ 'In erogazione' if is_state('sensor.serra_nutrient_0_running_now','on') else 'Ferma' }}"
      - name: "Serra Nutrient 1 Stato"
        unique_id: serra_nutrient_1_stato
        icon: mdi:water-pump
        state: "{{ 'In erogazione' if is_state('sensor.serra_nutrient_1_running_now','on') else 'Ferma' }}"
      - name: "Serra Nutrient 2 Stato"
        unique_id: serra_nutrient_2_stato
        icon: mdi:water-pump
        state: "{{ 'In erogazione' if is_state('sensor.serra_nutrient_2_running_now','on') else 'Ferma' }}"

      # ----------------------------
      # AZIONI PENDENTI (notifiche v2): LA fonte unica per badge/drawer/digest.
      # Eventi MANUALI (azione/booster/raccolto) con giorno <= oggi il cui
      # done-state (attr 'fatti' di sensor.serra_diario, dall'intero diario)
      # NON e' FATTO — gli ANNULLATO tornano da fare, come nel pannello.
      # I checkpoint sono osservazioni: mai qui (solo nel digest del giorno).
      # Ordinati per ritardo crescente (oggi in testa). A coltivazione spenta: [].
      # state = quante; attr pendenti = [{giorno,titolo,tipo,ritardo}].
      # ----------------------------
      - name: "Serra Azioni Pendenti"
        unique_id: serra_azioni_pendenti
        icon: mdi:clipboard-alert-outline
        state: "{{ (this.attributes.get('pendenti', []) if this is defined else []) | count }}"
        attributes:
          # AUDIT R1 (NT-05): FAIL-CLOSED — se la mappa fatti non e' leggibile
          # (sensore in errore/avvio) meglio ZERO pendenti che una valanga di
          # falsi pendenti nel digest. `is mapping` scarta none/unavailable.
          pendenti: >
            {% set fatti = state_attr('sensor.serra_diario','fatti') %}
            {% if is_state('input_boolean.serra_coltivazione_attiva','on') and fatti is mapping %}
              {% set oggi = states('sensor.serra_giorno_ciclo') | int(0) %}
              {% set eventi = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
              {% set ns = namespace(p=[]) %}
              {% for e in eventi if e.tipo in ['azione','booster','raccolto'] and (e.giorno|int) <= oggi %}
                {% set t = e.titolo | replace('’',"'") | replace('‘',"'") | replace('“','"') | replace('”','"') | trim %}
                {% if fatti.get(t) != 'FATTO' %}
                  {% set ns.p = ns.p + [{'giorno': e.giorno|int, 'titolo': e.titolo, 'tipo': e.tipo, 'ritardo': oggi - (e.giorno|int)}] %}
                {% endif %}
              {% endfor %}
              {# AUDIT R1 (NT-11): ritardo DECRESCENTE — le azioni piu' vecchie
                 PRIME, cosi' il taglio a 4 della card non nasconde proprio
                 le cose dimenticate da piu' tempo. #}
              {{ ns.p | sort(attribute='ritardo', reverse=true) | list }}
            {% else %}
              []
            {% endif %}

      # Sottotitolo per la card del drawer notifiche: UNA RIGA PER AZIONE nel
      # formato "Quando — Cosa" (Oggi / Da 1 giorno / Da N giorni), a-capo \n
      # renderizzati dalla card (.maint-detail ha white-space: pre-line).
      # Max 4 righe + "…e altre N azioni" (lo stato ha il limite dei 255 char).
      - name: "Serra Azioni Pendenti Testo"
        unique_id: serra_azioni_pendenti_testo
        icon: mdi:clipboard-text-outline
        state: >
          {% set p = state_attr('sensor.serra_azioni_pendenti','pendenti') or [] %}
          {% if p | count == 0 %}
            Nessuna azione pendente
          {% else %}
            {% set ns = namespace(t=[]) %}
            {% for e in p[:4] %}
              {% set q = 'Oggi' if e.ritardo == 0 else ('Da 1 giorno' if e.ritardo == 1 else 'Da ' ~ e.ritardo ~ ' giorni') %}
              {% set ns.t = ns.t + [q ~ ' — ' ~ e.titolo] %}
            {% endfor %}
            {% set extra = (p | count) - 4 %}
            {% if extra > 0 %}{% set ns.t = ns.t + ['…e ' ~ ('un’altra azione' if extra == 1 else 'altre ' ~ extra ~ ' azioni')] %}{% endif %}
            {{ ns.t | join('\n') | truncate(250, True) }}
          {% endif %}

  - binary_sensor:
      # ON quando il livello scende sotto il 15% (rischio pompa a secco).
      # delay_on 20min: evita falsi allarmi da una singola lettura disturbata
      # (il livello si legge a pompa spenta; una lettura sporca non basta a scattare).
      # Integrato nelle notifiche home: vedi whitelist in notifiche_home.yaml.
      - name: "Serra Acqua Bassa"
        unique_id: serra_acqua_bassa
        device_class: problem
        icon: mdi:water-alert
        delay_on: "00:20:00"
        state: >
          {% set s = states('sensor.serra_livello_acqua') %}
          {% if is_state('input_boolean.serra_notifica_acqua', 'off') %}
            off
          {% elif s in ['unknown','unavailable','none',''] %}
            off
          {% else %}
            {{ 'on' if (s | float) < (states('input_number.serra_acqua_soglia_pct') | float(15)) else 'off' }}
          {% endif %}

      # ON nei giorni Booster (g37/g58/g66) a coltivazione attiva: alimenta
      # promemoria in dashboard (e in futuro le notifiche home).
      - name: "Serra Booster Oggi"
        unique_id: serra_booster_oggi
        icon: mdi:flask-empty-plus
        state: >
          {% if is_state('input_boolean.serra_coltivazione_attiva','on') %}
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {{ 'on' if (ev | selectattr('tipo','defined') | selectattr('tipo','eq','booster')
                           | selectattr('giorno','eq',d) | list | count) > 0 else 'off' }}
          {% else %}off{% endif %}

      # ON se ci sono azioni del piano pendenti (oggi o in ritardo, non FATTE).
      # Gate per drawer/badge notifiche home: il JS del drawer valuta SOLO
      # condizioni state/numeric_state, quindi serve un binario secco.
      - name: "Serra Azioni Da Fare"
        unique_id: serra_azioni_da_fare
        device_class: problem
        icon: mdi:clipboard-alert
        # AUDIT R2 (NT2-11): ATTRIBUTO, non lo stato auto-referenziale (che
        # e' indietro di un ciclo e passa per 0 nei transitori — P0-3).
        state: "{{ 'on' if ((state_attr('sensor.serra_azioni_pendenti','pendenti')) or []) | count > 0 else 'off' }}"

      # Bridge serra irraggiungibile — gate per il badge/drawer notifiche home
      # (alert tecnico). delay_on 7 min allineato a serra_bridge_offline_alert:
      # un singhiozzo MQTT non deve far lampeggiare il badge.
      - name: "Serra Bridge KO"
        unique_id: serra_bridge_ko
        device_class: problem
        icon: mdi:lan-disconnect
        delay_on: "00:07:00"
        state: "{{ 'on' if is_state('sensor.serra_bridge_online','offline') else 'off' }}"

      # Se ORA le luci dovrebbero essere accese secondo il PURO fotoperiodo
      # impostato (input_datetime on/off), IGNORANDO il master coltivazione.
      # Gestisce il confine mezzanotte: off "00:00" = fine giornata (24:00).
      # SEMANTICA (decisione prototipo 2026-07-12): in UI questo e' il "cosa
      # farebbe lo schedule adesso (se la coltivazione fosse attiva)" — lo stato
      # REALE sta gia' in STATO ATTUALE. Il gating coltivazione vive nei
      # consumer (reconcile/ring hanno le loro condizioni), NON qui.
      - name: "Serra Luci Dovrebbero Essere On"
        unique_id: serra_luci_dovrebbe_on
        icon: mdi:theme-light-dark
        state: >
          {% set on = state_attr('input_datetime.serra_luci_on','timestamp') %}
          {% set off = state_attr('input_datetime.serra_luci_off','timestamp') %}
          {% if on is none or off is none %}
            off
          {% else %}
            {% set on = on | int %}
            {% set off = off | int %}
            {% if off == 0 %}{% set off = 86400 %}{% endif %}
            {# AUDIT R1 (MC-17): ORA DI PARETE, non differenza da mezzanotte —
               il giorno del cambio d'ora dura 23/25h e (now()-midnight) sfasa
               di ±3600s tutti i confronti orari per un giorno intero. #}
            {% set now_s = now().hour * 3600 + now().minute * 60 + now().second %}
            {% if on < off %}
              {{ 'on' if (on <= now_s < off) else 'off' }}
            {% else %}
              {{ 'on' if (now_s >= on or now_s < off) else 'off' }}
            {% endif %}
          {% endif %}

  # ----------------------------
  # SENSOR TEMPLATE "STATICI"
  # ----------------------------
  - sensor:
      - name: "Serra All Fans Computed Level"
        unique_id: serra_all_fans_computed_level
        icon: mdi:fan-auto
        state: >
          {% set f1 = states('input_select.serra_fan_1_level') %}
          {% set f2 = states('input_select.serra_fan_2_level') %}
          {% set ff = states('input_select.serra_fan_f_level') %}
          {% if f1 == f2 == ff %}
            {{ f1 }}
          {% elif f1 == f2 %}
            {{ f1 }}
          {% elif f1 == ff %}
            {{ f1 }}
          {% elif f2 == ff %}
            {{ f2 }}
          {% else %}
            {% set order = {'off': 0, 'low': 1, 'medium': 2, 'high': 3} %}
            {# order.get(...,0): all'avvio un select puo' essere 'unknown';
               l'indicizzazione diretta darebbe Undefined -> | sort in errore ->
               sensore unavailable. I gemelli lato azione usano gia' .get(fN,0). #}
            {% set values = [order.get(f1,0), order.get(f2,0), order.get(ff,0)] | sort %}
            {% set reverse = {0: 'off', 1: 'low', 2: 'medium', 3: 'high'} %}
            {{ reverse[values[1]] }}
          {% endif %}

      # Fans: ultimo update aggregato + chi ha triggerato
      - name: "Serra Fans Last Update"
        unique_id: serra_fans_last_update
        device_class: timestamp
        icon: mdi:clock-outline
        state: >
          {% set t1 = states('sensor.serra_fan_1_last_update') %}
          {% set t2 = states('sensor.serra_fan_2_last_update') %}
          {% set tf = states('sensor.serra_fan_f_last_update') %}
          {% set s1 = as_timestamp(t1) if t1 not in ['unknown','unavailable','none',''] else 0 %}
          {% set s2 = as_timestamp(t2) if t2 not in ['unknown','unavailable','none',''] else 0 %}
          {% set sf = as_timestamp(tf) if tf not in ['unknown','unavailable','none',''] else 0 %}
          {% set mx = [s1,s2,sf] | max %}
          {% if mx > 0 %}
            {{ mx | timestamp_custom('%Y-%m-%dT%H:%M:%S%z') }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          last_item: >
            {% set t1 = states('sensor.serra_fan_1_last_update') %}
            {% set t2 = states('sensor.serra_fan_2_last_update') %}
            {% set tf = states('sensor.serra_fan_f_last_update') %}
            {% set s1 = as_timestamp(t1) if t1 not in ['unknown','unavailable','none',''] else 0 %}
            {% set s2 = as_timestamp(t2) if t2 not in ['unknown','unavailable','none',''] else 0 %}
            {% set sf = as_timestamp(tf) if tf not in ['unknown','unavailable','none',''] else 0 %}
            {% set mx = [s1,s2,sf] | max %}
            {% if mx == s1 and s1 > 0 %}fan_1
            {% elif mx == s2 and s2 > 0 %}fan_2
            {% elif mx == sf and sf > 0 %}fan_f
            {% else %}n/a
            {% endif %}
          last_action: >
            {% set t1 = states('sensor.serra_fan_1_last_update') %}
            {% set t2 = states('sensor.serra_fan_2_last_update') %}
            {% set tf = states('sensor.serra_fan_f_last_update') %}
            {% set s1 = as_timestamp(t1) if t1 not in ['unknown','unavailable','none',''] else 0 %}
            {% set s2 = as_timestamp(t2) if t2 not in ['unknown','unavailable','none',''] else 0 %}
            {% set sf = as_timestamp(tf) if tf not in ['unknown','unavailable','none',''] else 0 %}
            {% set mx = [s1,s2,sf] | max %}
            {% if mx == s1 %}{{ states('sensor.serra_fan_1_last_action') }}
            {% elif mx == s2 %}{{ states('sensor.serra_fan_2_last_action') }}
            {% elif mx == sf %}{{ states('sensor.serra_fan_f_last_action') }}
            {% else %}n/a
            {% endif %}

      # Nutrients: ultimo update aggregato + chi ha triggerato
      - name: "Serra Nutrients Last Update"
        unique_id: serra_nutrients_last_update
        device_class: timestamp
        icon: mdi:clock-outline
        state: >
          {% set t0 = states('sensor.serra_nutrient_0_last_update') %}
          {% set t1 = states('sensor.serra_nutrient_1_last_update') %}
          {% set t2 = states('sensor.serra_nutrient_2_last_update') %}
          {% set s0 = as_timestamp(t0) if t0 not in ['unknown','unavailable','none',''] else 0 %}
          {% set s1 = as_timestamp(t1) if t1 not in ['unknown','unavailable','none',''] else 0 %}
          {% set s2 = as_timestamp(t2) if t2 not in ['unknown','unavailable','none',''] else 0 %}
          {% set mx = [s0,s1,s2] | max %}
          {% if mx > 0 %}
            {{ mx | timestamp_custom('%Y-%m-%dT%H:%M:%S%z') }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          last_item: >
            {% set t0 = states('sensor.serra_nutrient_0_last_update') %}
            {% set t1 = states('sensor.serra_nutrient_1_last_update') %}
            {% set t2 = states('sensor.serra_nutrient_2_last_update') %}
            {% set s0 = as_timestamp(t0) if t0 not in ['unknown','unavailable','none',''] else 0 %}
            {% set s1 = as_timestamp(t1) if t1 not in ['unknown','unavailable','none',''] else 0 %}
            {% set s2 = as_timestamp(t2) if t2 not in ['unknown','unavailable','none',''] else 0 %}
            {% set mx = [s0,s1,s2] | max %}
            {% if mx == s0 and s0 > 0 %}nutrient_0
            {% elif mx == s1 and s1 > 0 %}nutrient_1
            {% elif mx == s2 and s2 > 0 %}nutrient_2
            {% else %}n/a
            {% endif %}
          last_action: >
            {% set t0 = states('sensor.serra_nutrient_0_last_update') %}
            {% set t1 = states('sensor.serra_nutrient_1_last_update') %}
            {% set t2 = states('sensor.serra_nutrient_2_last_update') %}
            {% set s0 = as_timestamp(t0) if t0 not in ['unknown','unavailable','none',''] else 0 %}
            {% set s1 = as_timestamp(t1) if t1 not in ['unknown','unavailable','none',''] else 0 %}
            {% set s2 = as_timestamp(t2) if t2 not in ['unknown','unavailable','none',''] else 0 %}
            {% set mx = [s0,s1,s2] | max %}
            {% if mx == s0 %}{{ states('sensor.serra_nutrient_0_last_action') }}
            {% elif mx == s1 %}{{ states('sensor.serra_nutrient_1_last_action') }}
            {% elif mx == s2 %}{{ states('sensor.serra_nutrient_2_last_action') }}
            {% else %}n/a
            {% endif %}


  # ----------------------------
  # TEMPLATE LIGHTS (modern)
  # ----------------------------
  - light:
      - name: "Serra Luci"
        unique_id: serra_luci
        state: "{{ state_attr('sensor.serra_lights_state', 'on') | default(false, true) | bool }}"
        level: >
          {% set pct = state_attr('sensor.serra_lights_state', 'intensity_pct') | default(0, true) | float(0) %}
          {{ (pct * 2.55) | round(0) | int }}
        turn_on:
          - action: mqtt.publish
            data:
              topic: serra/cmd/ha
              payload: >
                {"cmd": ["lights", "on", "-f", "2"]}
        turn_off:
          - action: mqtt.publish
            data:
              topic: serra/cmd/ha
              payload: >
                {"cmd": ["lights", "off", "-f", "2"]}
        set_level:
          - action: mqtt.publish
            data:
              topic: serra/cmd/ha
              payload: >
                {"cmd": ["lights", "set", "A", "-i", "{{ (brightness / 2.55) | int }}", "-f", "2"]}


      - name: "Serra Led Ring"
        unique_id: serra_led_ring
        state: "{{ states('sensor.serra_ring_state') not in ['off', 'unknown', 'unavailable', ''] }}"
        rgb: >
          {% set raw = state_attr('sensor.serra_ring_state', 'color') | default('FFFFFF', true) %}
          {% set hex = (raw | string | replace('#','') | upper) %}
          {% if hex | length != 6 %}
            {% set hex = 'FFFFFF' %}
          {% endif %}
          ({{ hex[0:2] | int(base=16) }}, {{ hex[2:4] | int(base=16) }}, {{ hex[4:6] | int(base=16) }})
        turn_on:
          - action: mqtt.publish
            data:
              topic: serra/cmd/ha
              payload: >
                {"cmd": ["ring", "on", "-f", "1"]}
        turn_off:
          # -f 0 (secco): il fade firmware verso il nero lascia un bagliore residuo
          - action: mqtt.publish
            data:
              topic: serra/cmd/ha
              payload: >
                {"cmd": ["ring", "off", "-f", "0"]}
        set_rgb:
          - action: mqtt.publish
            data:
              topic: serra/cmd/ha
              payload: >
                {"cmd": ["ring", "on", "-c", "{{ '%02X%02X%02X' % (r, g, b) }}", "-f", "1"]}
