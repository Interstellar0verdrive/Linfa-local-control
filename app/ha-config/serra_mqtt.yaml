# =============================================================================
# INPUT BOOLEAN
# =============================================================================

input_boolean:
  # Allarme acqua bassa ON/OFF: gate del binary_sensor serra_acqua_bassa
  # (quindi silenzia INSIEME riga in panoramica, ring jolly e campanella).
  # Auto-OFF entrando in essiccazione (vasca vuota di proposito -> l'allarme
  # suonerebbe per 3 settimane), auto-ON all'avvio coltivazione
  # (automazione serra_acqua_alert_auto).
  serra_notifica_acqua:
    name: "Serra Notifiche Acqua Bassa"
    icon: mdi:water-alert

  # Toggle SEPARATI dei due digest (Fase 4 app: il design li prevede, il
  # master serra_notifiche_push resta il gate globale del push). NIENTE
  # initial: (si ri-applicherebbe a ogni riavvio); primo valore consigliato
  # ON per entrambi (comportamento identico a prima dell'introduzione).
  # ── Latch DISCORDANZA attesa/realta' (piano avvisi 03/08) ──────────────
  # Alzati dai rilevatori serra_alert_discordanza_* quando un componente in
  # Automatico non segue il programma da oltre 10 minuti; abbassati al
  # rientro. L'app li mostra come banner in Stato; il latch evita anche di
  # ripetere la push a ogni valutazione. NIENTE initial: (sopravvivono al
  # riavvio, l'anomalia pure).
  serra_discordanza_luci:
    name: "Serra Discordanza Luci"
    icon: mdi:lightbulb-alert-outline
  serra_discordanza_acqua:
    name: "Serra Discordanza Acqua"
    icon: mdi:water-alert-outline
  serra_discordanza_ventole:
    name: "Serra Discordanza Ventole"
    icon: mdi:fan-alert

  serra_digest_mattina_attivo:
    name: "Serra Notifiche - Digest mattina"
    icon: mdi:weather-sunset-up

  serra_digest_sera_attivo:
    name: "Serra Notifiche - Digest sera"
    icon: mdi:weather-sunset-down

  # Push facoltativo quando la foto giornaliera e' stata acquisita.
  serra_notifica_foto:
    name: "Serra Notifiche - Foto giornaliera"
    icon: mdi:camera-outline

  # Modalita' NUTRIENTI (04/08, redesign Pianificato/Libero): ON =
  # Pianificato (il piano guida: promemoria sempre, pompe solo se il metodo
  # e' automatico); OFF = Libero (dosaggi pianificati sospesi, EROGA diretti
  # dal pannello; i promemoria del piano restano attivi apposta).
  serra_schedule_nutrienti:
    name: "Serra Schedule Nutrienti"
    icon: mdi:calendar-check

  # METODO di erogazione dentro Pianificato: OFF (default) = manuale
  # (siringa in vasca, scelta del prototipo: pompe ad aria inaffidabili + dose
  # imprecisa col livello capsula); ON = erogazione automatica con le pompe.
  # Gate del ramo erogazione in serra_acqua_cambio_fatto.
  serra_dosatori_auto:
    name: "Serra Dosatori Automatici"
    icon: mdi:water-pump

  # Le correzioni dei due sensori climatici si applicano solo dopo una
  # taratura esplicita. Senza uno stato precedente, il toggle parte spento.
  serra_taratura_clima_attiva:
    name: "Serra Taratura Clima Attiva"
    icon: mdi:tune-check

  # Filtro odori: nelle fasi odorose (fioritura/flush/essiccazione), quando
  # il clima NON chiede ventole, tutte e 3 girano comunque a low a cicli di
  # 30 min si'/30 min no (F1/F2 sono sopra le piante e spingono l'aria nel
  # canale verso la frontale col filtro ai carboni: da sola non basta).
  serra_filtro_odori:
    name: "Serra Filtro Odori"
    icon: mdi:air-filter

  # Foto giornaliera automatica (16:20, automazione serra_foto_giornaliera).
  # Niente "initial": lo stato sopravvive ai riavvii.
  serra_foto_giornaliera:
    name: "Serra Foto Giornaliera"
    icon: mdi:camera-timer

  # Wi-Fi della serra: accendibile/spegnibile da HA, solo se resta disponibile
  # un altro canale di controllo (USB). Nel percorso solo Wi-Fi, spegnerlo
  # interromperebbe la comunicazione con la serra.
  # - Toggle ON  -> automation "Serra: Wi-Fi Toggle" -> script.serra_net_on ("net on")
  #                 -> la serra si aggancia al wifi di casa (ssh root@<IP_SERRA>).
  #                 rcc resta spento: nessuno spam verso il cloud, solo accesso ssh/debug.
  # - Toggle OFF -> script.serra_net_off ("net off") -> interfacce giu + rmmod mt_wifi.
  # Nessun initial: la scelta persiste ai riavvii di HA. È solo lo stato
  # dell'ultimo comando, non una misura della radio. Dopo un reboot della
  # sola serra può non corrispondere allo stato reale.
  serra_wifi:
    name: "Serra Wi-Fi"
    icon: mdi:wifi

  # Interruttore generale dello schedule luci automatico (alba/tramonto a orario).
  # OFF = le automazioni a orario non agiscono (controllo solo manuale dal Banco Luci).
  # NIENTE initial: master toggle impostato dall'utente (auto/manuale) → deve
  # RIPRISTINARE la scelta ai riavvii. Con initial:true, dopo un riavvio tornava
  # ON e il reconcile luci poteva riaccendere il pannello contro la volontà.
  serra_schedule_luci:
    name: "Serra Schedule Luci"
    icon: mdi:calendar-clock

  # Ricircolo acqua automatico (a orari fissi). NIENTE initial: deve RIPRISTINARE
  # l'ultimo stato al riavvio (initial disabiliterebbe il restore e forzerebbe OFF
  # a ogni reboot -> irrigazione in pausa silenziosa a grow attivo, e nessun writer
  # la riaccende). La sicurezza "non muovere acqua non presidiata" e' gia' data dal
  # MASTER serra_coltivazione_attiva; al primo boot assoluto il restore parte OFF.
  serra_schedule_acqua:
    name: "Serra Schedule Acqua"
    icon: mdi:water-sync
  # Ventole automatiche a soglia di umidita' (modello del firmware originale:
  # humidity-driven). ON=Automatico. NIENTE initial: restore dell'ultimo stato al
  # riavvio (vedi nota su serra_schedule_acqua; gated comunque da coltivazione_attiva).
  serra_schedule_ventole:
    name: "Serra Schedule Ventole"
    icon: mdi:fan-auto

  # Abilita/disabilita i singoli orari di ricircolo (slot 1/2/3).
  # NIENTE initial: li scrive la sync serra_fase_auto in base a len(ore) del
  # piano (fioritura/flush = 3 slot ON). Con initial tornavano a [ON,OFF,OFF] a
  # ogni riavvio → in fioritura si saltavano ricircoli fino al riallineo.
  serra_acqua_ora_1_on:
    name: "Serra Acqua - Orario 1 attivo"
    icon: mdi:clock-check
  serra_acqua_ora_2_on:
    name: "Serra Acqua - Orario 2 attivo"
    icon: mdi:clock-check
  serra_acqua_ora_3_on:
    name: "Serra Acqua - Orario 3 attivo"
    icon: mdi:clock-check

  # Coltivazione in corso: attiva il grow-tracker (giorno/fase/milestone) e il
  # prefisso "gN" nel diario. Si attiva alla semina (con data in serra_data_semina).
  # NB: niente "initial" -> lo stato sopravvive ai riavvii di HA.
  serra_coltivazione_attiva:
    name: "Serra Coltivazione Attiva"
    icon: mdi:sprout-outline

  # --- LED RING "semaforo di stato" ------------------------------------------
  # Automatico del ring manager (automazioni serra_ring_manager/serra_ring_attivita
  # + script serra_ring_manager_apply). OFF = il ring resta com'è (controllo manuale).
  serra_ring_auto:
    name: "Serra Ring Automatico"
    icon: mdi:led-strip-variant
    initial: true

  # CONFERME DELLE ÀNCORE (una per fase ancorabile). La DATA della milestone è
  # sempre valorizzata (l'automazione serra_ancore_default_sync la tiene sul
  # DEFAULT finché la conferma è OFF, così il date-picker si apre su una data
  # sensata — mai più la sentinella 2099). La data CONTA solo con la conferma
  # ON: vegetativa/fioritura = "osservata" (override del default), flush/
  # essiccazione = la fase parte SOLO da confermate. Annullare = spegnere
  # l'interruttore (la data torna da sola al previsto). Niente initial:
  # sopravvivono ai riavvii.
  serra_conferma_vegetativa:
    name: "Serra Milestone vegetativa confermata"
    icon: mdi:sprout
  serra_conferma_fioritura:
    name: "Serra Milestone fioritura confermata"
    icon: mdi:flower
  serra_conferma_flush:
    name: "Serra Milestone flush confermata"
    icon: mdi:water-outline
  serra_conferma_essiccazione:
    name: "Serra Milestone essiccazione confermata"
    icon: mdi:content-cut

  # Master delle notifiche push serra (digest azioni del mattino + promemoria
  # booster serale). L'ERRORE PENDENTE notifica SEMPRE, a prescindere da
  # questo toggle (critico: "se non sono davanti alla serra non lo vedo mai").
  serra_notifiche_push:
    name: "Serra Notifiche push"
    icon: mdi:bell-ring-outline
    # Al primo avvio rimane spento; poi ripristina la scelta dell'utente.

  # Latch "booster da somministrare": si accende la mattina del giorno-booster
  # (binary_sensor.serra_booster_oggi -> on) e si spegne SOLO con la conferma
  # manuale (script.serra_booster_dato). Niente initial: sopravvive alla
  # mezzanotte e ai riavvii — se non lo dai oggi, resta acceso domani.
  serra_booster_da_dare:
    name: "Serra Booster da dare"
    icon: mdi:flask-plus-outline

  # Latch "errore pendente": si accende quando un comando serra fallisce
  # (sensor.serra_last_command_ok -> failed). Si spegne se lo STESSO componente
  # poi riesce (serra_errore_autoclear) o manualmente (script.serra_errore_reset).
  # Niente initial: sopravvive ai riavvii.
  serra_errore_pendente:
    name: "Serra Errore Pendente"
    icon: mdi:alert-circle-outline


# =============================================================================
# DIARIO DI COLTIVAZIONE (permanente, file-based)
# =============================================================================
# Ogni azione della serra viene appesa a /config/serra_diario.log (fuori dal
# recorder: sopravvive al purge di 14 giorni, pesa nulla). Righe tipo:
#   2026-07-11 21:30 · g42 · Alba avviata
# Scrittura: script.serra_diario_scrivi (msg) -> shell_command append.
# Lettura: sensor.serra_diario (command_line, ultime 60 righe nell'attributo
# 'log', più recente in alto) -> mostrato nella view Log.

# Le righe vengono PREPESE (piu' recente IN CIMA al file): il diario si legge
# dall'alto anche aprendo il file. Scritture serializzate da script mode:queued.
shell_command:
  # Quote-safe (2026-07-24): la riga viaggia in BASE64 e viene decodificata nel
  # container — nessun apostrofo/quote/carattere strano può rompere il bash -c.
  # (Prima un apostrofo nel testo — es. "dose 'prime foglie'" — troncava la
  # stringa single-quoted e il comando falliva IN SILENZIO: righe perse.)
  # AUDIT R1 (RT-17): printf al posto di echo (una riga che iniziasse con
  # -n/-e verrebbe mangiata dal builtin) e propagazione dell'esito (senza
  # && a catena un fallimento del mv perdeva la riga in silenzio — HA logga
  # i shell_command con exit code != 0).
  serra_diario_append: >-
    /bin/bash -c 'f=/config/serra_diario.log; touch "$f" && r=$(echo "{{ riga | base64_encode }}" | base64 -d) && { printf "%s\n" "$r"; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"'

  # Diario v2 (03/08/2026) — gemello STRUTTURATO di serra_diario_append.
  # L'argomento viaggia in BASE64 (fatta dallo script, patch B): nessun
  # apostrofo/virgoletta/backtick/a-capo nel testo puo' rompere il bash -c.
  # APPEND (>>): O(1), niente riscritture integrali del file.
  serra_diario_append_jsonl: >-
    /bin/bash -c 'f=/config/serra_diario.jsonl; touch "$f" && r=$(echo "{{ b64 }}" | base64 -d) && printf "%s\n" "$r" >> "$f"'

  # Rotazione per-coltura (chiamata da serra_coltivazione_cancella PRIMA
  # della riga di chiusura): archivia .log e .jsonl come serra_diario-AAAAMMGG.*
  # (con ora se l'archivio del giorno esiste gia'); `; :` = exit 0 sempre.
  serra_diario_ruota: >-
    /bin/bash -c 's=/config/serra_diario; t=$(date +%Y%m%d); if [ -e "$s-$t.jsonl" ] || [ -e "$s-$t.log" ]; then t="$t-$(date +%H%M%S)"; fi; for e in jsonl log; do if [ -f "$s.$e" ]; then mv -- "$s.$e" "$s-$t.$e"; fi; done; :'

command_line:
  # Indice dell'archivio foto (/config/www/serra/archivio, riempito da
  # camera.snapshot a ogni nuova foto). L'attributo 'files' (nomi ordinati
  # dalla piu' recente) alimenta il carosello nella sezione FOTO SERRA;
  # l'automazione serra_foto_diario forza l'update dopo ogni snapshot.
  - sensor:
      name: "Serra Foto Archivio"
      unique_id: serra_foto_archivio
      command: >-
        python3 -c "import json,os; d='/config/www/serra/archivio'; fs=sorted([f for f in os.listdir(d) if f.endswith('.jpg')], reverse=True)[:60] if os.path.isdir(d) else []; print(json.dumps({'count': len(fs), 'files': fs}))"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - files
      scan_interval: 900

  - sensor:
      name: "Serra Diario"
      unique_id: serra_diario
      # log = prime 60 righe (finestra del pannello); fatti = mappa
      # {titolo normalizzato -> FATTO|ANNULLATO} — done-state ufficiale,
      # stessa semantica del pannello (FATTO = fatto, ANNULLATO = torna da
      # fare; newest-first: la prima occorrenza vince; apostrofo tipografico
      # normalizzato). AUDIT R1 (P0-1/NT-01/NT-06): la scansione si FERMA alla
      # prima riga "Coltivazione ... AVVIATA" (il diario e' newest-first, cio'
      # che sta sopra = ciclo corrente) cosi' i FATTO di un ciclo NON inquinano
      # il successivo; regex ancorato a "Piano <middledot> (FATTO|ANNULLATO):"
      # per non matchare testo libero. chr(183) = middle-dot, evitiamo unicode
      # letterale nel -c per il locale di Alpine. Consumata da
      # sensor.serra_azioni_pendenti (notifiche v2).
      command: >-
        python3 -c "import json,os,re; p='/config/serra_diario.log'; ls=open(p,encoding='utf-8').read().splitlines() if os.path.exists(p) else []; cut=next((i for i,l in enumerate(ls) if 'Coltivazione' in l and 'AVVIATA' in l), len(ls)); rx=re.compile('Piano '+chr(183)+' (FATTO|ANNULLATO):(.*)'); ms=[(x.group(2).replace(chr(8217),chr(39)).replace(chr(8216),chr(39)).replace(chr(8220),chr(34)).replace(chr(8221),chr(34)).strip(), x.group(1)) for x in (rx.search(l) for l in ls[:cut]) if x]; m={}; [m.setdefault(t,s) for t,s in ms]; print(json.dumps({'log': chr(10).join(ls[:60]), 'count': len(ls[:60]), 'fatti': m}))"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - log
        - fatti
      scan_interval: 300

  # Il PIANO DI COLTIVAZIONE, letto da /config/serra_piano.yaml (documento
  # editabile: fasi + eventi + booster). I sensori del grow-tracker e la
  # timeline in dashboard leggono da qui — il piano NON è cablato nei template.
  - sensor:
      name: "Serra Piano"
      unique_id: serra_piano
      # Il piano è A FASI (durate + eventi 1-based dentro la fase, notazione
      # G/V/F/W/E); il parser emette i giorni assoluti legacy per i template.
      command: "python3 /config/serra_piano_parse.py"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - fasi
        - eventi
        - luci
        - acqua
        - ambiente
        - nutrienti
        - fotoperiodica
      scan_interval: 300


# =============================================================================
# INPUT DATETIME (orari schedule)
# =============================================================================

input_datetime:
  # ═══════════════════════════════════════════════════════════════════════
  # ★★★ IMPOSTAZIONE NOTIFICHE — ORARI DEL DIGEST (mattina/sera) ★★★
  # A questi due orari parte il digest push delle azioni pendenti
  # (automazione serra_digest_azioni; il serale solo se c'e' ancora qualcosa).
  # MODIFICABILI ANCHE DA UI (Impostazioni → Dispositivi e servizi → Helper):
  # il valore impostato da UI PERSISTE ai riavvii (nessun `initial:` qui,
  # apposta — non aggiungerlo, azzererebbe la modifica a ogni riavvio!).
  # Gli orari e le impostazioni di silenzio del telefono restano a carico
  # dell'utente: questo pacchetto non imposta un DND globale.
  # L'URL del tap e' nella sezione input_text (serra_notifica_url).
  # ═══════════════════════════════════════════════════════════════════════
  serra_digest_mattina:
    name: "Serra Digest Mattina"
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-up

  serra_digest_sera:
    name: "Serra Digest Sera"
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-down

  # Orario dell'EROGAZIONE AUTOMATICA della dose "aggiunta" (pompe dosatrici,
  # agisce solo con serra_dosatori_auto ON). Come sopra: modificabile anche
  # da UI, il valore persiste, niente `initial:`.
  serra_dose_ora:
    name: "Serra Dose Automatica Ora"
    has_date: false
    has_time: true
    icon: mdi:water-pump

  # Orario della FOTO GIORNALIERA (audit R1/RT-16: era cablato 16:20).
  serra_foto_ora:
    name: "Serra Foto Giornaliera Ora"
    has_date: false
    has_time: true
    icon: mdi:camera-timer

  # Orario del PROMEMORIA conferme di fase (flush/taglio oltre il previsto;
  # audit R1/RT-16: era cablato 09:05).
  serra_promemoria_ora:
    name: "Serra Promemoria Milestone Ora"
    has_date: false
    has_time: true
    icon: mdi:flag-checkered

  # Timestamp dell'ultimo CAMBIO ACQUA COMPLETO (conferma manuale dal
  # Calendario). Servira' anche per mostrare "acqua vecchia di N giorni".
  serra_acqua_ultimo_cambio:
    name: "Serra Ultimo Cambio Acqua"
    has_date: true
    has_time: true
    icon: mdi:water-sync

  # Data di semina della coltivazione corrente (solo data). Base del grow-tracker.
  serra_data_semina:
    name: "Serra - Data semina"
    icon: mdi:seed
    has_date: true
    has_time: false

  # ÀNCORE DI FASE: data in cui INIZIA davvero la fase, decisa dall'osservazione.
  # Le date sono SEMPRE valorizzate (serra_ancore_default_sync le tiene sul
  # default/previsto finché la conferma è OFF) e CONTANO solo con il relativo
  # input_boolean.serra_conferma_* acceso (modificare la data a mano accende
  # la conferma da sola: serra_ancora_autoconferma).
  # - vegetativa e fioritura: default dal piano + override osservato
  #   (foto: la fioritura È il flip 12/12, senza conferma non parte)
  # - flush ed essiccazione: SOLO a conferma — si resta nella fase precedente
  #   finché non imposti la data; oltre il previsto arriva il promemoria.
  # Gli eventi contano dalla milestone della PROPRIA fase (sensor.serra_fasi_effettive).
  serra_inizio_vegetativa:
    name: "Serra - Inizio vegetativa"
    icon: mdi:sprout
    has_date: true
    has_time: false

  serra_inizio_fioritura:
    name: "Serra - Inizio fioritura"
    icon: mdi:flower
    has_date: true
    has_time: false

  serra_inizio_flush:
    name: "Serra - Inizio flush"
    icon: mdi:water-outline
    has_date: true
    has_time: false

  serra_inizio_essiccazione:
    name: "Serra - Inizio essiccazione (taglio)"
    icon: mdi:content-cut
    has_date: true
    has_time: false

  # Orari accensione/spegnimento luci (fotoperiodo). Solo ora (uguale ogni giorno).
  # Modificabili dai time-picker in dashboard. Default 18/6: ON 06:00 -> OFF 00:00.
  # NIENTE initial su luci_on/off: con initial, a OGNI riavvio HA resettava il
  # fotoperiodo (luci_off forzato a 00:00) → in fioritura 12/12 il reconcile poteva
  # riaccendere il pannello in pieno buio; e l'alba personalizzata dall'utente si
  # perdeva. luci_on = alba scelta dall'utente (restore). luci_off = calcolato da
  # serra_ciclo_applica (restore + ri-derivato all'avvio dal trigger start).
  serra_luci_on:
    name: "Serra Luci - Ora accensione"
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
  serra_luci_off:
    name: "Serra Luci - Ora spegnimento"
    icon: mdi:weather-sunset-down
    has_date: false
    has_time: true

  # Orari di ricircolo (fino a 3 al giorno). Ogni slot ha un enable
  # (input_boolean.serra_acqua_ora_N_on). Li scrive la sync (serra_fase_auto) =
  # alba + ore[] del piano della fase.
  # NIENTE initial: con initial, a OGNI riavvio HA li resettava (es. slot1 -> 09:00)
  # sovrascrivendo il valore del piano (07:00), e la sync non gira all'avvio ->
  # annaffiava all'ora sbagliata fino alle 00:10 (bug 2026-07-14). Senza initial
  # ripristinano l'ultimo valore al riavvio.
  serra_acqua_ora_1:
    name: "Serra Acqua - Orario 1"
    icon: mdi:clock-time-nine
    has_date: false
    has_time: true
  serra_acqua_ora_2:
    name: "Serra Acqua - Orario 2"
    icon: mdi:clock-time-three
    has_date: false
    has_time: true
  serra_acqua_ora_3:
    name: "Serra Acqua - Orario 3"
    icon: mdi:clock-time-nine-outline
    has_date: false
    has_time: true

  # Timestamp dell'ultimo ricircolo acqua (informativo).
  # NIENTE initial: scritto con now() a ogni ricircolo → deve conservare l'ultimo
  # valore reale (con initial tornava alla data fissa a ogni riavvio).
  serra_acqua_ultimo:
    name: "Serra Acqua - Ultimo ricircolo"
    icon: mdi:history
    has_date: true
    has_time: true


# =============================================================================
# SCRIPTS
# =============================================================================

script:
  # Il telefono e' facoltativo. Se non e' configurata un'azione mobile,
  # non invia nulla; gli avvisi persistenti restano gestiti dalle automazioni.
  # Accetta solo azioni dell'app ufficiale Home Assistant Companion.
  serra_push_facoltativa:
    alias: "Serra: Notifica mobile facoltativa"
    mode: parallel
    max: 10
    sequence:
      - variables:
          servizio: "{{ states('input_text.serra_notifica_servizio') | trim }}"
      - condition: template
        value_template: "{{ servizio.startswith('notify.mobile_app_') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ mobile_image | default('') | length > 0 }}"
            sequence:
              - action: "{{ servizio }}"
                data:
                  title: "{{ title | default('Serra') }}"
                  message: "{{ message }}"
                  data:
                    url: "{{ mobile_url | default('') }}"
                    image: "{{ mobile_image }}"
        default:
          - action: "{{ servizio }}"
            data:
              title: "{{ title | default('Serra') }}"
              message: "{{ message }}"
              data:
                url: "{{ mobile_url | default('') }}"

  # ---------------------------------------------------------------------------
  # CAMERA — scatto ad-hoc: il bridge esegue `serra foto` che lancia la
  # pipeline UART in background (profilo LED, scatto, ripristino luci,
  # trasferimento JPEG, publish). L'esito arriva su camera.serra_foto e
  # sensor.serra_foto_ultima; non c'è ack sincrono.
  # ---------------------------------------------------------------------------
  # Conferma "ho cambiato l'acqua" (bottone nei riquadri sessione-acqua del
  # Calendario): timestamp + diario + lettura livello dopo 1 min (vasca
  # appena riempita, pompa ferma = lettura pulita). Conferma + (opz.) dosaggio.
  # La DOSE viene dal PIANO (sensor.serra_dose_nutrienti, per fase+giorno) — vedi
  # nota B1 nel blocco variables sotto — non piu' hard-coded nei bottoni.
  # Se serra_dosatori_auto OFF (default) → solo conferma + il diario ricorda
  # i ml da versare a mano. Se ON → EROGA con le pompe: secondi = ml/L ×
  # litri vasca / cal_ml_s (per-pompa); pompa con cal=0 (guasta/non tarata)
  # → saltata + nota siringa. Bias volutamente BASSO (sotto-dose = sicura).
  serra_acqua_cambio_fatto:
    alias: "Serra: Cambio acqua - conferma"
    icon: mdi:water-check
    mode: single
    fields:
      grow: { description: "ml/L Grow (capsula R)", example: "0.8" }
      micro: { description: "ml/L Micro (capsula G)", example: "1.6" }
      bloom: { description: "ml/L Bloom (capsula B)", example: "2.4" }
      # AUDIT R2: true quando chiama il PANNELLO, che scrive il Piano·FATTO da
      # se' col titolo esatto dell'evento toccato — evita la riga doppia.
      senza_fatto: { description: "salta la scrittura del Piano · FATTO (la fa il chiamante)", example: false }
    sequence:
      - variables:
          # B1 (2026-07-14): la dose viene SEMPRE dal PIANO via
          # sensor.serra_dose_nutrienti, che la calcola per fase + giorno-di-fase
          # usando serra_fasi_effettive (la mappa che INCLUDE i milestone/ancore).
          # Quindi segue i cambi di data (sposti inizio veg/fioritura -> la dose
          # si riallinea) ed e' UNICA FONTE col resto del sistema. I valori
          # grow/micro/bloom eventualmente passati dai bottoni sono IGNORATI (dati
          # morti, da ripulire dai bottoni quando comodo). Fuori coltivazione /
          # fase "solo acqua" il sensore e' unavailable -> dose 0 -> nessuna
          # erogazione, solo conferma del cambio.
          dose_piano: "{{ state_attr('sensor.serra_dose_nutrienti', 'dose') or {} }}"
          g_ml_l: "{{ dose_piano.get('grow_ml_l', 0) | float(0) }}"
          m_ml_l: "{{ dose_piano.get('micro_ml_l', 0) | float(0) }}"
          b_ml_l: "{{ dose_piano.get('bloom_ml_l', 0) | float(0) }}"
          # dose-stantio (#13 + audit): dopo un CAMBIO COMPLETO la vasca e' appena
          # riempita a livello PIENO, ma sensor.serra_acqua_litri resta STANTIO ~1
          # min (il "water level" che lo riallinea parte solo a fine script, sotto).
          # Dosare su quella lettura in ritardo sbaglia il volume -> doso sulla
          # CAPACITA' vasca (helper serra_vasca_litri): un cambio completo = piena.
          litri: >-
            {{ states('input_number.serra_vasca_litri') | float(4.5) }}
          # pompe SOLO in Pianificato (schedule on) col metodo automatico:
          # in Libero i dosaggi pianificati sono sospesi per contratto
          auto: >-
            {{ is_state('input_boolean.serra_dosatori_auto', 'on')
               and is_state('input_boolean.serra_schedule_nutrienti', 'on') }}
          # AUDIT R2 (RT2-04): la conferma del cambio DEVE chiudere anche
          # l'evento del piano (modo: cambio) nel done-state — prima scriveva
          # solo la riga "Acqua · ..." e il digest continuava a chiedere il
          # CAMBIO gia' fatto. Si risolve l'evento cambio PIU' RECENTE non
          # ancora FATTO con giorno <= oggi (copre anche il caso in ritardo:
          # evento a g15 confermato a g17).
          titolo_cambio: >-
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set fatti = state_attr('sensor.serra_diario','fatti') %}
            {# AUDIT R3 (RT3-07): fail-CLOSED come il resto del done-state —
               diario giu' = niente FATTO automatico (meglio non scrivere che
               scrivere un doppione su un evento gia' chiuso). #}
            {% set eo = (state_attr('sensor.serra_eventi_effettivi','eventi') or []) if fatti is mapping else [] %}
            {% set fatti = fatti if fatti is mapping else {} %}
            {% set pe = state_attr('sensor.serra_piano','eventi') or [] %}
            {% set ns = namespace(t='', g=-1) %}
            {# AUDIT R3 (MC3-02): finestra ± e niente BOOSTER — i bottoni
               dashboard sono conferme generiche senza senza_fatto: senza
               questi due filtri un cambio d'acqua a g70 marcava FATTO
               "Cambio acqua + Booster 3" (g66) con la boccetta mai versata.
               Max 2 giorni di ritardo (il caso legittimo "confermo il cambio
               di ieri/l'altro ieri"); i booster si chiudono SOLO dal
               pannello (titolo esatto) o con la conferma booster dedicata. #}
            {% for p in pe if p.get('dose', {}).get('modo') == 'cambio' %}
              {% for e in eo if e.titolo == p.titolo and e.get('tipo','') != 'booster'
                    and (e.giorno | int) <= d and (d - (e.giorno | int)) <= 2 and (e.giorno | int) > ns.g %}
                {% if fatti.get(e.titolo | replace('’',"'") | replace('‘',"'") | replace('“','"') | replace('”','"') | trim) != 'FATTO' %}
                  {% set ns.t = e.titolo %}{% set ns.g = e.giorno | int %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.t }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.serra_acqua_ultimo_cambio
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: script.serra_diario_scrivi
        data:
          msg: "Acqua · CAMBIO COMPLETO confermato (50/50 rubinetto+demi)"
          origine: manuale
      # AUDIT R2 (RT2-04): chiusura dell'evento del piano (fire-and-forget)
      - if: "{{ titolo_cambio | length > 0 and not (senza_fatto | default(false) | bool(false)) }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.serra_diario_scrivi
            data:
              variables:
                msg: "Piano · FATTO: {{ titolo_cambio }}"
                origine: manuale
      # --- DOSAGGIO ---
      - choose:
          # A) DOSATORI AUTO: eroga le pompe (salta dose 0 e cal 0)
          - conditions: "{{ auto and (g_ml_l + m_ml_l + b_ml_l) > 0 }}"
            sequence:
              - repeat:
                  for_each:
                    - { pid: "2", nome: "Grow (R)", ml_l_key: "g" }
                    - { pid: "1", nome: "Micro (G)", ml_l_key: "m" }
                    - { pid: "0", nome: "Bloom (B)", ml_l_key: "b" }
                  sequence:
                    - variables:
                        ml_l: "{{ {'g': g_ml_l, 'm': m_ml_l, 'b': b_ml_l}[repeat.item.ml_l_key] }}"
                        cal: "{{ states('input_number.serra_cal_pompa_' ~ repeat.item.pid ~ '_ml_s') | float(0) }}"
                        ml: "{{ (ml_l | float(0)) * litri }}"
                        sec: "{{ (ml / cal) | round(1) if cal > 0 else 0 }}"
                    - choose:
                        # pompa ok e dose > 0 → eroga
                        - conditions: "{{ ml > 0.05 and cal > 0 and sec > 0 }}"
                          sequence:
                            - action: mqtt.publish
                              data:
                                topic: "serra/cmd/ha"
                                payload: "pump nutrient {{ repeat.item.pid }} -s {{ sec }} -t 1 -i 1"
                            - delay: "{{ (sec + 3) | int }}"
                            - action: script.serra_diario_scrivi
                              data:
                                msg: "Nutrienti · {{ repeat.item.nome }} {{ ml | round(1) }}ml erogati ({{ sec }}s, dosatore)"
                        # dose > 0 ma pompa non tarata/guasta → siringa
                        - conditions: "{{ ml > 0.05 and cal <= 0 }}"
                          sequence:
                            - action: script.serra_diario_scrivi
                              data:
                                msg: "Nutrienti · {{ repeat.item.nome }} {{ ml | round(1) }}ml A SIRINGA (pompa non disponibile)"
              # NB (2026-07-14, requisito del prototipo): NIENTE ricircolo qui. Il
              # cambio dosa e basta; la pompa principale gira SOLO agli orari
              # schedulati (serra_acqua_orari) con le durate previste. Es.: cambio
              # alle 5 → i nutrienti restano in vasca e vengono fatti circolare
              # dal primo ricircolo utile (es. le 7), non subito.
          # B) MANUALE: promemoria dei ml da versare a mano
          - conditions: "{{ (g_ml_l + m_ml_l + b_ml_l) > 0 }}"
            sequence:
              - action: script.serra_diario_scrivi
                data:
                  msg: >-
                    Nutrienti · da versare a mano: {{ 'R ' ~ (g_ml_l * litri) | round(1) ~ 'ml · ' if g_ml_l > 0 else '' }}{{ 'G ' ~ (m_ml_l * litri) | round(1) ~ 'ml · ' if m_ml_l > 0 else '' }}{{ 'B ' ~ (b_ml_l * litri) | round(1) ~ 'ml' if b_ml_l > 0 else '' }}
      - delay:
          minutes: 1
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "water level"

  # AGGIUNTA nutrienti col DOSATORE (senza cambio acqua): eroga l'INCREMENTO del
  # piano con le pompe (secondi = ml/L × litri vasca / cal per pompa; pompa non
  # tarata → saltata + nota siringa). Chiamato dall'automazione serra_nutrient_
  # aggiunta_auto nei giorni di sola aggiunta, SOLO se serra_dosatori_auto ON.
  # Dosa nella vasca ESISTENTE → litri = livello reale (fallback capacità vasca).
  serra_nutrient_aggiunta_applica:
    alias: "Serra: Nutrienti - eroga aggiunta (pompe)"
    icon: mdi:beaker-plus-outline
    mode: single
    fields:
      grow:  { description: "ml/L Grow (R) da aggiungere",  example: "0.5" }
      micro: { description: "ml/L Micro (G) da aggiungere", example: "0.5" }
      bloom: { description: "ml/L Bloom (B) da aggiungere", example: "0.5" }
    sequence:
      - variables:
          g_ml_l: "{{ grow | float(0) }}"
          m_ml_l: "{{ micro | float(0) }}"
          b_ml_l: "{{ bloom | float(0) }}"
          litri: >-
            {% set l = states('sensor.serra_acqua_litri') | float(0) %}
            {{ l if l > 0 else states('input_number.serra_vasca_litri') | float(4.5) }}
      - action: script.serra_diario_scrivi
        data:
          msg: "Acqua · aggiunta nutrienti AUTO (dosatori, senza cambio)"
      - repeat:
          for_each:
            - { pid: "2", nome: "Grow (R)",  key: "g" }
            - { pid: "1", nome: "Micro (G)", key: "m" }
            - { pid: "0", nome: "Bloom (B)", key: "b" }
          sequence:
            - variables:
                ml_l: "{{ {'g': g_ml_l, 'm': m_ml_l, 'b': b_ml_l}[repeat.item.key] }}"
                cal: "{{ states('input_number.serra_cal_pompa_' ~ repeat.item.pid ~ '_ml_s') | float(0) }}"
                ml: "{{ (ml_l | float(0)) * litri }}"
                sec: "{{ (ml / cal) | round(1) if cal > 0 else 0 }}"
            - choose:
                # pompa ok e dose > 0 → eroga
                - conditions: "{{ ml > 0.05 and cal > 0 and sec > 0 }}"
                  sequence:
                    - action: mqtt.publish
                      data:
                        topic: "serra/cmd/ha"
                        payload: "pump nutrient {{ repeat.item.pid }} -s {{ sec }} -t 1 -i 1"
                    - delay: "{{ (sec + 3) | int }}"
                    - action: script.serra_diario_scrivi
                      data:
                        msg: "Nutrienti · {{ repeat.item.nome }} {{ ml | round(1) }}ml erogati ({{ sec }}s, dosatore, aggiunta)"
                # dose > 0 ma pompa non tarata/guasta → siringa
                - conditions: "{{ ml > 0.05 and cal <= 0 }}"
                  sequence:
                    - action: script.serra_diario_scrivi
                      data:
                        msg: "Nutrienti · {{ repeat.item.nome }} {{ ml | round(1) }}ml A SIRINGA (pompa non disponibile)"

  serra_foto_scatta:
    alias: "Serra: Scatta foto"
    icon: mdi:camera
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "foto"

  # ---------------------------------------------------------------------------
  # UTILITY
  # ---------------------------------------------------------------------------
  # Banco Luci: azzera tutti gli slider canale e applica subito (applica_mix)
  # spegne ogni canale sulla serra.
  serra_luci_lab_off:
    alias: "Serra: Light Lab - Spegni tutto"
    icon: mdi:lightbulb-off
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.serra_luce_ch_a
            - input_number.serra_luce_ch_g
            - input_number.serra_luce_ch_b
            - input_number.serra_luce_ch_r
            - input_number.serra_luce_ch_d
        data:
          value: 0
      - action: script.serra_luce_applica_mix

  # Applica il mix LUCI di una fase, leggendo dal PIANO (/config/serra_piano.yaml
  # via sensor.serra_piano). Setta i 5 slider; la sync li applica come mix atomico.
  # Le ricette NON si modificano da UI: si editano nel piano (scelta 2026-07-12).
  # Sostituisce i vecchi carica_crescita/carica_fioritura + salva_* (rimossi).
  serra_luce_applica_fase:
    alias: "Serra: Applica mix luci della fase"
    icon: mdi:palette
    mode: single
    fields:
      fase:
        description: "Fase (default: input_select.serra_fase_luci)"
        example: "vegetativa"
    sequence:
      - variables:
          f: "{{ (fase | default(states('input_select.serra_fase_luci'), true)) | lower }}"
          mix: "{{ (state_attr('sensor.serra_piano','luci') or {}).get(f, [0,0,0,0,0]) }}"
          # GUARDIA ANTI-LAMPEGGIO (2026-07-13, visto durante le prove alle 13:39):
          # ripubblicare lo STESSO mix fa sfarfallare il pannello. Si pubblica
          # solo se lo stato luci riportato differisce dalla ricetta; il
          # riallineamento post-riavvio serra passa dal reconcile (boot
          # detection), che non usa questo script.
          ch: "{{ state_attr('sensor.serra_lights_state','channels') or {} }}"
          gia_cosi: >-
            {{ ch.get('D', -1) | int(-1) == mix[0] | int(0)
               and ch.get('R', -1) | int(-1) == mix[1] | int(0)
               and ch.get('B', -1) | int(-1) == mix[2] | int(0)
               and ch.get('G', -1) | int(-1) == mix[3] | int(0)
               and ch.get('A', -1) | int(-1) == mix[4] | int(0) }}
      # M4: se il piano non ha una ricetta luci per questa fase (sensor.serra_piano
      # unavailable/unknown per un refuso o giorni:0, o fase assente), 'luci'.get(f)
      # e' None e 'mix' cade sul default [0,0,0,0,0] = PANNELLO SPENTO. NON applichiamo
      # nulla: le luci restano com'erano (fase_auto e' comunque in pausa, e la notifica
      # 'piano illeggibile' avvisa). Prima: buio in fioritura al primo trigger.
      - if:
          - condition: template
            value_template: "{{ (state_attr('sensor.serra_piano','luci') or {}).get(f) is none }}"
        then:
          - stop: "piano luci illeggibile per la fase: non tocco le luci"
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_d}
        data: {value: "{{ mix[0] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_r}
        data: {value: "{{ mix[1] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_b}
        data: {value: "{{ mix[2] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_g}
        data: {value: "{{ mix[3] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_a}
        data: {value: "{{ mix[4] | int(0) }}"}
      - if:
          - condition: template
            value_template: "{{ not gia_cosi }}"
        then:
          - action: script.serra_luce_applica_mix
          # AUDIT R3 (R3-1): la riga di diario la scrive lo script, e SOLO in
          # questo ramo — il logger eventi ora ignora l'applica_mix incatenato
          # (parent_id), e un trigger sullo script intero loggherebbe anche i
          # no-op fermati dalla guardia anti-lampeggio qui sopra.
          - action: script.serra_diario_scrivi
            data:
              # AUDIT R4 (M-R4-2): coi canali interpolati — a settimane di
              # distanza "preset vegetativa" da solo non dice cosa e' uscito.
              msg: "Luci · preset {{ f }} applicato (D {{ mix[0] | int(0) }} · R {{ mix[1] | int(0) }} · B {{ mix[2] | int(0) }} · G {{ mix[3] | int(0) }} · A {{ mix[4] | int(0) }})"

  # Pubblica il mix ATOMICO leggendo i 5 slider correnti. E' l'UNICO punto che
  # manda "lights mix" senza fade: gli slider sono staging, il comando parte
  # solo da qui (CTA "Applica colore" in dashboard) o dagli script che lo
  # chiamano (applica_fase, verde, bianco, spegni). La vecchia automazione di
  # sync live (debounce sugli slider) e' stata RIMOSSA (scelta del prototipo
  # 2026-07-12: modello esplicito, coerente col LED Ring).
  serra_luce_applica_mix:
    alias: "Serra: Applica colore (mix dai canali)"
    icon: mdi:check-circle
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: >-
            lights mix
            -a {{ states('input_number.serra_luce_ch_a') | int(0) }}
            -g {{ states('input_number.serra_luce_ch_g') | int(0) }}
            -b {{ states('input_number.serra_luce_ch_b') | int(0) }}
            -r {{ states('input_number.serra_luce_ch_r') | int(0) }}
            -d {{ states('input_number.serra_luce_ch_d') | int(0) }}
            -f {{ states('input_number.serra_lights_fade') | int(0) }}

  # Applica il CICLO LUCE: il TRAMONTO è CALCOLATO = alba + ore di luce del
  # ciclo (18/6 -> +18h, 20/4 -> +20h, 12/12 -> +12h). L'ALBA la imposta
  # l'utente (input_datetime.serra_luci_on) e qui NON viene toccata.
  # Decisione del prototipo 2026-07-12: mai impostare il tramonto a mano.
  serra_ciclo_applica:
    alias: "Serra: Applica ciclo luce"
    icon: mdi:theme-light-dark
    mode: single
    sequence:
      - variables:
          ore_luce: >-
            {{ states('input_select.serra_ciclo_luce').split('/')[0] | int(18) }}
          alba_s: "{{ state_attr('input_datetime.serra_luci_on','timestamp') | int(21600) }}"
          spegni: >-
            {% set t = (alba_s + ore_luce * 3600) % 86400 %}
            {{ '%02d:%02d:00' | format(t // 3600, (t % 3600) // 60) }}
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.serra_luci_off}
        data: {time: "{{ spegni }}"}

  # Imposta la semina a OGGI (LEGACY: nessun bottone in dashboard; la data
  # si imposta dal picker in Panoramica).
  serra_semina_oggi:
    alias: "Serra: Semina oggi"
    icon: mdi:seed
    mode: single
    sequence:
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.serra_data_semina}
        data: {date: "{{ now().strftime('%Y-%m-%d') }}"}
      - action: script.serra_diario_scrivi
        data:
          msg: "Coltivazione · data semina impostata a oggi"
          origine: manuale

  # NB modello milestone: le fasi si confermano/spostano CAMBIANDO LA DATA
  # della milestone nel Calendario (2099-12-31 = non impostata/annulla). Diario e
  # chiusura promemoria sono gestiti dall'automazione serra_ancora_diario,
  # qualunque sia la via con cui la data cambia. (Le vecchie CTA "Inizia
  # flush"/"Ho tagliato" e i relativi script sono stati RIMOSSI: una leva sola.)

  serra_luce_preset_verde:
    alias: "Serra: Preset Verde (servizio)"
    icon: mdi:leaf
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_luce_ch_g
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: [input_number.serra_luce_ch_d, input_number.serra_luce_ch_r,
                      input_number.serra_luce_ch_b, input_number.serra_luce_ch_a]
        data:
          value: 0
      - action: script.serra_luce_applica_mix

  serra_luce_preset_bianco:
    alias: "Serra: Preset Bianco (foto)"
    icon: mdi:white-balance-sunny
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_luce_ch_a
        data:
          value: 100
      - action: input_number.set_value
        target:
          entity_id: [input_number.serra_luce_ch_d, input_number.serra_luce_ch_r,
                      input_number.serra_luce_ch_b, input_number.serra_luce_ch_g]
        data:
          value: 0
      - action: script.serra_luce_applica_mix

  # ALBA: rampa 0 -> mix della FASE CORRENTE (dal PIANO) in N minuti.
  # Sospende la sync (per non sovrascrivere la rampa), allinea gli slider al
  # target, manda "lights mix ... -f <sec>", riattiva.
  serra_luce_alba:
    alias: "Serra: Alba (fade-in, preset fase)"
    icon: mdi:weather-sunset-up
    mode: single
    sequence:
      - variables:
          p: "{{ (state_attr('sensor.serra_piano','luci') or {}).get(states('input_select.serra_fase_luci') | lower, [0,0,0,0,0]) }}"
          sec: "{{ (states('input_number.serra_luce_fade_min') | float(10) * 60) | int }}"
      # M4: se il piano non ha la ricetta luci per la fase corrente -> NON azzerare
      # il pannello alla cieca (vedi nota in serra_luce_applica_fase).
      - if:
          - condition: template
            value_template: "{{ (state_attr('sensor.serra_piano','luci') or {}).get(states('input_select.serra_fase_luci') | lower) is none }}"
        then:
          - stop: "piano luci illeggibile: non tocco le luci (alba)"
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_d}
        data: {value: "{{ p[0] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_r}
        data: {value: "{{ p[1] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_b}
        data: {value: "{{ p[2] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_g}
        data: {value: "{{ p[3] | int(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.serra_luce_ch_a}
        data: {value: "{{ p[4] | int(0) }}"}
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: >-
            lights mix -d {{ p[0]|int(0) }} -r {{ p[1]|int(0) }} -b {{ p[2]|int(0) }}
            -g {{ p[3]|int(0) }} -a {{ p[4]|int(0) }} -f {{ sec }}

  # TRAMONTO: rampa tutto -> 0 in N minuti (fade nativo). Stesso schema.
  serra_luce_tramonto:
    alias: "Serra: Tramonto (fade-out)"
    icon: mdi:weather-sunset-down
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: [input_number.serra_luce_ch_a, input_number.serra_luce_ch_g,
                      input_number.serra_luce_ch_b, input_number.serra_luce_ch_r,
                      input_number.serra_luce_ch_d]
        data:
          value: 0
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: >-
            lights mix -f {{ (states('input_number.serra_luce_fade_min') | float(10) * 60) | int }}

  # Riallinea il selettore GLOBALE ventole al valore calcolato dai 3 singoli
  # (unanimita'/maggioranza, altrimenti mediano). Chiamato dalle automazioni
  # delle singole ventole: se il valore non cambia e' un no-op (nessun evento).
  serra_fans_sync_global:
    alias: "Serra: Fans - Sync selettore globale"
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.serra_all_fans_level
        data:
          # FONTE UNICA: il livello aggregato (unanimita'/maggioranza/mediano) e'
          # calcolato SOLO da sensor.serra_all_fans_computed_level. Qui (e nell'
          # anti-loop di serra_fan_all_level_changed) lo si LEGGE, non si ricalcola:
          # cambiando il tie-break nel sensore, produttore e anti-loop restano
          # allineati (prima erano 3 copie della stessa formula = rischio drift).
          # Timing OK: questo script gira DOPO che il selettore singolo e'
          # cambiato (trigger di fan_N_level_changed) -> il sensore ha gia'
          # ricalcolato con il nuovo valore.
          option: "{{ states('sensor.serra_all_fans_computed_level') }}"

  # Appende una riga al diario di coltivazione (msg passato come variabile).
  # Prefissa timestamp e, se la coltivazione è attiva, il giorno di ciclo (gN).
  # Poi forza il refresh del sensore che mostra il diario in dashboard.
  # CANCELLA COLTIVAZIONE (Fase 4 app, design r.544): chiude la coltura e
  # azzera lo STATO del ciclo. Il diario NON si tocca: resta come archivio
  # (dal design "azzera piano e diario" si e' scelto il conservativo — la
  # rotazione per-coltura arrivera' col diario strutturato v2).
  # Le ancore si risincronizzano da sole: ancore_default_sync scatta sulle
  # conferme che tornano off. La UI arma la chiamata con doppio tocco.
  serra_coltivazione_cancella:
    alias: "Serra: Coltivazione - Cancella (reset stato ciclo)"
    icon: mdi:delete-forever-outline
    mode: single
    sequence:
      # Diario v2: PRIMA si archivia il diario della coltura che si chiude
      # (serra_diario-AAAAMMGG.*), poi la riga di chiusura — che apre il
      # diario NUOVO. Effetto voluto: anche `fatti` riparte pulito.
      - action: shell_command.serra_diario_ruota
      - action: script.serra_diario_scrivi
        data:
          msg: "Coltivazione · CANCELLATA (reset di conferme e stato ciclo)"
          origine: manuale
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.serra_conferma_vegetativa
            - input_boolean.serra_conferma_fioritura
            - input_boolean.serra_conferma_flush
            - input_boolean.serra_conferma_essiccazione
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.serra_coltivazione_attiva

  # DIARIO v2 (03/08/2026) — DUAL WRITE: riga leggibile IDENTICA a prima +
  # riga JSONL {ts,g,comp,testo,tipo,origine} per l'app. `tipo`/`origine`
  # facoltativi: origine default auto; tipo derivato QUI col classificatore
  # validato sulle 901 righe reali (un call-site nuovo e' coperto da solo).
  serra_diario_scrivi:
    alias: "Serra: Diario - Scrivi"
    icon: mdi:notebook-edit
    mode: queued
    # AUDIT R1 (I-10): 10 era poco — una raffica (avvio HA, reconcile) satura
    # la coda e HA SCARTA le run in eccesso: righe perse in silenzio.
    max: 30
    fields:
      msg:
        description: "Testo della riga di diario"
        example: "Alba avviata"
      tipo:
        description: "evidenza | routine — se assente lo deriva dal messaggio"
        example: "evidenza"
      origine:
        description: "auto | manuale — se assente vale auto"
        example: "manuale"
    variables:
      # AUDIT R1 (M-16): UN SOLO istante per entrambe le righe. I due step non
      # devono rendere now() per conto proprio: una riga a cavallo del minuto
      # avrebbe minuti diversi nei due file e, se fosse la prima strutturata,
      # il taglio legacy di api/diario la farebbe passare due volte.
      ts_iso: "{{ now().isoformat(timespec='seconds') }}"
      ts_min: "{{ ts_iso[:16] | replace('T', ' ') }}"
    sequence:
      # 1) riga strutturata PRIMA (AUDIT R1, C-3): il JSONL e' la sorgente di
      #    verita' dell'app ed e' un append >> atomico; il .log (step 2) viene
      #    riscritto per intero a ogni riga ed e' lo step piu' fragile, e HA
      #    NON interrompe la sequence su shell_command falliti. Con questo
      #    ordine un fallimento a meta' lascia il buco nel file che l'app non
      #    legge — con l'ordine inverso la riga finiva solo nel .log, PIU'
      #    recente del taglio legacy: invisibile nell'app per sempre.
      #    La base64 non e' ornamentale: i data: dei service call renderizzano
      #    con parse_result=True e una stringa JSON pura VERREBBE convertita in
      #    dict Python (repr con apici singoli = JSON invalido, senza errori).
      - action: shell_command.serra_diario_append_jsonl
        data:
          b64: >-
            {%- set attiva = is_state('input_boolean.serra_coltivazione_attiva','on') -%}
            {%- set gs = states('sensor.serra_giorno_ciclo') -%}
            {%- set g = (gs | int(0)) if (attiva and is_number(gs)) else none -%}
            {%- set m = msg | string -%}
            {%- set parti = m.split(' · ', 1) -%}
            {%- set comp = parti[0] if parti | count > 1 else '' -%}
            {%- set testo = parti[1] if parti | count > 1 else m -%}
            {%- set c = comp | lower -%}
            {%- set notevole = 'modalit|allarme|sicurezza|failsafe|non disponibil|recuperato|a siringa|a mano|booster|cambio completo|^ciclo ' -%}
            {%- set t = tipo | default('', true) -%}
            {%- set t = t if t in ['evidenza','routine'] else (
                  'evidenza' if c in ['sistema','piano','coltivazione']
                  else ('evidenza' if (c in ['acqua','luci','ventole','nutrienti']
                                       and testo is search(notevole, ignorecase=True))
                        else 'routine')) -%}
            {{- {'ts': ts_iso,
                 'g': g,
                 'comp': comp,
                 'testo': testo,
                 'tipo': t,
                 'origine': origine | default('auto', true)} | to_json | base64_encode -}}
      # 2) riga leggibile — formato INVARIATO
      - action: shell_command.serra_diario_append
        data:
          riga: >-
            {{ ts_min }}{% if is_state('input_boolean.serra_coltivazione_attiva','on') and is_number(states('sensor.serra_giorno_ciclo')) %} · g{{ states('sensor.serra_giorno_ciclo') }}{% endif %} · {{ msg }}
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.serra_diario

  serra_state_sync:
    alias: "Serra: State Sync"
    icon: mdi:sync
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "state sync"

  serra_fan_set:
    alias: "Serra: Fan Set"
    icon: mdi:fan-speed-1
    mode: single
    fields:
      target:
        description: "Fan target (1/2/F/all)"
        example: "1"
      level:
        description: "Level (off/low/medium/high)"
        example: "medium"
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "fans set {{ target | default('all') }} -i {{ level | default('medium') }}"

  serra_ring_off:
    alias: "Serra: Ring OFF"
    icon: mdi:led-strip-variant-off
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          # -f 0 esplicito: mai spegnere il ring con fade (bagliore residuo)
          payload: "ring off -f 0"

  serra_ring_blink:
    alias: "Serra: Ring Blink"
    icon: mdi:led-strip-variant
    mode: single
    fields:
      color:
        description: "Color name or HEX"
        example: "red"
      times:
        description: "Number of blinks"
        example: "5"
      fade:
        description: "Fade in/out seconds"
        example: "1"
      duration:
        description: "ON duration seconds"
        example: "1"
      interval:
        description: "OFF interval seconds"
        example: "1"
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "ring blink -c {{ color | default('white') }} -t {{ times | default(5) | int }} -f {{ fade | default(0) | int }} -d {{ duration | default(1) | int }} -i {{ interval | default(1) | int }}"

  serra_ring_apply:
    alias: "Serra: Ring Apply from Inputs"
    icon: mdi:led-strip-variant
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "ring on -c {{ {'Bianco':'white','Rosso':'red','Verde':'green','Giallo':'yellow','Arancione':'orange','Blu':'blue','Viola':'purple'}.get(states('input_select.serra_ring_color'), 'white') }} -f {{ states('input_number.serra_ring_fade') | int }}"

  serra_ring_blink_apply:
    alias: "Serra: Ring Blink from Inputs"
    icon: mdi:led-strip-variant
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "ring blink -c {{ {'Bianco':'white','Rosso':'red','Verde':'green','Giallo':'yellow','Arancione':'orange','Blu':'blue','Viola':'purple'}.get(states('input_select.serra_ring_color'), 'white') }} -t {{ states('input_number.serra_ring_blink_times') | int }} -f {{ states('input_number.serra_ring_fade') | int }} -d {{ states('input_number.serra_ring_blink_duration') | int }} -i {{ states('input_number.serra_ring_blink_interval') | int }}"

  # --- RING MANAGER (semaforo di stato) --------------------------------------
  # Ricalcola e applica il colore del ring in base alle priorità:
  #   rosso (errore pendente) > viola (serve intervento: acqua bassa / booster)
  #   > blu (acqua in movimento) > spento (nessuna coltivazione)
  #   > bianco pieno (giorno) > bianco dimmed (notte).
  # NB il blink d'ingresso dell'attività lo fa serra_ring_attivita (automazione):
  # qui solo stati FISSI (il blink del controller tiene la UART per tutta la
  # durata -> mai blink lunghi da qui).
  serra_ring_manager_apply:
    alias: "Serra: Ring Manager - applica stato"
    icon: mdi:traffic-light
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.serra_ring_auto
        state: "on"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.serra_errore_pendente
                state: "on"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: "ring on -c red -f 1"
          - conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: binary_sensor.serra_acqua_bassa
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.serra_booster_da_dare
                    state: "on"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: "ring on -c purple -f 1"
          - conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: sensor.serra_pump_main_running_now
                    state: "on"
                  - condition: state
                    entity_id: sensor.serra_nutrient_0_running_now
                    state: "on"
                  - condition: state
                    entity_id: sensor.serra_nutrient_1_running_now
                    state: "on"
                  - condition: state
                    entity_id: sensor.serra_nutrient_2_running_now
                    state: "on"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: "ring on -c blue -f 0"
          - conditions:
              - condition: state
                entity_id: input_boolean.serra_coltivazione_attiva
                state: "off"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  # -f 0 (secco): il fade del firmware verso il nero non arriva
                  # a zero e lascia un bagliore residuo (PWM ~1/255)
                  payload: "ring off -f 0"
          # ESSICCAZIONE: le piante seccano al BUIO, ma lo schedule luci tiene la
          # finestra "giorno" attiva (il pannello e' a mix zero, gli orari no) ->
          # senza questo ramo il ring andrebbe BIANCO di giorno, come se le luci
          # fossero accese. In essiccazione lo teniamo sul DIM fisso (come la notte)
          # 24/7: coerente col buio, niente falso "giorno". Errore(rosso) e
          # pompe(blu) restano sopra e vincono comunque. (Scelta del prototipo 2026-07-15.)
          # AUDIT R3 (MC3-07): anche 'conclusa' — a coltura chiusa fase_auto
          # non riscrive piu' gli orari, la finestra "giorno" resta armata e
          # senza questo il ring tornava BIANCO su una serra spenta.
          - conditions:
              - condition: state
                entity_id: sensor.serra_fase
                state:
                  - "essiccazione"
                  - "conclusa"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: "ring on -c 303030 -f 1"
          - conditions:
              - condition: state
                entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
                state: "on"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "serra/cmd/ha"
                  payload: "ring on -c white -f 1"
        default:
          # notte (coltivazione attiva, luci spente): bianco dimmed via HEX
          - action: mqtt.publish
            data:
              topic: "serra/cmd/ha"
              payload: "ring on -c 303030 -f 1"

  # Conferma manuale "ho dato il booster": spegne il latch e registra nel diario.
  serra_booster_dato:
    alias: "Serra: Booster somministrato (conferma)"
    icon: mdi:flask-plus
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.serra_booster_da_dare
      # B-f/M7: registra il giorno-di-ciclo del booster dato -> impedisce il
      # re-arm dello STESSO giorno (riavvio/flap) ma consente i booster futuri.
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_booster_dato_giorno
        data:
          value: "{{ states('sensor.serra_giorno_ciclo') | int(-1) }}"
      - action: script.serra_diario_scrivi
        data:
          msg: "Nutrienti · Booster somministrato (conferma manuale)"
          origine: manuale

  # Reset manuale del latch errore (dopo aver controllato di persona).
  serra_errore_reset:
    alias: "Serra: Errore - reset manuale"
    icon: mdi:alert-circle-check
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.serra_errore_pendente
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_errore_componente
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_errore_dettaglio
        data:
          value: ""
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · errore resettato manualmente"
          origine: manuale
  # ---------------------------------------------------------------------------
  # PUMP MAIN
  # ---------------------------------------------------------------------------
  serra_pump_main_on:
    alias: "Serra: Pump Main ON"
    icon: mdi:pump
    mode: single
    fields:
      seconds:
        description: "Duration in seconds"
        example: "3"
    sequence:
      # La durata si salva PRIMA del publish: cosi' il logger del diario, che
      # scatta sull'avvio dello script, la trova gia' scritta.
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_acqua_ultimo_ricircolo_s
        data:
          value: "{{ seconds | default(3) | int }}"
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "pump main on -s {{ seconds | default(3) | int }}"
      # Anche il ricircolo manuale MARCA l'ultimo ricircolo (03/08, deciso con
      # prototipo): l'acqua e' girata davvero — e il recupero automatico non
      # ripetera' un ricircolo appena fatto a mano.
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.serra_acqua_ultimo
        data:
          timestamp: "{{ now().timestamp() | int }}"
      # La riga di diario la scrive LO SCRIPT (pattern applica_fase): il logger
      # eventi renderizzava prima che l'helper della durata fosse scritto e
      # usciva "0s". Qui `seconds` e' una variabile in mano: niente race.
      # Unico chiamante = l'app (nessun interno): origine manuale e' un fatto.
      - action: script.serra_diario_scrivi
        data:
          msg: "Acqua · ricircolo manuale ({{ seconds | default(3) | int }}s, da app)"
          origine: manuale

  serra_pump_main_off:
    alias: "Serra: Pump Main OFF"
    icon: mdi:pump-off
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "pump main off"

  serra_pump_main_apply:
    alias: "Serra: Pump Main Apply"
    icon: mdi:pump
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "pump main on -s {{ states('input_number.serra_pump_main_duration') | int }}"
      # Traccia l'ultimo ricircolo (usato dallo schedule acqua per il prossimo ciclo),
      # cosi' vale sia da "Avvia" manuale sia da automazione.
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.serra_acqua_ultimo
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_acqua_ultimo_ricircolo_s
        data:
          value: "{{ states('input_number.serra_pump_main_duration') | int(0) }}"

  # ---------------------------------------------------------------------------
  # PUMP NUTRIENTS
  # ---------------------------------------------------------------------------

  serra_nutrient_run:
    alias: "Serra: Nutrient Run"
    icon: mdi:water-pump
    # parallel: i 3 serra_nutrient_N_apply lo chiamano (nid diverso) e possono
    # sovrapporsi come prima quando erano script separati. Il doppio-run dello
    # STESSO nutriente resta impedito dal chiamante (gli *_apply sono mode:single).
    mode: parallel
    max: 5
    fields:
      nid:
        description: "Nutrient ID (0/1/2)"
        example: "0"
      seconds:
        description: "Duration per cycle"
        example: "1"
      times:
        description: "Number of cycles"
        example: "1"
      interval:
        description: "Interval between cycles"
        example: "1"
    variables:
      duration: "{{ seconds | default(1) | float }}"
      cycles: "{{ times | default(1) | int }}"
      pause: "{{ interval | default(1) | float }}"
      total_time: "{{ (duration * cycles) + (pause * (cycles - 1)) + 2 }}"
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "pump nutrient {{ nid | default(0) | int }} -s {{ duration }} -t {{ cycles }} -i {{ pause }}"
      - delay:
          seconds: "{{ total_time }}"
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "state sync"

  # I 3 *_apply erano cloni identici (solo l'id pompa cambiava) con la formula
  # total_time ricopiata: ora delegano a serra_nutrient_run passando nid + i
  # valori dei 3 input_number. Restano mode:single (niente doppio-dose sullo
  # stesso nutriente) e restano entita' distinte -> il logger serra_diario_eventi
  # continua a triggerare su di loro. Chiamata SINCRONA: l'apply resta 'on' per
  # tutta la durata (come prima), cosi' il diario logga a inizio erogazione.
  serra_nutrient_0_apply:
    alias: "Serra: Nutrient 0 Apply"
    icon: mdi:water-pump
    mode: single
    sequence:
      - action: script.serra_nutrient_run
        data:
          nid: 0
          seconds: "{{ states('input_number.serra_nutrient_duration') | float }}"
          times: "{{ states('input_number.serra_nutrient_times') | int }}"
          interval: "{{ states('input_number.serra_nutrient_interval') | float }}"

  serra_nutrient_1_apply:
    alias: "Serra: Nutrient 1 Apply"
    icon: mdi:water-pump
    mode: single
    sequence:
      - action: script.serra_nutrient_run
        data:
          nid: 1
          seconds: "{{ states('input_number.serra_nutrient_duration') | float }}"
          times: "{{ states('input_number.serra_nutrient_times') | int }}"
          interval: "{{ states('input_number.serra_nutrient_interval') | float }}"

  serra_nutrient_2_apply:
    alias: "Serra: Nutrient 2 Apply"
    icon: mdi:water-pump
    mode: single
    sequence:
      - action: script.serra_nutrient_run
        data:
          nid: 2
          seconds: "{{ states('input_number.serra_nutrient_duration') | float }}"
          times: "{{ states('input_number.serra_nutrient_times') | int }}"
          interval: "{{ states('input_number.serra_nutrient_interval') | float }}"


  # ---------------------------------------------------------------------------
  # NET
  # ---------------------------------------------------------------------------
  serra_net_on:
    alias: "Serra: Net ON"
    icon: mdi:wifi
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "net on"

  serra_net_off:
    alias: "Serra: Net OFF"
    icon: mdi:wifi-off
    mode: single
    sequence:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "net off"

# =============================================================================
# AUTOMATIONS
# =============================================================================

automation:
  # =========================================================================
  # CAMERA - foto giornaliera + archivio + diario.
  # La schedulazione sta QUI (non sul Pi): attivabile/spegnibile col toggle,
  # trace visibili, orario modificabile dall'UI. Il Pi tiene solo la
  # meccanica dello scatto (`serra foto` via bridge).
  # =========================================================================
  - id: serra_foto_giornaliera
    alias: "Serra: Foto giornaliera"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.serra_foto_ora
    condition:
      - condition: state
        entity_id: input_boolean.serra_foto_giornaliera
        state: "on"
      # AUDIT R1 (RT-18, decisione prototipo #2): si fotografa anche in
      # essiccazione (documentare il finale), ma a coltura CONCLUSA la serra
      # non si "sveglia" piu' ogni giorno per il flash.
      # AUDIT R3 (RT3-01): gate ANCHE sul master — con coltivazione spenta ma
      # fase 'sconosciuta' (semina futura del ciclo dopo, o piano illeggibile)
      # il solo fase!=conclusa veniva aggirato: flash quotidiano su serra vuota.
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.serra_fase
            state: "conclusa"
    action:
      - action: script.serra_foto_scatta

  # A ogni nuova foto (giornaliera o ad-hoc): copia nell'archivio HA
  # (/config/www/serra/archivio/, visibile anche su /local/serra/archivio/)
  # + riga di diario. La camera ha gia' l'immagine nuova quando scatta il
  # trigger: la pipeline pubblica il JPEG PRIMA del timestamp.
  - id: serra_foto_diario
    alias: "Serra: Foto - archivio + diario"
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.serra_foto_ultima
        not_from:
          - unknown
          - unavailable
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - action: camera.snapshot
        target:
          entity_id: camera.serra_foto
        data:
          filename: "/config/www/serra/archivio/{{ as_timestamp(trigger.to_state.state) | timestamp_custom('%Y-%m-%d_%H%M') }}.jpg"
      - action: input_number.set_value
        target:
          entity_id: input_number.serra_foto_indice
        data:
          value: 0
      - delay: "00:00:02"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.serra_foto_archivio
      - action: script.serra_diario_scrivi
        data:
          msg: "Camera · foto scattata"
      # AUTO-GUARIGIONE LUCI post-foto (2026-07-13): la pipeline camera
      # ripristina il mix che c'era PRIMA del flash; se quello era sbagliato
      # (es. luci spente a mano durante prove, ma lo schedule le vuole
      # accese) resterebbero sbagliate. Qui si ri-asserisce lo stato
      # PREVISTO: se le luci dovrebbero essere accese, applica il mix di
      # fase (applica_fase ha la guardia gia_cosi → no-op se già corretto,
      # niente flicker). Se dovrebbero essere spente, non tocca nulla (il
      # ripristino a spento della pipeline è già giusto).
      - if:
          - condition: state
            entity_id: input_boolean.serra_coltivazione_attiva
            state: "on"
          - condition: state
            entity_id: input_boolean.serra_schedule_luci
            state: "on"
          - condition: state
            entity_id: binary_sensor.serra_luci_dovrebbero_essere_on
            state: "on"
        then:
          - delay: "00:00:03"
          - action: script.serra_luce_applica_fase

  # =========================================================================
  # CICLO LUCE - varieta' e fotoperiodo
  # =========================================================================
  # Autofiorenti: il ciclo scelto (18/6|20/4|12/12) resta costante; qui viene
  # solo tradotto in orari (alba 06:00 fissa, spegnimento derivato).
  # Fotoperiodiche: veg = 18/6; alla data serra_inizio_fioritura il ciclo
  # passa a 12/12 da solo quando la milestone Inizio fioritura è attiva (data+conferma).

      # Push "foto del giorno" (Fase 4): testo + deep-link all'app — la foto
      # si guarda in Stato. Gate: master push + toggle dedicato.
      - if:
          - condition: state
            entity_id: input_boolean.serra_notifiche_push
            state: "on"
          - condition: state
            entity_id: input_boolean.serra_notifica_foto
            state: "on"
        then:
          - service: script.turn_on
            target:
              entity_id: script.serra_push_facoltativa
            data:
              variables:
                message: >-
                  Foto del giorno acquisita ({{ states('sensor.serra_foto_caption') }}).
                title: "📷 Serra — foto del giorno"
                mobile_url: "{{ states('input_text.serra_notifica_url') }}"
                # Immagine inline nella push (nice-to-have 03/08): lo stesso
                # file appena salvato dallo snapshot qui sopra, via /local.
                mobile_image: "/local/serra/archivio/{{ as_timestamp(trigger.to_state.state) | timestamp_custom('%Y-%m-%d_%H%M') }}.jpg"

  - id: serra_ciclo_auto
    alias: "Serra: Ciclo luce automatico"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_select.serra_ciclo_luce
          - input_select.serra_varieta
          - input_datetime.serra_inizio_fioritura
          - input_boolean.serra_conferma_fioritura
          - input_datetime.serra_luci_on
      - platform: time
        at: "00:05:00"
      - platform: state
        entity_id: input_boolean.serra_coltivazione_attiva
        to: "on"
      # A ogni avvio di HA ri-deriva il tramonto (serra_luci_off) dall'alba:
      # copre il caso in cui alba/ciclo/fioritura siano cambiati mentre HA era
      # spento (gli helper senza initial ripristinano l'ultimo valore, ma il
      # tramonto CALCOLATO va comunque ri-derivato). Legge solo helper locali
      # (già ripristinati all'evento start) → nessun delay necessario.
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.serra_coltivazione_attiva
        state: "on"
    action:
      - variables:
          fior_ts: "{{ state_attr('input_datetime.serra_inizio_fioritura','timestamp') | float(0) }}"
          in_fioritura: >-
            {{ is_state('input_select.serra_varieta','Fotoperiodica')
               and is_state('input_boolean.serra_conferma_fioritura','on')
               and fior_ts > 0
               and now().date() >= (fior_ts | timestamp_local | as_datetime).date() }}
          ciclo_giusto: >-
            {{ '12/12' if in_fioritura
               else ('18/6' if is_state('input_select.serra_varieta','Fotoperiodica')
               else states('input_select.serra_ciclo_luce')) }}
      - if:
          - condition: template
            value_template: "{{ states('input_select.serra_ciclo_luce') != ciclo_giusto }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.serra_ciclo_luce
            data:
              option: "{{ ciclo_giusto }}"
          - action: script.serra_diario_scrivi
            data:
              msg: "Luci · ciclo {{ ciclo_giusto }} ({{ 'inizio fioritura fotoperiodica' if in_fioritura else 'vegetativa fotoperiodica' }})"
      - action: script.serra_ciclo_applica

  # =========================================================================
  # LED RING - semaforo di stato
  # =========================================================================
  # Il ring riflette lo stato della serra (vedi script serra_ring_manager_apply
  # per le priorità). Questa automazione riafferma lo stato a ogni cambio
  # rilevante; le PARTENZE di attività (blink d'ingresso) sono in
  # serra_ring_attivita.
  - id: serra_ring_manager
    alias: "Serra: Ring Manager"
    # AUDIT R1 (RT-04, verificato: 5x "max runs exceeded" A OGNI avvio): con
    # queued la coda saturava nel settling e venivano SCARTATE proprio le run
    # finali (stato assestato) → ring sul colore sbagliato per ore. Lo script
    # chiamato e' gia' mode:restart e idempotente: qui vince sempre l'ULTIMO
    # stato, che e' esattamente cio' che serve a una lampada di stato.
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_boolean.serra_ring_auto
        to: "on"
      - platform: state
        entity_id:
          - input_boolean.serra_errore_pendente
          - input_boolean.serra_booster_da_dare
          - binary_sensor.serra_acqua_bassa
          - input_boolean.serra_coltivazione_attiva
          - binary_sensor.serra_luci_dovrebbero_essere_on
          # serra_fase: il ring ora ha un ramo dedicato all'essiccazione (dim) ->
          # deve ri-valutare a ogni transizione di fase (dentro/fuori essiccazione).
          - sensor.serra_fase
      - platform: state
        entity_id:
          - sensor.serra_pump_main_running_now
          - sensor.serra_nutrient_0_running_now
          - sensor.serra_nutrient_1_running_now
          - sensor.serra_nutrient_2_running_now
        to: "off"
    action:
      - action: script.serra_ring_manager_apply

  # Partenza attività (pompa/nutrienti): blu FISSO per tutta la durata.
  # NIENTE blink (scelta del prototipo 2026-07-12): il blink del controller tiene la
  # UART per tutta la sua durata (loop con sleep) -> solo comandi atomici brevi.
  # Il ritorno allo stato di base lo fa serra_ring_manager su running_now->off
  # (ricalcolo per priorità, non "restore" del colore precedente).
  # Se errore/intervento pendenti, non copre il rosso/viola.
  - id: serra_ring_attivita
    alias: "Serra: Ring - attivita in corso"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.serra_pump_main_running_now
          - sensor.serra_nutrient_0_running_now
          - sensor.serra_nutrient_1_running_now
          - sensor.serra_nutrient_2_running_now
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.serra_ring_auto
        state: "on"
      - condition: state
        entity_id: input_boolean.serra_errore_pendente
        state: "off"
      - condition: state
        entity_id: input_boolean.serra_booster_da_dare
        state: "off"
      - condition: state
        entity_id: binary_sensor.serra_acqua_bassa
        state: "off"
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "ring on -c blue -f 0"

  # Resync di stato a fine attività. I flag running_now sono DERIVATI lato
  # controller (now < until_ts) e NON vengono ripubblicati quando il micro
  # spegne da solo pompa/nutrienti (comandi self-timed): senza questo resync
  # running_now resta "on" per sempre (e il ring resta blu). Finché qualcosa
  # risulta in moto: "state sync" ogni 5s (niente UART, solo ripubblicazione
  # MQTT) finché lo stato non rientra. Il rientro sveglia serra_ring_manager.
  - id: serra_state_resync_attivita
    alias: "Serra: State resync a fine attivita"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - sensor.serra_pump_main_running_now
          - sensor.serra_nutrient_0_running_now
          - sensor.serra_nutrient_1_running_now
          - sensor.serra_nutrient_2_running_now
        to: "on"
    action:
      # AUDIT R1 (RT-10): cap ESPLICITO a 120 giri (~10 min) — il vecchio
      # commento "esce dopo 100 giri grazie al limite HA" era ERRATO (il limite
      # di HA e' nell'ordine delle migliaia): con un flag running_now incastrato
      # (bridge caduto a meta' run) il loop mandava state sync ogni 5s per ore.
      - repeat:
          until:
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{ repeat.index >= 120 }}"
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: sensor.serra_pump_main_running_now
                      state: "off"
                    - condition: state
                      entity_id: sensor.serra_nutrient_0_running_now
                      state: "off"
                    - condition: state
                      entity_id: sensor.serra_nutrient_1_running_now
                      state: "off"
                    - condition: state
                      entity_id: sensor.serra_nutrient_2_running_now
                      state: "off"
          sequence:
            - delay:
                seconds: 5
            - action: script.serra_state_sync

  # AUDIT R1 (RT-07): allinea il latch al done-state del PANNELLO — se il
  # booster viene spuntato da li' (riga "Piano · FATTO: <titolo booster>" nel
  # diario) il latch si spegne via script.serra_booster_dato (stessa logica
  # della conferma: turn_off + dato_giorno + riga diario). Prima il ring
  # restava viola e la notifica continuava nonostante il FATTO.
  - id: serra_booster_sync_fatto
    alias: "Serra: Booster - sync col FATTO del pannello"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.serra_diario
    condition:
      - condition: state
        entity_id: input_boolean.serra_booster_da_dare
        state: "on"
      - condition: template
        value_template: >-
          {% set fatti = state_attr('sensor.serra_diario','fatti') %}
          {% if fatti is not mapping %}
            {{ false }}
          {% else %}
            {% set d = states('sensor.serra_giorno_ciclo') | int(0) %}
            {% set dato = states('input_number.serra_booster_dato_giorno') | int(-1) %}
            {% set ev = state_attr('sensor.serra_eventi_effettivi','eventi') or [] %}
            {% set ns = namespace(hit=false) %}
            {% for e in ev if e.tipo == 'booster' and e.giorno <= d and e.giorno > dato %}
              {% if fatti.get(e.titolo | replace('’',"'") | replace('‘',"'") | replace('“','"') | replace('”','"') | trim) == 'FATTO' %}{% set ns.hit = true %}{% endif %}
            {% endfor %}
            {{ ns.hit }}
          {% endif %}
    action:
      - action: script.turn_on
        target:
          entity_id: script.serra_booster_dato

  # Mattina del giorno-booster: accende il latch (resta acceso finché non
  # confermi con script.serra_booster_dato, anche oltre la mezzanotte).
  # from:"off" -> arma SOLO alla transizione vera off->on (mezzanotte del
  # giorno-booster), NON su unknown->on da riavvio HA: il latch serra_booster_da_dare
  # non ha initial e quindi RESTORA già il suo stato al riavvio (on se non ancora
  # dato, off se già confermato); senza from:"off" un riavvio nel pomeriggio del
  # giorno-booster ricalcolava il sensore unknown->on e ri-armava un booster già
  # dato (ring viola + notifica 20:00 + diario duplicati).
  - id: serra_booster_flag
    alias: "Serra: Booster - promemoria acceso"
    mode: single
    trigger:
      # B-f/M7: qualsiasi ->on (NIENTE from:'off'), cosi' copre anche l'unknown->on
      # al riavvio (recovery, incluso il caso a cavallo della mezzanotte del
      # giorno-booster). Il re-arm indesiderato e' impedito dalle CONDIZIONI, non
      # da from:'off' (che invece impediva anche il recovery legittimo).
      - platform: state
        entity_id: binary_sensor.serra_booster_oggi
        to: "on"
    condition:
      # arma SOLO se il latch non e' gia' acceso E il booster di OGGI (giorno_ciclo)
      # non e' gia' stato dato (serra_booster_dato_giorno): un riavvio/flap nel
      # giorno gia' confermato NON ri-arma; un riavvio a cavallo della mezzanotte
      # (giorno nuovo, non dato) SI'.
      - condition: state
        entity_id: input_boolean.serra_booster_da_dare
        state: "off"
      - condition: template
        value_template: "{{ states('sensor.serra_giorno_ciclo') | int(-2) != states('input_number.serra_booster_dato_giorno') | int(-1) }}"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.serra_booster_da_dare
      - action: script.serra_diario_scrivi
        data:
          msg: "Nutrienti · Booster in programma OGGI ({{ states('sensor.serra_prossimo_booster') }})"

  # Comando serra fallito: accende il latch errore e ricorda il componente.
  # Il componente arriva dal controller SOLO se questo ha fatto in tempo a
  # pubblicare; se il fallimento è a monte (timeout, comando perso) il payload
  # è quello del bridge, che non ha "component" ma ha "cmd" (i token del
  # comando): il primo token È il componente (lights/fans/ring/net/...).
  - id: serra_errore_flag
    alias: "Serra: Errore - comando fallito"
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id: sensor.serra_last_command_ok
        to: "failed"
    action:
      # Race json_attributes (stesso pattern del belt, 2026-07-14): il trigger e'
      # un value_template (serra_last_command_ok) che si aggiorna PRIMA degli
      # attributi cmd/stderr di sensor.serra_last_command (json_attributes, callback
      # separata) -> leggerli subito darebbe cmd/stderr del comando PRECEDENTE.
      # Un piccolo delay li fa assestare prima di comporre componente/dettaglio.
      - delay: "00:00:01"
      - variables:
          cmd: "{{ state_attr('sensor.serra_last_command','cmd') or [] }}"
          componente: >-
            {% set c = states('sensor.serra_last_command_component') %}
            {{ c if c not in ['unknown', 'unavailable', ''] else (cmd[0] if cmd else 'sconosciuto') }}
          dettaglio: >-
            {% set err = state_attr('sensor.serra_last_command','stderr') or '' %}
            {{ ((cmd | join(' '))[:100] ~ (' — ' ~ err[:120] if err else ''))[:255] }}
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_errore_componente
        data:
          value: "{{ componente }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_errore_dettaglio
        data:
          value: "{{ dettaglio }}"
      # AUDIT R1 (RT-13): il LATCH per primo — ring rosso, notifica e badge non
      # devono aspettare l'I/O del diario (che passa da uno shell_command su
      # file e da una coda). Diario per ultimo e fire-and-forget.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.serra_errore_pendente
      - action: script.turn_on
        target:
          entity_id: script.serra_diario_scrivi
        data:
          variables:
            msg: "Sistema · ERRORE comando {{ componente }}{{ ' (' ~ (cmd | join(' '))[:60] ~ ')' if cmd else '' }}"

  # Auto-clear: lo STESSO componente che aveva fallito torna a funzionare.
  - id: serra_errore_autoclear
    alias: "Serra: Errore - rientro automatico"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.serra_last_command_ok
        to: "success"
    condition:
      - condition: state
        entity_id: input_boolean.serra_errore_pendente
        state: "on"
    action:
      # AUDIT R1 (RT-08): serra_last_command_component e' un value_template che
      # al trigger puo' essere STALE (componente del comando PRECEDENTE) → il
      # confronto in condition azzerava errori a torto o non azzerava quelli
      # risolti. Stesso rimedio del flag: delay 1s di assestamento, POI il
      # confronto (qui in action: se non combacia la run si ferma).
      - delay: "00:00:01"
      - condition: template
        value_template: "{{ states('sensor.serra_last_command_component') == states('input_text.serra_errore_componente') }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.serra_errore_pendente
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_errore_componente
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.serra_errore_dettaglio
        data:
          value: ""
      - action: script.serra_diario_scrivi
        data:
          msg: "Sistema · errore rientrato ({{ states('sensor.serra_last_command_component') }})"

  # =========================================================================
  # SINGOLE VENTOLE - con protezione da loop
  # =========================================================================
  - id: serra_fan_1_level_changed
    alias: "Serra: Fan 1 Level Changed"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.serra_fan_1_level
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      # ANTI-LOOP: pubblica SOLO se il cambio e' diretto dell'utente (context
      # senza parent_id). La cascata all->singole (serra_fan_all_level_changed)
      # e lo state-sync da MQTT scrivono il selettore con un context "figlio"
      # -> qui si saltano (niente eco/loop). Prima: finestra 2s su
      # all_fans_level.last_changed, che pero' sopprimeva anche un 2o cambio
      # manuale legittimo entro 2s a livelli misti (finding V dell'audit).
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "fans set 1 -i {{ states('input_select.serra_fan_1_level') }}"
      # riallinea il selettore globale (no-op se il valore calcolato non cambia)
      - action: script.serra_fans_sync_global

  - id: serra_fan_2_level_changed
    alias: "Serra: Fan 2 Level Changed"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.serra_fan_2_level
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      # ANTI-LOOP: pubblica SOLO se il cambio e' diretto dell'utente (context
      # senza parent_id). La cascata all->singole (serra_fan_all_level_changed)
      # e lo state-sync da MQTT scrivono il selettore con un context "figlio"
      # -> qui si saltano (niente eco/loop). Prima: finestra 2s su
      # all_fans_level.last_changed, che pero' sopprimeva anche un 2o cambio
      # manuale legittimo entro 2s a livelli misti (finding V dell'audit).
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "fans set 2 -i {{ states('input_select.serra_fan_2_level') }}"
      # riallinea il selettore globale (no-op se il valore calcolato non cambia)
      - action: script.serra_fans_sync_global

  - id: serra_fan_f_level_changed
    alias: "Serra: Fan F Level Changed"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.serra_fan_f_level
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      # ANTI-LOOP: pubblica SOLO se il cambio e' diretto dell'utente (context
      # senza parent_id). La cascata all->singole (serra_fan_all_level_changed)
      # e lo state-sync da MQTT scrivono il selettore con un context "figlio"
      # -> qui si saltano (niente eco/loop). Prima: finestra 2s su
      # all_fans_level.last_changed, che pero' sopprimeva anche un 2o cambio
      # manuale legittimo entro 2s a livelli misti (finding V dell'audit).
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "fans set F -i {{ states('input_select.serra_fan_f_level') }}"
      # riallinea il selettore globale (no-op se il valore calcolato non cambia)
      - action: script.serra_fans_sync_global

  # =========================================================================
  # ALL FANS - Sovrascrive tutte
  # =========================================================================
  - id: serra_fan_all_level_changed
    alias: "Serra: All Fans Level Changed"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.serra_all_fans_level
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      # ANTI-LOOP col sync inverso: se il nuovo valore e' uguale a quello
      # calcolato dai 3 selettori singoli, il cambio arriva da
      # script.serra_fans_sync_global (specchio) -> niente da comandare.
      # Un cambio "vero" (utente/automazione ventole) differisce dai singoli.
      # FONTE UNICA: si legge sensor.serra_all_fans_computed_level (stessa
      # formula, prima ricopiata qui). Timing OK: qui i selettori singoli NON
      # sono ancora cambiati (la cascata li scrive nell'azione, dopo) -> il
      # sensore riflette i singoli correnti.
      - condition: template
        value_template: "{{ trigger.to_state.state != states('sensor.serra_all_fans_computed_level') }}"
    action:
      - action: mqtt.publish
        data:
          topic: "serra/cmd/ha"
          payload: "fans set all -i {{ states('input_select.serra_all_fans_level') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.serra_fan_1_level
        data:
          option: "{{ states('input_select.serra_all_fans_level') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.serra_fan_2_level
        data:
          option: "{{ states('input_select.serra_all_fans_level') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.serra_fan_f_level
        data:
          option: "{{ states('input_select.serra_all_fans_level') }}"

