

# ============================================================================
# ★★★ IMPOSTAZIONI RAPIDE — dove trovare le cose che si cambiano spesso ★★★
# ============================================================================
#  · ORARI DIGEST NOTIFICHE (mattina/sera) → sezione `input_datetime:`,
#    voci `serra_digest_mattina` / `serra_digest_sera` (cerca "DIGEST")
#  · ORARIO EROGAZIONE AUTOMATICA (dosatori) → `serra_dose_ora` (idem)
#  · ORARIO FOTO GIORNALIERA → `serra_foto_ora` (idem)
#  · ORARIO PROMEMORIA MILESTONE → `serra_promemoria_ora` (idem)
#  · SOGLIA ALLARME ACQUA (%) → sezione `input_number:`, `serra_acqua_soglia_pct`
#  · URL DEL TAP SULLA PUSH → sezione `input_text:`, voce `serra_notifica_url`
#  Entrambi sono modificabili ANCHE dalla UI di HA (Helper) e il valore
#  impostato da UI persiste ai riavvii.
#
#  ⚠ PRIMO AVVIO su un'installazione NUOVA (AUDIT R2/RT2-09): senza `initial:`
#  (scelta voluta: i valori UI persistono) gli helper appena CREATI partono
#  vuoti — input_datetime a 00:00 e input_number dal proprio `min` (soglia
#  acqua 5%!). Impostare SUBITO dalla UI i valori consigliati:
#  digest 09:00/18:00 · dose 09:15 · foto 16:20 · promemoria 09:05 · soglia 15.
# ============================================================================

# ============================================================================
# ★★★ CONFIGURAZIONE SENSORI CLIMA ★★★
# ============================================================================
# Il controllo clima (ventole) usa 4 sensori "logici" definiti nella sezione
# `template:` di questo file, blocco "★ SENSORI CLIMA ★":
#   - sensor.serra_clima_temperatura / serra_clima_umidita  → clima DENTRO la
#     serra, da un sensore Home Assistant scelto nelle impostazioni dell'app
#   - sensor.serra_clima_rif_temperatura / _rif_umidita     → clima della
#     STANZA che ospita la serra, da sensori Home Assistant facoltativi
# Le quattro sorgenti si scelgono nella pagina Impostazioni dell'app.
# La taratura input_number.serra_taratura_* va misurata sul proprio sensore e
# si applica solo dopo aver attivato input_boolean.serra_taratura_clima_attiva.
# Se il sensore serra muore/si scarica: i logici diventano `unavailable`,
# le ventole vanno in SICUREZZA a low fisso e arriva una notifica.
# ============================================================================

# ============================================================================
# SERRA MQTT - MAPPATURA COMPLETA DEI TOPIC E PAYLOAD
# ============================================================================
# Ecco tutti i topic MQTT pubblicati dal sistema serra.
# Usare come riferimento per integrazioni Home Assistant, Node-RED, ecc.
#
# Convenzioni:
#   - I campi ts/ts_iso/ts_local sono sempre presenti insieme
#   - Boolean: true/false (JSON standard)
#   - I campi "running_now" sono derivati lato controller (now < until_ts)
# ============================================================================


# ----------------------------------------------------------------------------
# STATUS TOPICS (informazioni sul bridge e ultimo comando)
# ----------------------------------------------------------------------------

#   serra/status/online                          # Stato connessione bridge MQTT
#     - ok                                       # Boolean. True se bridge operativo, False se offline (LWT)
#     - msg                                      # String. Messaggio stato ("bridge online" | "bridge offline")
#     - cli                                      # String. Nome eseguibile CLI usato (es. "serra")
#     - ts                                       # Float. Unix epoch in secondi con decimali
#     - ts_iso                                   # String. Timestamp UTC ISO 8601 (es. "2026-01-10T15:30:00.123456Z")
#     - ts_local                                 # String. Timestamp locale con offset (es. "2026-01-10T16:30:00.123456+01:00")

#   serra/status/last_seen                       # Heartbeat / ultimo segno di vita del sistema
#     - ok                                       # Boolean. True se heartbeat valido
#     - source                                   # String. Origine segnale ("mqtt-bridge" | "controller")
#     - msg                                      # String. Messaggio breve (es. "bridge online")
#     - cli                                      # String. Nome CLI (es. "serra")
#     - ts                                       # Float. Unix epoch ultimo heartbeat
#     - ts_iso                                   # String. Timestamp UTC ISO 8601
#     - ts_local                                 # String. Timestamp locale con offset

#   serra/status/last                            # Esito ultimo comando eseguito (qualsiasi componente)
#     - ok                                       # Boolean. True se comando eseguito con successo
#     - component                                # String. Componente target ("lights"|"fans"|"ring"|"pump_main"|"pump_nutrients"|"net")
#     - action                                   # String. Azione eseguita ("on"|"off"|"set"|"run"|"blink_start"|"blink_end")
#     - cmd                                      # String. Comando UART inviato (es. "echo W3 > /dev/tty-nebbia")
#     - cli                                      # String. Nome CLI ("serra")
#     - ts                                       # Float. Unix epoch esecuzione comando
#     - ts_iso                                   # String. Timestamp UTC ISO 8601
#     - ts_local                                 # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# STATE: LIGHTS (pannello LED)
# ----------------------------------------------------------------------------

#   serra/state/lights
#     state:
#       - channel                                # String. Canale attivo ("A"|"G"|"B"|"R"|"D")
#                                                #   A = full spectrum (tutti i LED)
#                                                #   G = solo verdi
#                                                #   B = blu + bianchi
#                                                #   R = prima metà rossi
#                                                #   D = seconda metà rossi
#       - intensity_pct                          # Integer. Intensità percentuale (0-100)
#       - fade_s                                 # Float. Durata fade richiesta in secondi
#       - on                                     # Boolean. Derivato: true se intensity_pct > 0
#       - transition                             # String. Presente solo durante fade: "fading"
#       - until_ts                               # Float. Unix epoch fine transizione (solo se fade attivo)
#       - until_iso                              # String. Fine transizione UTC ISO 8601 (solo se fade attivo)
#       - until_local                            # String. Fine transizione locale (solo se fade attivo)
#       - ts                                     # Float. Unix epoch ultimo aggiornamento state
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset
#     last:
#       - ok                                     # Boolean. True se ultimo comando luci riuscito
#       - action                                 # String. Ultima azione ("on"|"off"|"set")
#       - cmd                                    # String. Ultimo comando UART inviato
#       - ts                                     # Float. Unix epoch ultimo comando
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# STATE: FANS (ventole)
# ----------------------------------------------------------------------------

#   serra/state/fans/fan-1                       # Ventola 1
#   serra/state/fans/fan-2                       # Ventola 2
#   serra/state/fans/fan-F                       # Ventola frontale
#     state:
#       - level                                  # String. Livello velocità ("off"|"low"|"medium"|"high")
#       - pct                                    # Integer. Percentuale velocità (0-100)
#                                                #   off=0, low=50, medium=75, high=100
#       - running                                # Boolean. True se ventola attiva (pct > 0)
#       - wake_used                              # Boolean. True se è stato fatto wake al 100% prima di scendere
#                                                #   (necessario per far partire ventole ferme a low/medium)
#       - ok                                     # Boolean. True se ultimo comando riuscito
#       - cmd                                    # String. Ultimo comando UART (es. "echo V1ffxxx > /dev/tty-local")
#       - ts                                     # Float. Unix epoch ultimo aggiornamento
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset
#     last:
#       - ok                                     # Boolean. True se ultimo comando riuscito
#       - action                                 # String. Ultima azione ("on"|"off"|"set")
#       - target                                 # String. Ventola target di questo comando ("1"|"2"|"F")
#       - level                                  # String. Livello impostato ("off"|"low"|"medium"|"high")
#       - pct                                    # Integer. Percentuale impostata (0-100)
#       - cmd                                    # String. Comando UART inviato
#       - ts                                     # Float. Unix epoch comando
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# STATE: RING (LED ring RGB)
# ----------------------------------------------------------------------------

#   serra/state/ring
#     state:
#       - mode                                   # String. Modalità attiva ("on"|"off"|"blink")
#       - color                                  # String. Colore HEX RGB senza # (es. "FF0000", "00FF00", "FFFFFF")
#       - fade_s                                 # Float. Durata fade in secondi
#       - running                                # Boolean. True se animazione/blink in corso
#       - transition                             # String. Presente solo durante fade: "fading"
#       - until_ts                               # Float. Unix epoch fine animazione/transizione
#       - until_iso                              # String. Fine animazione UTC ISO 8601
#       - until_local                            # String. Fine animazione locale
#       - running_now                            # Boolean. Derivato: true se now < until_ts
#       - last_blink                             # Object. Presente solo dopo un blink completato:
#           - color                              #   String. Colore HEX usato nel blink
#           - times                              #   Integer. Numero di lampeggi eseguiti
#           - duration_s                         #   Float. Durata ON di ogni lampeggio
#           - interval_s                         #   Float. Pausa OFF tra lampeggi
#       - cmd                                    # String. Ultimo comando UART
#       - ts                                     # Float. Unix epoch ultimo aggiornamento
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset
#     last:
#       - ok                                     # Boolean. True se ultimo comando riuscito
#       - action                                 # String. Ultima azione ("on"|"off"|"blink_start"|"blink_end")
#       - color                                  # String. Colore HEX usato (presente per blink_end)
#       - times                                  # Integer. Numero lampeggi (presente per blink_end)
#       - cmd                                    # String. Ultimo comando UART
#       - ts                                     # Float. Unix epoch comando
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# STATE: PUMPS - MAIN (pompa ricircolo principale)
# ----------------------------------------------------------------------------

#   serra/state/pumps/main
#     state:
#       - running                                # Boolean. True se pompa attiva (stato dichiarato)
#       - seconds                                # Integer. Durata richiesta in secondi
#       - until_ts                               # Float. Unix epoch fine prevista erogazione
#       - until_iso                              # String. Fine prevista UTC ISO 8601
#       - until_local                            # String. Fine prevista locale
#       - running_now                            # Boolean. Derivato: true se now < until_ts
#       - cmd                                    # String. Comando UART (es. "echo W3 > /dev/tty-nebbia")
#       - ts                                     # Float. Unix epoch ultimo aggiornamento
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset
#     last:
#       - ok                                     # Boolean. True se ultimo comando riuscito
#       - action                                 # String. Ultima azione ("on"|"off")
#       - cmd                                    # String. Comando UART inviato
#       - ts                                     # Float. Unix epoch comando
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# STATE: PUMPS - NUTRIENTS (pompe nutrienti / gocciolatori)
# ----------------------------------------------------------------------------

#   serra/state/pumps/nutrient-0                 # Gocciolatore DESTRO (capsula BLU · Bloom)
#   serra/state/pumps/nutrient-1                 # Gocciolatore CENTRALE (capsula VERDE · Micro)
#   serra/state/pumps/nutrient-2                 # Gocciolatore SINISTRO (capsula ROSSA · Grow)
#     state:
#       - running                                # Boolean. True se sequenza erogazione in corso
#       - seconds                                # Float. Durata singola erogazione in secondi
#       - times                                  # Integer. Numero ripetizioni richieste
#       - interval                               # Float. Pausa tra ripetizioni in secondi
#       - total_s                                # Float. Durata totale stimata: (seconds * times) + (interval * (times-1))
#       - until_ts                               # Float. Unix epoch fine prevista sequenza
#       - until_iso                              # String. Fine prevista UTC ISO 8601
#       - until_local                            # String. Fine prevista locale
#       - running_now                            # Boolean. Derivato: true se now < until_ts
#       - ok                                     # Boolean. True se tutti i comandi della sequenza riusciti
#       - ts                                     # Float. Unix epoch ultimo aggiornamento
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset
#     last:
#       - ok                                     # Boolean. True se ultimo comando riuscito
#       - action                                 # String. Azione eseguita ("run")
#       - nid                                    # Integer. ID pompa nutriente (0|1|2)
#       - seconds                                # Float. Durata singola erogazione usata
#       - times                                  # Integer. Numero ripetizioni eseguite
#       - interval                               # Float. Intervallo tra ripetizioni usato
#       - ts                                     # Float. Unix epoch comando
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# STATE: NET (rete Wi-Fi della serra)
# ----------------------------------------------------------------------------

#   serra/state/net
#     state:
#       - enabled                                # Boolean. True se rete abilitata (apcli0/ra0 up)
#       - ntp                                    # Boolean. True se NTP attivo (sincronizzazione orario)
#       - ts                                     # Float. Unix epoch ultimo aggiornamento
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset
#     last:
#       - ok                                     # Boolean. True se ultimo comando riuscito
#       - action                                 # String. Ultima azione ("on"|"off")
#       - ntp                                    # String. Stato NTP impostato ("on"|"off")
#       - ts                                     # Float. Unix epoch comando
#       - ts_iso                                 # String. Timestamp UTC ISO 8601
#       - ts_local                               # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# ACK TOPICS (acknowledgment per comandi con ID)
# ----------------------------------------------------------------------------

#   serra/ack/<msg_id>                           # Risposta a comando con ID specifico
#     - ok                                       # Boolean. True se comando eseguito con successo
#     - rc                                       # Integer. Return code CLI (0=success, 124=timeout, 127=not found)
#     - cmd                                      # Array[String]. Tokens comando eseguito (es. ["lights","on","-i","80"])
#     - stdout                                   # String. Output standard del comando
#     - stderr                                   # String. Output errore del comando
#     - topic                                    # String. Topic MQTT originale del comando
#     - ts                                       # Float. Unix epoch esecuzione
#     - ts_iso                                   # String. Timestamp UTC ISO 8601
#     - ts_local                                 # String. Timestamp locale con offset


# ----------------------------------------------------------------------------
# CMD TOPICS (comandi in ingresso - il bridge si sottoscrive a questi)
# ----------------------------------------------------------------------------

#   serra/cmd                                    # Comando senza ID (no ack dedicato)
#   serra/cmd/<id>                               # Comando con ID (ack su serra/ack/<id>)
#   serra/cmd/json                               # Comando JSON senza ID
#   serra/cmd/json/<id>                          # Comando JSON con ID

#   Payload accettati:
#     - Stringa semplice: "lights on -i 80 -f 30"
#     - JSON cmdline:     {"cmdline": "lights on -i 80 -f 30"}
#     - JSON cmd array:   {"cmd": ["lights", "on", "-i", "80", "-f", "30"]}


# ============================================================================
# NOTE TECNICHE
# ============================================================================
#
# 1. RETAIN: Tutti i topic /state/* e /status/* sono pubblicati con retain=true
#    per garantire che nuovi subscriber ricevano subito lo stato corrente.
#
# 2. QoS: Default QoS=0 (configurabile via SERRA_MQTT_QOS).
#
# 3. TIMESTAMPS: Ogni payload include sempre la tripletta ts/ts_iso/ts_local
#    per facilitare debug e visualizzazione in diversi formati.
#
# 4. RUNNING_NOW vs RUNNING:
#    - "running" = stato dichiarato dall'ultimo comando
#    - "running_now" = stato derivato (now < until_ts), ricalcolato da state sync
#
# 5. LWT (Last Will Testament): Se il bridge si disconnette, pubblica
#    automaticamente su serra/status/online con ok=false e msg="bridge offline".
#
# 6. STATE SYNC: Eseguire periodicamente `serra state sync` per aggiornare
#    i flag running_now quando scadono i timer (es. via systemd timer).
#
# ============================================================================


# ============================================================================
# SERRA - HOME ASSISTANT PACKAGE
# ============================================================================
# Integrazione completa per il controllo della serra via MQTT.
#
# Requisiti:
#   - MQTT broker configurato
#   - serra_mqtt_bridge.py in esecuzione
#   - Mushroom Cards (per la dashboard)
#
# Topic MQTT documentati in testa a questo file (righe ~19-292).
# ============================================================================


mqtt:

  # ---------------------------------------------------------------------------
  # CAMERA — foto dalla webcam interna della serra (USB sul VoCore2).
  # Pipeline sul Pi (/usr/local/bin/serra-foto): profilo LED B2/B5 originale
  # → scatto fswebcam 640x480 JPEG 95 con WB automatico → ripristino luci
  # → trasferimento UART con checksum → publish JPEG retained. La Wi-Fi
  # del VoCore resta spenta; soltanto il Raspberry usa MQTT sulla rete di casa.
  # Schedulazione delle 16:20 in HA (automazione serra_foto_giornaliera), NON
  # sul Pi (il timer systemd serra-foto.timer e' stato rimosso 2026-07-13).
  # Scatto ad-hoc: script.serra_foto_scatta ("foto" al bridge → `serra foto`).
  # Sul Pi resta solo latest.jpg; l'archivio timestampato e' in HA
  # (/config/www/serra/archivio/, via serra_foto_diario).
  # ---------------------------------------------------------------------------
  camera:
    - name: "Serra Foto"
      unique_id: serra_foto
      topic: "serra/camera/latest"

  sensor:
    # -------------------------------------------------------------------------
    # STATUS / HEARTBEAT
    # -------------------------------------------------------------------------
    - name: "Serra Bridge Online"
      unique_id: serra_bridge_online
      state_topic: "serra/status/online"
      value_template: "{{ 'online' if value_json.ok else 'offline' }}"
      json_attributes_topic: "serra/status/online"
      icon: mdi:access-point

    - name: "Serra Last Seen"
      unique_id: serra_last_seen
      state_topic: "serra/status/last_seen"
      value_template: "{{ value_json.ts_local | as_datetime | as_local }}"
      json_attributes_topic: "serra/status/last_seen"
      device_class: timestamp
      icon: mdi:clock-outline

    # Boot timestamp della serra (pubblicato dal timer serra-uptime sul Pi
    # ogni 15 min, anti-jitter: cambia SOLO a riavvio vero). NIENTE
    # json_attributes DI PROPOSITO: il reconcile triggera sul cambio di stato
    # e gli attributi (ts del check) cambierebbero a ogni lettura.
    - name: "Serra Boot"
      unique_id: serra_boot
      state_topic: "serra/state/boot"
      value_template: "{{ value_json.boot_iso }}"
      icon: mdi:restart

    # Boot timestamp del RASPBERRY PI stesso (do_uptime lo pubblica insieme
    # a quello della serra). Per la riga "Raspberry Pi acceso da".
    - name: "Serra Pi Boot"
      unique_id: serra_pi_boot
      state_topic: "serra/state/pi_boot"
      value_template: "{{ value_json.boot_iso }}"
      icon: mdi:raspberry-pi

    # Timestamp dell'ultima foto pubblicata dalla pipeline camera (vedi sopra).
    - name: "Serra Foto Ultima"
      unique_id: serra_foto_ultima
      state_topic: "serra/camera/latest_ts"
      value_template: "{{ value | as_datetime | as_local }}"
      device_class: timestamp
      icon: mdi:camera-outline

    - name: "Serra Last Command"
      unique_id: serra_last_command
      state_topic: "serra/status/last"
      value_template: "{{ value_json.action | default('unknown') }}"
      json_attributes_topic: "serra/status/last"
      icon: mdi:console

    - name: "Serra Last Command Component"
      unique_id: serra_last_command_component
      state_topic: "serra/status/last"
      value_template: "{{ value_json.component | default('unknown') }}"
      icon: mdi:cog

    - name: "Serra Last Command OK"
      unique_id: serra_last_command_ok
      state_topic: "serra/status/last"
      value_template: "{{ 'success' if value_json.ok else 'failed' }}"
      icon: mdi:check-circle

    # -------------------------------------------------------------------------
    # LIGHTS
    # -------------------------------------------------------------------------
    - name: "Serra Lights State"
      unique_id: serra_lights_state
      state_topic: "serra/state/lights"
      value_template: "{{ 'on' if value_json.state.on else 'off' }}"
      json_attributes_topic: "serra/state/lights"
      json_attributes_template: "{{ value_json.state | tojson }}"
      icon: mdi:lightbulb

    - name: "Serra Lights Channel"
      unique_id: serra_lights_channel
      state_topic: "serra/state/lights"
      value_template: "{{ value_json.state.channel | default('A') }}"
      icon: mdi:palette

    - name: "Serra Lights Intensity"
      unique_id: serra_lights_intensity
      state_topic: "serra/state/lights"
      unit_of_measurement: "%"
      value_template: "{{ value_json.state.intensity_pct | default(0) | int }}"
      icon: mdi:brightness-6

    - name: "Serra Lights Fade"
      unique_id: serra_lights_fade
      state_topic: "serra/state/lights"
      unit_of_measurement: "s"
      value_template: "{{ value_json.state.fade_s | default(0) | float }}"
      icon: mdi:timer-outline

    - name: "Serra Lights Last Update"
      unique_id: serra_lights_last_update
      state_topic: "serra/state/lights"
      value_template: "{{ value_json.last.ts_local | default('') }}"
      device_class: timestamp
      icon: mdi:clock-outline

    - name: "Serra Lights Last Action"
      unique_id: serra_lights_last_action
      state_topic: "serra/state/lights"
      value_template: "{{ value_json.last.action | default('unknown') }}"
      icon: mdi:history

    # -------------------------------------------------------------------------
    # RING
    # -------------------------------------------------------------------------
    - name: "Serra Ring State"
      unique_id: serra_ring_state
      state_topic: "serra/state/ring"
      value_template: "{{ value_json.state.mode | default('off') }}"
      json_attributes_topic: "serra/state/ring"
      json_attributes_template: "{{ value_json.state | tojson }}"
      icon: mdi:led-strip-variant

    - name: "Serra Ring Color"
      unique_id: serra_ring_color
      state_topic: "serra/state/ring"
      value_template: "{{ value_json.state.color | default('000000') }}"
      icon: mdi:palette

    - name: "Serra Ring Running"
      unique_id: serra_ring_running
      state_topic: "serra/state/ring"
      value_template: "{{ 'on' if value_json.state.running else 'off' }}"
      icon: mdi:play-circle

    - name: "Serra Ring Last Update"
      unique_id: serra_ring_last_update
      state_topic: "serra/state/ring"
      value_template: "{{ value_json.last.ts_local | default('') }}"
      device_class: timestamp
      icon: mdi:clock-outline

    - name: "Serra Ring Last Action"
      unique_id: serra_ring_last_action
      state_topic: "serra/state/ring"
      value_template: "{{ value_json.last.action | default('unknown') }}"
      icon: mdi:history

    # -------------------------------------------------------------------------
    # FANS
    # -------------------------------------------------------------------------
    - name: "Serra Fan 1 State"
      unique_id: serra_fan_1_state
      state_topic: "serra/state/fans/fan-1"
      value_template: "{{ 'on' if value_json.state.running else 'off' }}"
      json_attributes_topic: "serra/state/fans/fan-1"
      json_attributes_template: "{{ value_json.state | tojson }}"
      icon: mdi:fan

    - name: "Serra Fan 1 Level"
      unique_id: serra_fan_1_level
      state_topic: "serra/state/fans/fan-1"
      value_template: "{{ value_json.state.level | default('off') }}"
      icon: mdi:speedometer

    - name: "Serra Fan 1 Percent"
      unique_id: serra_fan_1_percent
      state_topic: "serra/state/fans/fan-1"
      unit_of_measurement: "%"
      value_template: "{{ value_json.state.pct | default(0) | int }}"
      icon: mdi:percent

    - name: "Serra Fan 1 Last Update"
      unique_id: serra_fan_1_last_update
      state_topic: "serra/state/fans/fan-1"
      value_template: "{{ value_json.last.ts_local | default('') }}"
      device_class: timestamp
      icon: mdi:clock-outline

    - name: "Serra Fan 1 Last Action"
      unique_id: serra_fan_1_last_action
      state_topic: "serra/state/fans/fan-1"
      value_template: "{{ value_json.last.action | default('unknown') }}"
      icon: mdi:history

    - name: "Serra Fan 2 State"
      unique_id: serra_fan_2_state
      state_topic: "serra/state/fans/fan-2"
