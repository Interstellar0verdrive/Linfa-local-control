      value_template: "{{ value_json.state.ts_local | default('') }}"
      device_class: timestamp
      icon: mdi:clock-outline


# =============================================================================
# INPUT HELPERS
# =============================================================================

input_text:
  # Sorgenti climatiche configurabili dalla pagina Impostazioni dell'app.
  # Non impostare initial: le scelte fatte dall'utente devono sopravvivere
  # ai riavvii. Finché una sorgente non è scelta o non fornisce un numero,
  # il relativo sensore logico rimane unavailable (fail-safe ventole).
  serra_sorgente_temp_interna:
    name: "Serra Sorgente Temperatura Interna"
    max: 100
    icon: mdi:thermometer
  serra_sorgente_umid_interna:
    name: "Serra Sorgente Umidità Interna"
    max: 100
    icon: mdi:water-percent
  serra_sorgente_temp_stanza:
    name: "Serra Sorgente Temperatura Stanza"
    max: 100
    icon: mdi:home-thermometer
  serra_sorgente_umid_stanza:
    name: "Serra Sorgente Umidità Stanza"
    max: 100
    icon: mdi:home-percent

  # ═══════════════════════════════════════════════════════════════════════
  # ★★★ IMPOSTAZIONE NOTIFICHE — URL DEL TAP SULLA PUSH ★★★
  # Destinazione aperta toccando la notifica push del digest serra.
  # MODIFICABILE ANCHE DA UI (Impostazioni → Dispositivi e servizi → Helper →
  # "Serra Notifica URL"): il valore impostato da UI PERSISTE ai riavvii
  # (nessun `initial:` qui sotto, apposta — non aggiungerlo!).
  # Valori tipici: "/dashboard-serra" (pagina dashboard, si apre in-app),
  # oppure "homeassistant://navigate/<path>". I pannelli ingress via deep-link
  # NON funzionano su iOS (rimbalzano su Safari): usare pagine lovelace.
  # Gli ORARI del digest sono qui sotto nella sezione input_datetime
  # (serra_digest_mattina / serra_digest_sera).
  # ═══════════════════════════════════════════════════════════════════════
  serra_notifica_url:
    name: "Serra Notifica URL"
    max: 100
    icon: mdi:link-variant

  # Facoltativo: nome dell'azione del telefono, per esempio
  # notify.mobile_app_mio_telefono. Lascia vuoto per usare solo le notifiche
  # persistenti di Home Assistant. Non impostare initial: la scelta persiste.
  serra_notifica_servizio:
    name: "Serra Notifica Servizio Mobile"
    max: 100
    icon: mdi:cellphone-message

  # Componente dell'ultimo comando FALLITO (es. "nutrients", "pump_main").
  # Scritto da serra_errore_flag; usato da serra_errore_autoclear per spegnere
  # il latch errore solo quando lo STESSO componente torna a funzionare.
  serra_errore_componente:
    name: "Serra Errore Componente"
    max: 50
    icon: mdi:alert-circle-outline

  # Dettaglio dell'ultimo comando FALLITO ("comando — stderr", troncato).
  # Va catturato QUI nel momento del fallimento: gli attributi di
  # sensor.serra_last_command vengono sovrascritti dal comando successivo
  # dopo 1-2s, quindi la notifica non può leggerli direttamente.
  serra_errore_dettaglio:
    name: "Serra Errore Dettaglio"
    max: 255
    icon: mdi:alert-circle-outline

  # Ultima azione SEMANTICA del pannello luci ("accensione" / "spegnimento"
  # / "cambio mix canali"), derivata dalle TRANSIZIONI reali dello stato da
  # serra_luci_ultima_azione (l'automazione qui sotto): il verbo del firmware
  # dice solo 'mix' e non distingue niente. Il QUANDO e' il last_changed.
  serra_luci_ultima_azione:
    name: "Serra Luci Ultima Azione"
    # il valore porta anche il QUANDO ("evento @iso"): riscrivere lo stesso
    # evento due volte non muoverebbe last_changed, e l'ora sarebbe stantia
    max: 80
    icon: mdi:lightbulb-question

  # (2026-07-12) I preset luce NON sono piu' input_text customizzabili da UI:
  # le ricette per fase vivono in /config/serra_piano.yaml (sezione "luci"),
  # lette via sensor.serra_piano e applicate da script.serra_luce_applica_fase.

input_number:
  # Durata dell'ULTIMO ricircolo in secondi (03/08, per la riga "Durata
  # ultimo ricircolo" dell'app): scritta insieme alla marcatura di
  # serra_acqua_ultimo in TUTTI i percorsi (apply, schedule, recupero,
  # manuale da app). 0 = mai registrata (la riga in app non compare).
  serra_acqua_ultimo_ricircolo_s:
    name: "Serra Acqua Ultimo Ricircolo Durata"
    min: 0
    max: 600
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer-outline

  # Soglia dell'allarme ACQUA BASSA in % (audit R1/RT-16: era cablata a 15
  # dentro binary_sensor.serra_acqua_bassa). Modificabile da UI; persiste.
  serra_acqua_soglia_pct:
    name: "Serra Soglia Allarme Acqua"
    min: 5
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  # Correzione opzionale dell'umidità interna, da impostare solo dopo una
  # misura di confronto sul proprio sensore. Disattivata al primo avvio.
  serra_taratura_umidita:
    name: "Serra Taratura Umidità"
    min: -15
    max: 15
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:tune-variant

  # ---------------------------------------------------------------------------
  # CALIBRAZIONE POMPE NUTRIENTI (misurata col misurino 2026-07-13, capsule
  # ad acqua, bilancia sotto i gocciolatori — pompe AD ARIA, ml/s ≈ lineare
  # offset ~0). secondi = ml / (ml_s). Bias basso voluto (sotto-dose = sicura).
  # MAPPATURA (id firmware → colore coperchio → nutriente → posizione):
  #   pompa 0 = BLU (B) = Bloom  → gocciolatore DESTRO
  #   pompa 1 = VERDE   (G) = Micro  → gocciolatore CENTRALE
  #   pompa 2 = ROSSA   (R) = Grow   → gocciolatore SINISTRO
  # In UI le pompe si chiamano col colore+nutriente, NON "N0/N1/N2" (scelta
  # prototipo 2026-07-13). Come tarare: bilancia precisa sotto il gocciolatore,
  # eroga 1s più volte, media dei grammi = ml/s (a capsula PIENA).
  # cal_ml_s = 0 → FLAG MANUALE "pompa fuori uso" (NIENTE auto-detect: le
  # pompe tornano rc0 anche a vuoto) → quel componente passa a siringa.
  # ---------------------------------------------------------------------------
  serra_cal_pompa_0_ml_s:
    name: "Serra Cal Pompa 0 (destra, B) ml/s"
    min: 0
    max: 3
    step: 0.01
    icon: mdi:scale-balance
  serra_cal_pompa_1_ml_s:
    name: "Serra Cal Pompa 1 (centro, G) ml/s"
    min: 0
    max: 3
    step: 0.01
    icon: mdi:scale-balance
  serra_cal_pompa_2_ml_s:
    name: "Serra Cal Pompa 2 (sinistra, R) ml/s"
    min: 0
    max: 3
    step: 0.01
    icon: mdi:scale-balance

  # Correzione opzionale della temperatura, da misurare sul proprio sensore.
  # Disattivata al primo avvio.
  serra_taratura_temp:
    name: "Serra Taratura Temperatura"
    min: -10
    max: 10
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:tune-variant

  # Indice del carosello foto: 0 = ultima, 1 = precedente, ... Rimesso a 0
  # dall'automazione serra_foto_diario a ogni nuova foto.
  serra_foto_indice:
    name: "Serra Foto Indice"
    min: 0
    max: 59
    step: 1
    icon: mdi:image-multiple

  serra_lights_fade:
    name: "Serra Lights Fade"
    min: 0
    max: 120
    step: 5
    unit_of_measurement: "s"
    icon: mdi:timer-outline
    mode: slider

  serra_pump_main_duration:
    name: "Serra Pump Main Duration"
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer
    mode: slider

  serra_nutrient_duration:
    name: "Serra Nutrient Duration"
    min: 0.5
    max: 10
    step: 0.5
    initial: 1          # default 1s: comodo per la taratura (eroga 1s + pesa)
    unit_of_measurement: "s"
    icon: mdi:timer
    mode: slider

  serra_nutrient_times:
    name: "Serra Nutrient Times"
    min: 1
    max: 10
    step: 1
    icon: mdi:repeat
    mode: slider

  serra_nutrient_interval:
    name: "Serra Nutrient Interval"
    min: 1
    max: 10
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    mode: slider

  # Capacità utile della vasca in litri (default 4.5). Fonte UNICA del "valore
  # magico" 4.5 prima hard-coded in serra_acqua_litri, serra_acqua_stato e come
  # fallback in serra_acqua_cambio_fatto/card DOSAGGIO. Cambia la vasca? Basta
  # questo helper. Serve al dosaggio nutrienti (ml/L * litri) e alla stima L.
  # NIENTE initial: valore di configurazione, deve RESTORARE attraverso i riavvii.
  serra_vasca_litri:
    name: "Serra Capacità Vasca"
    min: 1
    max: 50
    step: 0.5
    unit_of_measurement: "L"
    icon: mdi:cup-water

  # B-f/M7 (2026-07-14): giorno-di-ciclo in cui il booster e' stato dato l'ultima
  # volta (-1 = mai). serra_booster_flag arma il latch SOLO se il booster di OGGI
  # non e' gia' stato dato -> copre recovery dopo riavvio a cavallo della
  # mezzanotte (arma), niente re-arm al riavvio/flap nel giorno gia' confermato.
  # NIENTE initial: deve RESTORARE il giorno dato attraverso i riavvii.
  serra_booster_dato_giorno:
    name: "Serra Booster - giorno ultimo dato"
    min: -1
    max: 400
    step: 1
    icon: mdi:calendar-check

  serra_ring_fade:
    name: "Serra Ring Fade"
    min: 0
    max: 30
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer-outline
    mode: slider

  serra_ring_blink_times:
    name: "Serra Ring Blink Times"
    min: 1
    max: 20
    step: 1
    icon: mdi:repeat
    mode: slider

  serra_ring_blink_duration:
    name: "Serra Ring Blink Duration"
    min: 1
    max: 10
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer
    mode: slider

  serra_ring_blink_interval:
    name: "Serra Ring Blink Interval"
    min: 1
    max: 5
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    mode: slider

  # --- BANCO LUCI (Light Lab): uno slider % per canale ---
  # A=full/bianco, G=verde, B=blu+bianco, R=rosso chiaro, D=rosso profondo.
  # Slider = STAGING del mix: si applica con script.serra_luce_applica_mix (CTA,
  # debounce 1s). Serve per trovare a mano la ricetta viola/crescita da fissare.
  serra_luce_ch_a:
    name: "Serra Luce A (bianco/full)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:white-balance-sunny
    mode: slider
  serra_luce_ch_g:
    name: "Serra Luce G (verde)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:leaf
    mode: slider
  serra_luce_ch_b:
    name: "Serra Luce B (blu+bianco)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water
    mode: slider
  serra_luce_ch_r:
    name: "Serra Luce R (rosso chiaro)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-1
    mode: slider
  serra_luce_ch_d:
    name: "Serra Luce D (rosso profondo)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-1
    mode: slider

  # Durata del fade per Alba/Tramonto (rampa nativa del microcontrollore).
  serra_luce_fade_min:
    name: "Serra Luce - Durata fade (Alba/Tramonto)"
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-sand
    mode: slider

  # Soglia umidita' per le ventole automatiche: sopra la soglia -> ventole ON
  # al livello auto; sotto (soglia - 5, isteresi) -> OFF.
  # Soglia TEMPERATURA per le ventole (solo raffreddamento: le ventole possono
  # solo estrarre aria; se la stanza e' piu' calda della soglia non c'e' margine).
  serra_vent_soglia_temp:
    name: "Serra Ventole - Soglia temperatura"
    # min 18 (era 22): l'essiccazione vuole 18-21°C, la soglia deve poterci stare
    min: 18
    max: 35
    step: 0.5
    # NIENTE initial: la soglia la scrive la sync (serra_fase_auto) dal piano.
    # Con initial, a OGNI riavvio HA la sovrascriverebbe (es. 25 del piano -> 28),
    # e la sync non gira all'avvio -> valore sbagliato fino alle 00:10 (bug 2026-07-14).
