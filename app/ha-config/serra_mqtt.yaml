    # -------------------------------------------------------------------------
    # LIVELLO ACQUA (magnetometro sul controller Nebbia, calibrato empty/full)
    # -------------------------------------------------------------------------
    # Aggiornato EVENT-DRIVEN (niente piu' timer periodico): dopo ogni ricircolo
    #   (serra_acqua_orari, +3 min) e dopo il cambio acqua (serra_acqua_cambio_fatto,
    #   +1 min) HA chiama `serra water level` -> pubblica serra/state/water (retained).
    #   Il timer systemd serra-water-level.timer e' stato RIMOSSO 2026-07-13.
    # La lettura e' affidabile SOLO a pompa spenta (il motore disturba il magnete).
    # Calibrazione salvata in ~/.serra_state.json (water.cal.empty/full); rifarla
    #   se si sposta la vasca o gli elementi sopra (serra water calibrate empty|full).
