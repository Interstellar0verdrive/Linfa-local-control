<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Tre pagine della guida Linfa Local Control</title>
  <desc id="description">Mockup della documentazione: in primo piano il capitolo 01 con lo schema serra, Raspberry Pi, MQTT e Home Assistant; in alto a destra l’illustrazione del cablaggio UART pubblicata nel capitolo 02, TX con RX, RX con TX e GND con GND, senza collegare VCC; in basso a destra i topic MQTT del capitolo 07.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1812"/>
      <stop offset=".62" stop-color="#14271b"/>
      <stop offset="1" stop-color="#253f2d"/>
    </linearGradient>
    <linearGradient id="diagram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2b20"/>
      <stop offset="1" stop-color="#233a29"/>
    </linearGradient>
    <filter id="window-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020a05" flood-opacity=".55"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#030d08" flood-opacity=".42"/>
    </filter>
    <clipPath id="main-clip"><rect x="72" y="100" width="943" height="706" rx="21"/></clipPath>
    <clipPath id="hardware-clip"><rect x="960" y="58" width="570" height="400" rx="19"/></clipPath>
    <clipPath id="mqtt-clip"><rect x="994" y="462" width="548" height="335" rx="19"/></clipPath>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .soft { fill: #a8b9ad; }
      .micro { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .sidebar { font-size: 12px; font-weight: 600; fill: #b5c7b9; }
      .card-title { font-size: 17px; font-weight: 750; fill: #eff6ee; }
      .card-subtitle { font-size: 12px; fill: #acbfb0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#backdrop)"/>
  <circle cx="1390" cy="155" r="275" fill="#8dda9d" opacity=".045"/>
  <circle cx="125" cy="815" r="240" fill="#c3efad" opacity=".035"/>
  <path d="M0 836C348 770 480 824 747 880M1170 0c45 192 185 220 430 223" fill="none" stroke="#a3dca9" stroke-opacity=".11" stroke-width="2"/>
  <text x="73" y="56" class="micro" fill="#b9e6bf">LINFA LOCAL CONTROL <tspan fill="#759c7b"> / </tspan> DOCUMENTAZIONE</text>
  <text x="74" y="858" font-size="15" font-weight="650" fill="#bbd1bd">Dal collegamento fisico al controllo locale.</text>
  <text x="1532" y="858" text-anchor="end" class="micro" fill="#8fb696">INSTALLAZIONE 01—09</text>

  <!-- Capitolo 02: il cablaggio UART presente nella guida, con ogni collegamento su una riga distinta. -->
  <g transform="translate(48 0)">
