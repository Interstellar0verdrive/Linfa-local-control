    <rect x="960" y="58" width="570" height="400" rx="19" fill="#f2f6ed" stroke="#adc7ae" stroke-width="2"/>
  </g>
  <g clip-path="url(#hardware-clip)">
    <rect x="960" y="58" width="570" height="43" fill="#e4ece1"/>
    <circle cx="986" cy="80" r="5" fill="#9fbb9f"/>
    <circle cx="1002" cy="80" r="5" fill="#9fbb9f"/>
    <circle cx="1018" cy="80" r="5" fill="#9fbb9f"/>
    <text x="1054" y="84" font-size="12" font-weight="650" fill="#4c7053">GUIDA / HARDWARE</text>
    <rect x="995" y="124" width="38" height="4" rx="2" fill="#6ba17a"/>
