    <rect x="1082" y="380" width="63" height="25" rx="12" fill="#d8e9d7"/>
    <rect x="1153" y="380" width="140" height="25" rx="12" fill="#d8e9d7"/>
    <text x="1034" y="397" text-anchor="middle" font-size="11" font-weight="750" fill="#356744">3,3 V</text>
