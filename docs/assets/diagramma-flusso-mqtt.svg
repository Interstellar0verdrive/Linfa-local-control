<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo di un comando tra Home Assistant e la serra</title>
  <desc id="desc">Home Assistant pubblica un comando MQTT sul broker. Il bridge sul Raspberry lo passa al controller CLI e via UART2 alla serra. Il Raspberry pubblica l'esito e gli stati logici sul broker, che Home Assistant legge; gli stati non sono telemetria hardware diretta.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15271b"/><stop offset="1" stop-color="#203a28"/></linearGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eyebrow{font-size:12px;font-weight:800;letter-spacing:1.8px;fill:#a8dfa9}
      .head{font-size:20px;font-weight:750;fill:#edf6eb}
      .title{font-size:17px;font-weight:750;fill:#f0f8ef}
      .sub{font-size:12px;fill:#b5c9b7}
      .tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:650;fill:#d1eccb}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="430" rx="22" fill="url(#bg)" stroke="#4b7051" stroke-width="2"/>
  <text x="34" y="38" class="eyebrow">07 / CICLO MQTT</text>
  <text x="34" y="70" class="head">Un comando, poi un esito e uno stato logico</text>
  <text x="34" y="101" font-size="11" font-weight="800" letter-spacing="1.4" fill="#a8dfa9">ANDATA · COMANDO</text>
  <g fill="#294431" stroke="#6f9673" stroke-width="1.4">
    <rect x="34" y="117" width="158" height="82" rx="12"/><rect x="224" y="117" width="158" height="82" rx="12"/>
    <rect x="414" y="117" width="158" height="82" rx="12"/><rect x="604" y="117" width="158" height="82" rx="12"/>
  </g>
  <text x="50" y="146" class="title">Home Assistant</text><text x="50" y="169" class="sub">Pubblica il payload</text>
  <text x="240" y="146" class="title">Broker MQTT</text><text x="240" y="169" class="tag">serra/cmd</text>
  <text x="430" y="146" class="title">Raspberry Pi</text><text x="430" y="169" class="sub">Bridge → CLI</text>
  <text x="620" y="146" class="title">Serra Linfa</text><text x="620" y="169" class="sub">Console UART2</text>
  <g fill="none" stroke="#a8dfa9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 158h22m-8-6 8 6-8 6"/>
    <path d="M386 158h22m-8-6 8 6-8 6"/>
    <path d="M576 158h22m-8-6 8 6-8 6"/>
  </g>
  <text x="34" y="226" font-size="11" font-weight="800" letter-spacing="1.4" fill="#a8dfa9">RITORNO · PUBBLICATO DAL RASPBERRY</text>
  <g fill="#253a2b" stroke="#658a6a" stroke-width="1.4">
    <rect x="34" y="243" width="218" height="94" rx="12"/><rect x="290" y="243" width="218" height="94" rx="12"/>
    <rect x="546" y="243" width="216" height="94" rx="12"/>
  </g>
  <text x="50" y="273" class="title">Home Assistant</text><text x="50" y="299" class="sub">Legge risultato e stato</text>
  <text x="306" y="273" class="title">Broker MQTT</text><text x="306" y="299" class="tag">status/last · state/*</text>
  <text x="562" y="273" class="title">Raspberry Pi</text><text x="562" y="299" class="sub">Esito + stato atteso</text>
  <g fill="none" stroke="#a8dfa9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M541 287h-28m8-6-8 6 8 6"/>
    <path d="M285 287h-28m8-6-8 6 8 6"/>
  </g>
  <path d="M493 201v16h160v22" fill="none" stroke="#729a79" stroke-width="1.7" stroke-dasharray="4 5"/>
  <path d="M34 358H766" stroke="#426348"/>
  <text x="34" y="382" class="sub">Lo stato pubblicato deriva dai comandi e dai timer del controller.</text>
  <text x="34" y="402" class="sub">Non equivale a una misura diretta e continua dei componenti della serra.</text>
</svg>
