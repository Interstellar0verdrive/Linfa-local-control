<svg class="technical-diagram" xmlns="http://www.w3.org/2000/svg" width="800" height="392" viewBox="0 0 800 392" role="img" aria-labelledby="title desc">
  <title id="title">Cablaggio della console UART2</title>
  <desc id="desc">L'adattatore USB TTL a 3,3 volt collega TX a RX della serra, RX a TX della serra e GND a GND. VCC rimane scollegato. Lo schema mostra i segnali, non la posizione fisica dei pin.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15271b"/><stop offset="1" stop-color="#203a28"/></linearGradient>
    <marker id="right" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L7 4 1 7" fill="none" stroke="#a8dfa9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="left" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M7 1L1 4 7 7" fill="none" stroke="#a8dfa9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .technical-diagram text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .technical-diagram .eyebrow{font-size:12px;font-weight:800;letter-spacing:1.8px;fill:#a8dfa9}
      .technical-diagram .head{font-size:20px;font-weight:750;fill:#edf6eb}
      .technical-diagram .sub{font-size:13px;fill:#b5c9b7}
      .technical-diagram .pin{font-size:18px;font-weight:800;fill:#f2f8f0}
      .technical-diagram .label{font-size:13px;font-weight:700;fill:#bde3bc}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="390" rx="22" fill="url(#bg)" stroke="#4b7051" stroke-width="2"/>
  <text x="34" y="38" class="eyebrow">02 / COLLEGAMENTO FISICO</text>
  <text x="34" y="70" class="head">Tre segnali, alimentazioni separate</text>
  <rect x="34" y="94" width="243" height="42" rx="9" fill="#2c4732" stroke="#678c6b"/>
  <text x="51" y="120" class="label">ADATTATORE USB → TTL · 3,3 V</text>
  <rect x="523" y="94" width="243" height="42" rx="9" fill="#2c4732" stroke="#678c6b"/>
  <text x="540" y="120" class="label">SCHEDA SUPERIORE · UART2</text>
  <path d="M278 165H522M278 213H522M278 261H522" stroke="#789b7d" stroke-width="1" stroke-dasharray="3 6"/>
  <g fill="#263e2d" stroke="#709b75" stroke-width="1.5">
    <rect x="46" y="149" width="109" height="35" rx="9"/><rect x="645" y="149" width="109" height="35" rx="9"/>
    <rect x="46" y="197" width="109" height="35" rx="9"/><rect x="645" y="197" width="109" height="35" rx="9"/>
    <rect x="46" y="245" width="109" height="35" rx="9"/><rect x="645" y="245" width="109" height="35" rx="9"/>
  </g>
  <text x="100" y="172" class="pin" text-anchor="middle">TX</text><text x="700" y="172" class="pin" text-anchor="middle">RX</text>
  <text x="100" y="220" class="pin" text-anchor="middle">RX</text><text x="700" y="220" class="pin" text-anchor="middle">TX</text>
  <text x="100" y="268" class="pin" text-anchor="middle">GND</text><text x="700" y="268" class="pin" text-anchor="middle">GND</text>
  <path d="M163 166H627" stroke="#a8dfa9" stroke-width="3" stroke-linecap="round" marker-end="url(#right)"/>
  <path d="M637 214H173" stroke="#a8dfa9" stroke-width="3" stroke-linecap="round" marker-end="url(#left)"/>
  <path d="M163 262H637" stroke="#a3baa5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="262" r="5" fill="#a3baa5"/>
  <rect x="46" y="292" width="109" height="35" rx="9" fill="#4a3225" stroke="#bb7854"/>
  <text x="100" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffdbbe">VCC</text>
  <path d="M163 310H310" stroke="#d69670" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="327" cy="310" r="15" fill="#68402d"/>
  <path d="M321 304l12 12m0-12-12 12" stroke="#ffdbc0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="358" y="315" font-size="15" font-weight="750" fill="#ffdbc0">NON COLLEGARE</text>
  <path d="M34 344H766" stroke="#426348"/>
  <text x="34" y="369" class="sub">Schema dei segnali, non della posizione fisica dei pin: usa la foto della scheda per individuarli.</text>
</svg>
